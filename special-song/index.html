<!doctype html>
<html
  lang="ko"
  data-resolution="landscape"
  data-composition-variables='[{"id":"chroma","type":"color","label":"Chroma key colour","default":"#00ff00"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --chroma: #00ff00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #verse1 {
        z-index: 1;
      }
      #verse2 {
        z-index: 2;
      }
      #title {
        z-index: 3;
      }
      #green {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: var(--chroma);
      }
      /* bottom tint behind the lyrics, drawn into the green on purpose. The keyer
         drops the light top of the ramp and keeps the dark bottom; the end colour
         leans magenta so the kept part keys to a neutral dark, not dark green
         (OBS defaults: clear above ~y 840, dark from ~y 920) */
      #tint {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      #tint-ramp {
        position: absolute;
        left: 0;
        right: 0;
        top: 580px;
        height: 500px;
        background: linear-gradient(to bottom, rgba(19, 5, 19, 0.000) 0%, rgba(19, 5, 19, 0.182) 10%, rgba(19, 5, 19, 0.346) 20%, rgba(19, 5, 19, 0.490) 30%, rgba(19, 5, 19, 0.614) 40%, rgba(19, 5, 19, 0.720) 50%, rgba(19, 5, 19, 0.806) 60%, rgba(19, 5, 19, 0.874) 70%, rgba(19, 5, 19, 0.922) 80%, rgba(19, 5, 19, 0.950) 90%, rgba(19, 5, 19, 0.960) 100%);
      }
      #lyrics {
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="318.28"
      data-width="1920"
      data-height="1080"
    >
      <!-- Prelude: verses over images, then the title (0 – 27.5 s) -->
      <div
        id="verse1"
        data-composition-id="verse1"
        data-composition-src="compositions/verse1.html"
        data-start="0"
        data-duration="11"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="verse2"
        data-composition-id="verse2"
        data-composition-src="compositions/verse2.html"
        data-start="9.9"
        data-duration="12.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="21.4"
        data-duration="6.1"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- MR part: pure chroma green with lyrics at the bottom (27.5 s – end) -->
      <div id="green" class="clip" data-start="27.5" data-duration="290.78" data-track-index="4" data-hold></div>
      <!-- tint only while lyrics run: MR 26.8 s – 276.1 s -->
      <div id="tint" class="clip" data-start="54.3" data-duration="249.3" data-track-index="8" data-hold>
        <div id="tint-ramp"></div>
      </div>
      <div
        id="lyrics"
        data-composition-id="lyrics"
        data-composition-src="compositions/lyrics.html"
        data-start="27.5"
        data-duration="290.78"
        data-track-index="5"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio
        id="bgm"
        class="clip"
        src="assets/bgm/prelude.wav"
        data-start="0"
        data-duration="27"
        data-track-index="6"
        data-volume="0.6"
        data-fade-in="1.5"
        data-fade-out="2"
      ></audio>
      <audio
        id="mr"
        class="clip"
        src="assets/audio/mr.mp3"
        data-start="27.5"
        data-duration="290.78"
        data-track-index="7"
        data-volume="0.78"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tint-ramp", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power1.inOut" }, 54.3);
      tl.fromTo("#tint-ramp", { opacity: 1 }, { opacity: 0, duration: 1.5, ease: "power1.inOut", immediateRender: false }, 302.1);
      tl.set({}, {}, 318.28);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
