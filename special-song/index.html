<!doctype html>
<html
  lang="ko"
  data-resolution="landscape"
  data-composition-variables='[{"id":"chroma","type":"color","label":"Chroma key colour","default":"#00ff00"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --chroma: #00ff00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #verse1 {
        z-index: 1;
      }
      #verse2 {
        z-index: 2;
      }
      #title {
        z-index: 3;
      }
      #green {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: var(--chroma);
      }
      /* tint under the lyrics, painted into the green: darkest at the bottom,
         eased away by the middle of the glyphs. Strong enough that a keyer keeps
         part of it; strength is LEVEL in tools/build_tint.py, picked with
         calibration.html on the venue's own keyer */
      #tint {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      #tint-ramp {
        position: absolute;
        left: 0;
        right: 0;
        top: 849px;
        height: 231px;
        background: linear-gradient(to bottom, rgba(19, 5, 19, 0.000) 0%, rgba(19, 5, 19, 0.028) 3%, rgba(19, 5, 19, 0.103) 6.1%, rgba(19, 5, 19, 0.209) 9.1%, rgba(19, 5, 19, 0.331) 12.1%, rgba(19, 5, 19, 0.454) 15.2%, rgba(19, 5, 19, 0.564) 18.2%, rgba(19, 5, 19, 0.644) 21.2%, rgba(19, 5, 19, 0.679) 24.2%, rgba(19, 5, 19, 0.681) 27.3%, rgba(19, 5, 19, 0.683) 30.3%, rgba(19, 5, 19, 0.687) 33.3%, rgba(19, 5, 19, 0.693) 36.4%, rgba(19, 5, 19, 0.700) 39.4%, rgba(19, 5, 19, 0.708) 42.4%, rgba(19, 5, 19, 0.717) 45.5%, rgba(19, 5, 19, 0.727) 48.5%, rgba(19, 5, 19, 0.738) 51.5%, rgba(19, 5, 19, 0.749) 54.5%, rgba(19, 5, 19, 0.761) 57.6%, rgba(19, 5, 19, 0.773) 60.6%, rgba(19, 5, 19, 0.785) 63.6%, rgba(19, 5, 19, 0.797) 66.7%, rgba(19, 5, 19, 0.809) 69.7%, rgba(19, 5, 19, 0.820) 72.7%, rgba(19, 5, 19, 0.831) 75.8%, rgba(19, 5, 19, 0.841) 78.8%, rgba(19, 5, 19, 0.851) 81.8%, rgba(19, 5, 19, 0.859) 84.8%, rgba(19, 5, 19, 0.866) 87.9%, rgba(19, 5, 19, 0.872) 90.9%, rgba(19, 5, 19, 0.876) 93.9%, rgba(19, 5, 19, 0.879) 97%, rgba(19, 5, 19, 0.880) 100%);
      }
      #lyrics {
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="300.4"
      data-width="1920"
      data-height="1080"
    >
      <!-- Prelude: verses over images, then the title (0 – 27.5 s) -->
      <div
        id="verse1"
        data-composition-id="verse1"
        data-composition-src="compositions/verse1.html"
        data-start="0"
        data-duration="11"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="verse2"
        data-composition-id="verse2"
        data-composition-src="compositions/verse2.html"
        data-start="9.9"
        data-duration="12.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="21.4"
        data-duration="6.1"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- MR part: pure chroma green with lyrics at the bottom (27.5 s – end) -->
      <div id="green" class="clip" data-start="27.5" data-duration="272.9" data-track-index="4" data-hold></div>
      <!-- tint only while lyrics run: 1.75 s before the first line to 0.1 s after the last (+1.5 s fades) -->
      <div id="tint" class="clip" data-start="52.92" data-duration="237.61" data-track-index="8" data-hold>
        <div id="tint-ramp"></div>
      </div>
      <div
        id="lyrics"
        data-composition-id="lyrics"
        data-composition-src="compositions/lyrics.html"
        data-start="27.5"
        data-duration="272.9"
        data-track-index="5"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio
        id="bgm"
        class="clip"
        src="assets/bgm/prelude.wav"
        data-start="0"
        data-duration="27"
        data-track-index="6"
        data-volume="0.6"
        data-fade-in="1.5"
        data-fade-out="2"
      ></audio>
      <!-- tempo-105% MR; the file carries digital clicks from ~271.86 s to its end, so stop just before them -->
      <audio
        id="mr"
        class="clip"
        src="assets/audio/mr.mp3"
        data-start="27.5"
        data-duration="271.8"
        data-track-index="7"
        data-volume="0.78"
        data-fade-out="2"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tint-ramp", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power1.inOut" }, 52.92);
      tl.fromTo("#tint-ramp", { opacity: 1 }, { opacity: 0, duration: 1.5, ease: "power1.inOut", immediateRender: false }, 289.03);
      tl.set({}, {}, 300.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
