<!doctype html>
<html
  lang="ko"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-paper","type":"color","label":"Paper","default":"#F3EEE3"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#14121A"},
    {"id":"color-cobalt","type":"color","label":"N pole (groom)","default":"#2F3BFF"},
    {"id":"color-pink","type":"color","label":"S pole (bride)","default":"#FF5C8A"},
    {"id":"color-violet","type":"color","label":"Overprint","default":"#6A2BD9"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>반대가 끌리는 이유</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/anime.umd.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/kinetic.js"></script>
    <script src="assets/js/design.js"></script>
    <script src="assets/js/green.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 400; src: url("assets/fonts/Pretendard-Regular.woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2"); }
      @font-face { font-family: "Noto Serif KR"; font-weight: 200 900; src: url("assets/fonts/NotoSerifKR-VF.ttf"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); }
      @font-face { font-family: "Mrs Saint Delafield"; src: url("assets/fonts/MrsSaintDelafield-Regular.ttf"); }
      @font-face { font-family: "Cormorant"; font-style: italic; src: url("assets/fonts/CormorantGaramond-Italic.ttf"); }
      :root {
        --color-paper: #f3eee3;
        --color-ink: #14121a;
        --color-cobalt: #2f3bff;
        --color-pink: #ff5c8a;
        --color-violet: #6a2bd9;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ink);
      }
      /* the look: a soft optical vignette and a faint warm print tone over every scene */
      #look {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(ellipse 78% 82% at 50% 48%, rgba(12, 10, 8, 0) 58%, rgba(12, 10, 8, 0.32) 100%);
      }
      #tone {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 98;
        background: #e8c9a0;
        mix-blend-mode: soft-light;
        opacity: 0.12;
      }
      #grain {
        position: absolute;
        inset: -64px;
        background-image: url("assets/media/tex/grain.png");
        background-size: 512px 512px;
        mix-blend-mode: overlay;
        opacity: 0.05;
        pointer-events: none;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="184.739" data-width="1920" data-height="1080">
      <audio id="music" data-timeline-role="music" class="clip" data-start="0" data-duration="184.739" data-track-index="0" data-volume="1" src="assets/audio/edit.wav"></audio>

      <div id="s0" data-composition-id="s0" data-composition-src="compositions/s0-intro.html" data-start="0.0" data-duration="19.107" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-rap1.html" data-start="19.1065" data-duration="35.481" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-chorus1.html" data-start="54.5877" data-duration="38.051" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-rap2.html" data-start="92.639" data-duration="23.51" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-bridge.html" data-start="116.149" data-duration="16.901" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-final.html" data-start="133.0502" data-duration="38.52" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-outro.html" data-start="171.5703" data-duration="13.169" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <filter id="hb1" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="8 0" /></filter>
          <filter id="hb2" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="18 0" /></filter>
          <filter id="hb3" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="32 0" /></filter>
          <filter id="hb4" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur stdDeviation="52 0" /></filter>
        </defs>
      </svg>
      <div id="tone" class="clip" data-start="0" data-duration="184.739" data-track-index="2" data-layout-ignore></div>
      <div id="look" class="clip" data-start="0" data-duration="184.739" data-track-index="2" data-layout-ignore></div>
      <div id="grain" class="clip" data-start="0" data-duration="184.739" data-track-index="2" data-layout-ignore></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // printed-matter grain: the plate jumps to a new seeded offset every frame (deterministic)
      const grain = document.getElementById("grain");
      const g = { f: 0 };
      tl.fromTo(
        g,
        { f: 0 },
        {
          f: FILM.duration * 30,
          duration: FILM.duration,
          ease: "none",
          onUpdate: () => {
            const n = Math.floor(g.f);
            const x = ((n * 7919) % 509) - 254;
            const y = ((n * 104729) % 499) - 249;
            grain.style.backgroundPosition = x + "px " + y + "px";
          },
        },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
