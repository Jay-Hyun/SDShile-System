<template>
  <style>
    @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2"); }
    @font-face { font-family: "Noto Serif KR"; font-weight: 200 900; src: url("assets/fonts/NotoSerifKR-VF.ttf"); }

    #root { position: absolute; inset: 0; overflow: hidden; background: #161514; }
    .kt { line-height: 1.12; will-change: transform, opacity, filter; }
    .kt .syl { display: inline-block; }
    .A { font-family: "Pretendard"; font-weight: 900; letter-spacing: -0.035em; }
    .B { font-family: "Noto Serif KR"; font-weight: 500; }
    .Bb { font-family: "Noto Serif KR"; font-weight: 700; letter-spacing: -0.015em; }
    .ink { color: #161514; }
    .ivory { color: #f7f3ec; }
    .rose { color: #a65e66; }
    .on-photo { color: #f7f3ec; text-shadow: 0 2px 28px rgba(10, 9, 8, 0.55), 0 1px 3px rgba(10, 9, 8, 0.35); }
    .paper { background: radial-gradient(ellipse 80% 90% at 50% 40%, #f7f3ec 0%, #efe9df 70%, #e6dfd3 100%); }
    .fill, .fill video, .fill img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .fill { overflow: hidden; }
    .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(to top, rgba(12, 11, 10, 0.64), rgba(12, 11, 10, 0)); }
    .panel { position: absolute; top: 0; width: 640px; height: 1080px; overflow: hidden; }
    .print { position: absolute; overflow: hidden; background: #fff; padding: 12px; box-shadow: 0 24px 50px rgba(22, 21, 20, 0.28); }
    .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* memory tunnel */
    #s5-cam { position: absolute; inset: 0; perspective: 1100px; perspective-origin: 50% 50%; }
    #s5-world { position: absolute; left: 960px; top: 540px; transform-style: preserve-3d; }
    .mem { position: absolute; overflow: hidden; background: #fff; padding: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); backface-visibility: hidden; }
    .mem img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>

  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="s5-stage" style="position:absolute;inset:0"></div>
    <div id="s5-media" style="display:none">
      <div id="s5-kiss" class="fill"><video id="s5-kiss-v" class="clip" data-start="0" data-duration="1.95" data-track-index="2" src="assets/media/living/fc_w06.mp4" muted playsinline></video></div>
      <div id="s5-n1" class="fill"><video id="s5-n1-v" class="clip" data-start="1.5" data-duration="5.4" data-track-index="2" src="assets/media/living/fc_w41.mp4" muted playsinline></video></div>
      <div id="s5-n2" class="fill"><video id="s5-n2-v" class="clip" data-start="1.5" data-duration="5.4" data-track-index="3" src="assets/media/living/fc_w43.mp4" muted playsinline></video></div>
      <div id="s5-n3" class="fill"><video id="s5-n3-v" class="clip" data-start="1.5" data-duration="5.4" data-track-index="4" src="assets/media/living/fc_w44.mp4" muted playsinline></video></div>
      <div id="s5-lift" class="fill"><video id="s5-lift-v" class="clip" data-start="6.4" data-duration="4.4" data-track-index="2" src="assets/media/living/fc_w19.mp4" muted playsinline></video></div>
      <div id="s5-flow" class="fill"><video id="s5-flow-v" class="clip" data-start="17.5" data-duration="4.4" data-playback-rate="0.55" data-track-index="2" src="assets/media/video/v04.mp4" muted playsinline></video></div>
      <div id="s5-heart" class="fill"><video id="s5-heart-v" class="clip" data-start="25.0" data-duration="5.1" data-playback-rate="0.9" data-track-index="2" src="assets/media/video/v08.mp4" muted playsinline></video></div>
      <div id="s5-h1" class="fill"><video id="s5-h1-v" class="clip" data-start="29.6" data-duration="2.9" data-track-index="2" src="assets/media/living/fc_w35.mp4" muted playsinline></video></div>
      <div id="s5-h2" class="fill"><video id="s5-h2-v" class="clip" data-start="32.0" data-duration="2.8" data-track-index="3" src="assets/media/living/fc_w38.mp4" muted playsinline></video></div>
      <div id="s5-h3" class="fill"><video id="s5-h3-v" class="clip" data-start="34.4" data-duration="3.0" data-track-index="4" src="assets/media/living/fc_w45.mp4" muted playsinline></video></div>
      <div id="s5-end-bg" class="fill"><video id="s5-end-bg-v" class="clip" data-start="36.9" data-duration="2.0" data-playback-rate="0.6" data-track-index="2" src="assets/media/living/fc_w04L_bg.mp4" muted playsinline></video></div>
      <div id="s5-end-fg" class="fill"><video id="s5-end-fg-v" class="clip" data-start="36.9" data-duration="2.0" data-playback-rate="0.6" data-track-index="3" src="assets/media/living/fc_w04L_fg.webm" muted playsinline></video></div>
    </div>
  </div>

  <script>
    (function () {
      const S = K.scene("s5");
      const at = K.timeline();
      const gtl = gsap.timeline({ paused: true });
      const W = K.flat(S, 80);
      const END = S.dur * 1000;
      const T = (i) => (W[i] ? W[i].ms : END);
      const E = K.ease;
      const stage = document.getElementById("s5-stage");
      const take = (id, parent) => { const m = document.getElementById(id); parent.appendChild(m); return m; };

      function rig(t0, t1, { xf = 0, cls = "" } = {}) {
        const shot = K.el("div", "shot " + cls, stage);
        shot.style.cssText = "position:absolute;inset:0;overflow:hidden";
        const cam = K.el("div", "cam", shot);
        cam.style.cssText = "position:absolute;inset:0;transform-origin:50% 50%";
        at.set(shot, { opacity: 0 }, 0);
        if (xf) at.add(shot, { opacity: [0, 1], duration: xf, ease: E.inout }, Math.max(0, t0 - xf / 2));
        else at.set(shot, { opacity: 1 }, t0);
        at.set(shot, { opacity: 0 }, t1 + 450);
        return { shot, cam };
      }
      function soft(el, t, { dur = 700, rise = 16, blur = 12 } = {}) {
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], y: [rise, 0], filter: [`blur(${blur}px)`, "blur(0px)"], duration: dur, ease: E.expo }, t);
      }
      function out(els, t, dur = 340) {
        at.add(els, { opacity: [1, 0], filter: ["blur(0px)", "blur(10px)"], duration: dur, ease: E.in3 }, t);
      }
      function line(parent, idx, cls, css, align = "center") {
        const row = K.el("div", "kt " + cls, parent);
        row.style.cssText += `position:absolute;left:0;right:0;text-align:${align};white-space:nowrap`;
        for (const [k, v] of Object.entries(css)) row.style[k] = typeof v === "number" ? v + "px" : v;
        return idx.map((i, k) => {
          const sp = K.el("span", "", row, W[i].t);
          sp.style.display = "inline-block";
          if (k < idx.length - 1) K.el("span", "", row, " ");
          soft(sp, T(i));
          return sp;
        });
      }

      // ---- A. THE DROP — 사랑할: the word is cut out of the light, the kiss is inside it; on 같아요 we fly through
      {
        const { shot, cam } = rig(0, T(3));
        take("s5-kiss", cam);
        // geometry: python scripts/knock_points.py "사랑할" assets/fonts/NotoSerifKR-VF.ttf 800 560 - 1085,450
        const geo = { x: 148.5, baseline: 748.5, deep: [939, 361] };
        const { wrap } = K.knock(cam, "사랑할", geo, { fill: "#f2ede4", size: 560, weight: 800 });
        const rest = K.txt(wrap, "것 같아요", "B ink", { left: 0, right: 0, top: 880, fontSize: 64, textAlign: "center" });
        soft(rest, T(1), { dur: 500 });
        at.add(wrap, { scale: [1.18, 1], duration: 900, ease: E.expo }, 0);
        K.zoomThrough(at, wrap, T(2) + 120, { dur: 560, to: 36 });
        K.flashFrame(at, shot, 0, { dur: 520, peak: 1 });
        K.shake(at, cam, 0, { amp: 16, seed: 21, dur: 520 });
      }

      // ---- B. 우린 서로 너무 다르지만요 — night by the river, three frames arriving word by word
      {
        const { cam } = rig(T(3), T(7));
        cam.style.background = "#0c0b0a";
        [["s5-n1", 0, T(3), -1], ["s5-n2", 640, T(4), 1], ["s5-n3", 1280, T(5), -1]].forEach(([id, x, t, d], j) => {
          const p = K.el("div", "panel", cam);
          p.style.left = x + "px";
          take(id, p);
          at.set(p, { opacity: 0 }, 0);
          at.set(p, { opacity: 1 }, t - 60);
          at.add(p, { y: [d * 1080, 0], duration: 560, ease: E.expo }, t - 60);
        });
        const gut = K.el("div", "", cam);
        gut.style.cssText = "position:absolute;inset:0;background:linear-gradient(90deg,transparent 639px,#0c0b0a 639px,#0c0b0a 641px,transparent 641px,transparent 1279px,#0c0b0a 1279px,#0c0b0a 1281px,transparent 1281px)";
        K.el("div", "shade", cam);
        const a = line(cam, [3, 4, 5], "B on-photo", { top: 700, fontSize: 84 });
        out(a, T(6) - 200, 240);
        const big = K.txt(cam, W[6].t, "Bb on-photo", { left: 0, right: 0, top: 800, fontSize: 150, textAlign: "center" });
        K.slam(at, big, T(6), T(7), { from: 1.2, creep: 1.03, blur: 14 });
        K.shake(at, cam, T(6), { amp: 12, seed: 5 });
        K.pulse(at, cam, S, T(3), T(7), { amp: 0.01 });
      }

      // ---- C. 사랑은 참 신비로운 거죠 — he lifts her; warm light leaks across, widescreen
      {
        const { shot, cam } = rig(T(7), T(11), { xf: 300 });
        take("s5-lift", cam);
        K.el("div", "shade", cam);
        K.letterbox(at, shot, T(7) - 150, { dur: 800 });
        K.leak(at, shot, T(7) + 100, 3900, { peak: 0.55 });
        line(cam, [7, 8, 9, 10], "B on-photo", { top: 800, fontSize: 96 });
      }

      // ---- D. 살아 가면서 한 번 올까 말까 한 그런 사랑인데 — the camera flies through their memories,
      //      speeding up toward 그런 사랑인데, then a burst of light
      let camD;
      {
        const { shot, cam } = rig(T(11), T(20), { xf: 360 });
        camD = cam;
        cam.style.background = "radial-gradient(ellipse 70% 70% at 50% 50%, #2a2724, #121110)";
        const camEl = K.el("div", "", cam);
        camEl.id = "s5-cam";
        const world = K.el("div", "", camEl);
        world.id = "s5-world";
        const keys = ["d00", "w28", "d10", "w01", "d46", "w37", "d18", "w20", "d04", "w34", "d63", "w02", "d48", "w27", "d05", "w14", "d56", "w42", "d09", "w32", "d73", "w04", "d67", "w38", "d44", "w25", "d40", "w39"];
        const rng = K.rng(11);
        const depth = 9000;
        const t0 = T(11) - 200, t1 = T(20) + 450;
        // ease: slow drift, accelerating through the middle, easing out after the burst
        const fly = K.A.cubicBezier(0.55, 0.05, 0.35, 1);
        // invert the ease numerically so each card can find when the camera passes it
        const when = (frac) => {
          let lo = 0, hi = 1;
          for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (fly(m) < frac) lo = m; else hi = m; }
          return t0 + lo * (t1 - t0);
        };
        keys.forEach((k, j) => {
          const card = K.el("div", "mem", world);
          const land = /^d/.test(k);
          const w = land ? 420 : 300, h = land ? 300 : 410;
          const side = j % 2 ? 1 : -1;
          const x = side * (430 + rng() * 520) - w / 2;
          const y = (rng() - 0.5) * 760 - h / 2;
          const z = -500 - (j / keys.length) * depth;
          card.style.cssText += `width:${w}px;height:${h}px;transform:translate3d(${x}px,${y}px,${z}px) rotateY(${-side * (8 + rng() * 10)}deg) rotateZ(${(rng() - 0.5) * 8}deg)`;
          K.img(card, K.photo(k), { position: "static", width: "100%", height: "100%" });
          const tIn = when(Math.max(0, (-z - 3800) / (depth + 600)));
          const tOut = when(Math.min(1, (-z - 250) / (depth + 600)));
          at.set(card, { opacity: 0 }, 0);
          at.add(card, { opacity: [0, 1], duration: 800, ease: "linear" }, tIn);
          at.add(card, { opacity: [1, 0], duration: 200, ease: "linear" }, Math.max(tIn + 800, tOut));
        });
        at.add(world, { translateZ: [0, depth + 600], duration: t1 - t0, ease: fly }, t0);
        const halo = K.el("div", "", cam);
        halo.style.cssText = "position:absolute;left:460px;top:330px;width:1000px;height:420px;background:radial-gradient(ellipse at center, rgba(18,17,16,.75), rgba(18,17,16,0) 70%)";
        const p1 = line(cam, [11, 12], "B on-photo", { top: 470, fontSize: 96 });
        out(p1, T(13) - 340);
        const p2 = line(cam, [13, 14, 15, 16, 17], "B on-photo", { top: 470, fontSize: 96 });
        out(p2, T(18) - 200, 240);
        // the flight ends in one picture: his hands on her face
        const last = K.el("div", "fill", cam);
        K.img(last, K.photo("w26"), {}).style.objectPosition = "50% 30%";
        K.window(at, last, T(18) - 20, null);
        at.add(last, { scale: [1.18, 1.04], duration: T(20) - T(18) + 500, ease: E.expo }, T(18) - 20);
        K.el("div", "shade", last);
        const p3 = line(cam, [18, 19], "Bb on-photo", { top: 800, fontSize: 130 });
        K.flashFrame(at, shot, T(18), { dur: 600, peak: 0.9 });
        K.leak(at, shot, T(18), 1800, { peak: 0.5, from: "right" });
      }

      // ---- E. 다가 온 것 같아요 — flowers, slowed right down; whip in
      const tE = T(20);
      const Eo = rig(tE - 180, T(24));
      {
        take("s5-flow", Eo.cam).querySelector("video").style.objectPosition = "50% 30%";
        K.el("div", "shade", Eo.cam);
        line(Eo.cam, [20, 21, 22, 23], "B on-photo", { top: 810, fontSize: 100 });
        K.whip(at, camD, Eo.cam, tE - 180, { dir: 1, dur: 340 });
      }

      // ---- F. 꿈 꾸던 모습은 아니지만요 — the photo-booth strips land on the beat, each one a hit
      {
        const { cam } = rig(T(24), T(28), { cls: "paper" });
        const hits = [T(24), T(25), T(26)];
        [["d15", 300, 260, 440, 330, -5], ["d18", 795, 230, 330, 700, 2], ["d16", 1220, 380, 440, 330, 4]].forEach(([k, x, y, w, h, rot], j) => {
          const p = K.el("div", "print", cam);
          p.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
          K.img(p, K.photo(k), { position: "static", width: "100%", height: "100%" });
          at.set(p, { opacity: 0 }, 0);
          at.set(p, { opacity: 1 }, hits[j]);
          at.add(p, { y: [-260, 0], rotate: [rot * 3, rot], scale: [1.25, 1], duration: 420, ease: E.expo }, hits[j]);
          K.shake(at, cam, hits[j] + 60, { amp: 8, seed: 30 + j, dur: 300 });
        });
        at.add(cam, { scale: [1.0, 1.05], duration: T(28) - T(24), ease: "linear" }, T(24));
        const ws = line(cam, [24, 25, 26], "B ink", { top: 70, fontSize: 92 });
        const big = K.txt(cam, W[27].t, "Bb rose", { left: 0, right: 0, top: 900, fontSize: 120, textAlign: "center" });
        K.slam(at, big, T(27), null, { from: 1.2, blur: 12 });
      }

      // ---- G. 서로를 웃게 만들죠 — heart hands; the frame kicks on 웃게
      {
        const { shot, cam } = rig(T(28), T(31));
        take("s5-heart", cam);
        K.el("div", "shade", cam);
        K.flashFrame(at, shot, T(28), { dur: 260, peak: 0.6 });
        K.punch(at, cam, T(28), { from: 1.06 });
        K.punch(at, cam, T(29), { from: 1.09, dur: 460 });
        K.shake(at, cam, T(29), { amp: 10, seed: 41 });
        line(cam, [28, 29, 30], "B on-photo", { top: 810, fontSize: 100 });
      }

      // ---- H. 니 곁에 있으면 자꾸만 행복하단 생각이 들죠 — walking on: the park, the grass, the river at night
      {
        const tA = T(31), tB = T(34) - 300, tC = T(36) - 200;
        const h1 = rig(tA, tB, { xf: 420 });
        take("s5-h1", h1.cam);
        const h2 = rig(tB, tC, { xf: 700 });
        take("s5-h2", h2.cam);
        const h3 = rig(tC, T(38), { xf: 700 });
        take("s5-h3", h3.cam);
        const top = rig(tA, T(38), { xf: 420 });
        K.el("div", "shade", top.cam);
        K.letterbox(at, top.cam, tA - 200, { dur: 900 });
        K.leak(at, top.cam, tB - 600, 2600, { peak: 0.4, from: "left" });
        K.leak(at, top.cam, tC - 400, 2800, { peak: 0.4, from: "right", tone: "rose" });
        const a = line(top.cam, [31, 32, 33], "B on-photo", { top: 800, fontSize: 96 });
        out(a, T(34) - 340);
        line(top.cam, [34, 35, 36, 37], "B on-photo", { top: 800, fontSize: 96 });
      }

      // ---- I. 사랑할 것 같아요 — the last one: the word stands behind them, slowed, and holds
      {
        const { shot, cam } = rig(T(38), END + 600);
        take("s5-end-bg", cam);
        const word = K.txt(cam, "사랑할", "Bb ink", { left: 0, right: 0, top: -20, fontSize: 380, textAlign: "center" });
        K.syllables(word).forEach((s, k) => soft(s, T(38) + k * 90, { dur: 1100, rise: 70, blur: 18 }));
        take("s5-end-fg", cam);
        const rest = K.txt(cam, "것 같아요", "B on-photo", { left: 0, right: 0, top: 880, fontSize: 84, textAlign: "center" });
        soft(rest, T(39), { dur: 900 });
        K.flashFrame(at, shot, T(38), { dur: 420, peak: 0.85 });
        K.punch(at, cam, T(38), { from: 1.08, dur: 700 });
        const dip = K.el("div", "", shot);
        dip.style.cssText = "position:absolute;inset:0;background:#d6d2cb;z-index:60";
        at.set(dip, { opacity: 0 }, 0);
        at.add(dip, { opacity: [0, 1], duration: 380, ease: E.in3 }, END - 380);
      }

      K.bridge(gtl, at, S.dur);
      window.__timelines["s5"] = gtl;
    })();
  </script>
</template>
