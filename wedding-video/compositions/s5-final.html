<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #161514; }
    .shot { position: absolute; inset: 0; overflow: hidden; }
    .on-photo { color: #f7f3ec; text-shadow: 0 2px 28px rgba(10, 9, 8, 0.55), 0 1px 3px rgba(10, 9, 8, 0.35); }
    .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(to top, rgba(12, 11, 10, 0.6), rgba(12, 11, 10, 0)); }
    .print { position: absolute; overflow: hidden; background: #fff; padding: 12px; box-shadow: 0 24px 50px rgba(22, 21, 20, 0.28); }
    .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .frame-pill { position: absolute; border-radius: 300px; overflow: hidden; border: 14px solid #fff; box-shadow: 0 30px 80px rgba(60, 40, 160, 0.3); }
    .frame-pill video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    #s5-cam { position: absolute; inset: 0; perspective: 1100px; perspective-origin: 50% 50%; }
    #s5-world { position: absolute; left: 960px; top: 540px; transform-style: preserve-3d; }
    .mem { position: absolute; overflow: hidden; background: #fff; padding: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); backface-visibility: hidden; }
    .mem img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>

  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="s5-stage" style="position:absolute;inset:0"></div>
    <div id="s5-media" style="display:none">
      <video id="s5-ge02" class="clip" data-start="1.6" data-duration="5.6" data-track-index="4" src="assets/media/living/g_e02.mp4" muted playsinline></video>
      <video id="s5-ge03" class="clip" data-start="6.4" data-duration="4.6" data-track-index="4" src="assets/media/living/g_e03.mp4" muted playsinline></video>
      <video id="s5-ge09" class="clip" data-start="29.6" data-duration="8.0" data-track-index="4" src="assets/media/living/g_e09.mp4" muted playsinline></video>
      <div id="s5-kiss" class="fill"><video id="s5-kiss-v" class="clip" data-start="0" data-duration="1.95" data-track-index="2" src="assets/media/living/fc_w06.mp4" muted playsinline></video></div>
      <video id="s5-flow" class="clip" data-start="17.5" data-duration="4.4" data-playback-rate="0.55" data-track-index="2" src="assets/media/video/v04.mp4" muted playsinline></video>
      <video id="s5-heart" class="clip" data-start="25.0" data-duration="5.1" data-playback-rate="0.9" data-track-index="2" src="assets/media/video/v08.mp4" muted playsinline></video>
      <div id="s5-end-bg" class="fill"><video id="s5-end-bg-v" class="clip" data-start="36.9" data-duration="2.0" data-playback-rate="0.6" data-track-index="2" src="assets/media/living/fc_w04L_bg.mp4" muted playsinline></video></div>
      <div id="s5-end-fg" class="fill"><video id="s5-end-fg-v" class="clip" data-start="36.9" data-duration="2.0" data-playback-rate="0.6" data-track-index="3" src="assets/media/living/fc_w04L_fg.webm" muted playsinline></video></div>
    </div>
  </div>

  <script>
    (function () {
      const S = K.scene("s5");
      const at = K.timeline();
      const gtl = gsap.timeline({ paused: true });
      const W = K.flat(S, 70);
      const END = S.dur * 1000;
      const T = (i) => (W[i] ? W[i].ms : END);
      const E = K.ease;
      const P = D.PAL;
      const stage = document.getElementById("s5-stage");
      const take = (id, parent) => { const m = document.getElementById(id); parent.appendChild(m); return m; };
      const cuts = [];

      function shot(t0, t1, cls, xf = 0) {
        const s = K.el("div", "shot " + (cls || ""), stage);
        at.set(s, { opacity: 0 }, 0);
        if (xf) at.add(s, { opacity: [0, 1], duration: xf, ease: E.inout }, Math.max(0, t0 - xf / 2));
        else at.set(s, { opacity: 1 }, t0);
        at.set(s, { opacity: 0 }, t1 + 450);
        cuts.push(t0);
        return s;
      }
      const txt = (s, t, cls, css) => K.txt(s, t, cls, css);
      function soft(el, t, { dur = 700, rise = 16, blur = 12 } = {}) {
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], y: [rise, 0], filter: [`blur(${blur}px)`, "blur(0px)"], duration: dur, ease: E.expo }, t);
      }
      function out(els, t, dur = 300) {
        at.add(els, { opacity: [1, 0], filter: ["blur(0px)", "blur(8px)"], duration: dur, ease: E.in3 }, t);
      }
      function pop(el, t, { dur = 640, from = 0 } = {}) {
        at.set(el, { opacity: 0, scale: from }, 0);
        at.set(el, { opacity: 1 }, t);
        at.add(el, { scale: [from, 1], duration: dur, ease: E.spring(0.5, 2.0) }, t);
      }
      function spread(s, text, cls, css, t, { from = "0.6em", dur = 1100 } = {}) {
        const el = txt(s, text, cls, css);
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], filter: ["blur(14px)", "blur(0px)"], duration: 600, ease: E.expo }, t);
        at.add(el, { letterSpacing: [from, "0.02em"], duration: dur, ease: E.inout }, t);
        return el;
      }
      function line(s, idx, cls, css) {
        const row = txt(s, "", cls, css);
        return idx.map((i, k) => {
          const sp = K.el("span", "", row, W[i].t);
          sp.style.display = "inline-block";
          if (k < idx.length - 1) K.el("span", "", row, " ");
          soft(sp, T(i));
          return sp;
        });
      }
      const plate = (s, id) => {
        const f = K.el("div", "fill", s);
        D.gen(f, id, {}, { cut: false });
        return f;
      };

      // a generated diorama with a real camera move through it (depth parallax clip, scripts/living_batch.sh)
      const vplate = (s, vid) => {
        const f = K.el("div", "fill", s);
        f.appendChild(document.getElementById(vid));
        return f;
      };

      // ---- A. THE DROP — 사랑할 is cut out of the light; the real kiss is inside it; on 같아요 we fly through
      {
        const s = shot(0, T(3));
        const cam = K.el("div", "fill", s);
        take("s5-kiss", cam);
        // geometry: python scripts/knock_points.py "사랑할" assets/fonts/NotoSerifKR-VF.ttf 800 560 - 1085,450
        const geo = { x: 148.5, baseline: 748.5, deep: [939, 361] };
        const { wrap } = K.knock(cam, "사랑할", geo, { fill: "#f4f1ff", size: 560, weight: 800 });
        const rest = txt(wrap, "것 같아요", "k-serif c-peri", { left: 0, right: 0, top: 880, fontSize: 64, textAlign: "center" });
        soft(rest, T(1), { dur: 500 });
        at.add(wrap, { scale: [1.18, 1], duration: 900, ease: E.expo }, 0);
        K.zoomThrough(at, wrap, T(2) + 120, { dur: 560, to: 36 });
        K.flashFrame(at, s, 0, { dur: 520, peak: 1 });
        K.shake(at, cam, 0, { amp: 16, seed: 21, dur: 520 });
      }

      // ---- B. 우린 서로 너무 다르지만요 — a miniature river at night; the two of them on the bridge
      {
        const s = shot(T(3), T(7), "bg-dusk");
        const p = vplate(s, "s5-ge02");
        at.add(p, { scale: [1.14, 1.0], duration: T(7) - T(3) + 400, ease: E.quart }, T(3));
        const pair = D.gen(s, "c05", { left: 620, bottom: 40, width: 680 });
        at.set(pair, { opacity: 0 }, 0);
        at.add(pair, { opacity: [0, 1], y: [120, 0], duration: 900, ease: E.expo }, T(3));
        const a = line(s, [3, 4, 5], "k-serif c-white glow", { left: 0, right: 0, top: 120, fontSize: 92, textAlign: "center" });
        out(a, T(6) - 200, 240);
        spread(s, W[6].t, "k-serifB c-white glow", { left: 0, right: 0, top: 110, fontSize: 140, textAlign: "center" }, T(6), { from: "0.5em", dur: 1000 });
        K.pulse(at, s, S, T(3), T(7), { amp: 0.01 });
      }

      // ---- C. 사랑은 참 신비로운 거죠 — the park proposal, as a miniature (the real one happened on a bench like this)
      {
        const s = shot(T(7), T(11), "bg-mint", 360);
        const p = vplate(s, "s5-ge03");
        at.add(p, { scale: [1.0, 1.1], x: [0, -40], duration: T(11) - T(7) + 400, ease: "linear" }, T(7) - 200);
        const pr = D.gen(s, "c10", { left: 560, bottom: 60, width: 820 });
        at.set(pr, { opacity: 0 }, 0);
        at.add(pr, { opacity: [0, 1], y: [80, 0], duration: 1000, ease: E.expo }, T(7));
        K.leak(at, s, T(7) + 200, 3600, { peak: 0.5, from: "right" });
        line(s, [7, 8, 9, 10], "k-serifB c-white glow", { left: 0, right: 0, top: 110, fontSize: 104, textAlign: "center" });
      }

      // ---- D. 살아 가면서 한 번 올까 말까 한 그런 사랑인데 — the camera flies through their real memories
      let camD;
      {
        const s = shot(T(11), T(20), "", 360);
        camD = K.el("div", "fill", s);
        const cam = camD;
        cam.style.background = "radial-gradient(ellipse 70% 70% at 50% 50%, #3a3590, #15143a)";
        const camEl = K.el("div", "", cam);
        camEl.id = "s5-cam";
        const world = K.el("div", "", camEl);
        world.id = "s5-world";
        const keys = ["d00", "d28", "d10", "d01", "d46", "d37", "d18", "d03", "d04", "d34", "d63", "d12", "d48", "d27", "d05", "d14", "d56", "d42", "d09", "d32", "d73", "d22", "d67", "d38", "d44", "d25", "d40", "d39"];
        const rng = K.rng(11);
        const depth = 9000;
        const t0 = T(11) - 200, t1 = T(20) + 450;
        const fly = K.A.cubicBezier(0.55, 0.05, 0.35, 1);
        const when = (frac) => {
          let lo = 0, hi = 1;
          for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (fly(m) < frac) lo = m; else hi = m; }
          return t0 + lo * (t1 - t0);
        };
        keys.forEach((k, j) => {
          const card = K.el("div", "mem", world);
          const w = 380, h = 300;
          const side = j % 2 ? 1 : -1;
          const x = side * (430 + rng() * 520) - w / 2;
          const y = (rng() - 0.5) * 760 - h / 2;
          const z = -500 - (j / keys.length) * depth;
          card.style.cssText += `width:${w}px;height:${h}px;transform:translate3d(${x}px,${y}px,${z}px) rotateY(${-side * (8 + rng() * 10)}deg) rotateZ(${(rng() - 0.5) * 8}deg)`;
          K.img(card, K.photo(k), { position: "static", width: "100%", height: "100%" });
          const tIn = when(Math.max(0, (-z - 3800) / (depth + 600)));
          const tOut = when(Math.min(1, (-z - 250) / (depth + 600)));
          at.set(card, { opacity: 0 }, 0);
          at.add(card, { opacity: [0, 1], duration: 800, ease: "linear" }, tIn);
          at.add(card, { opacity: [1, 0], duration: 200, ease: "linear" }, Math.max(tIn + 800, tOut));
        });
        at.add(world, { translateZ: [0, depth + 600], duration: t1 - t0, ease: fly }, t0);
        const halo = K.el("div", "", cam);
        halo.style.cssText = "position:absolute;left:460px;top:330px;width:1000px;height:420px;background:radial-gradient(ellipse at center, rgba(21,20,58,.75), rgba(21,20,58,0) 70%)";
        const p1 = line(cam, [11, 12], "k-serif c-white", { left: 0, right: 0, top: 470, fontSize: 96, textAlign: "center" });
        out(p1, T(13) - 340);
        const p2 = line(cam, [13, 14, 15, 16, 17], "k-serif c-white", { left: 0, right: 0, top: 470, fontSize: 96, textAlign: "center" });
        out(p2, T(18) - 200, 240);
        // the flight ends in one picture: his hands on her face
        const last = K.el("div", "fill", cam);
        const lw = K.img(last, K.photo("w26"), {});
        lw.classList.add("plate");
        lw.style.objectPosition = "50% 30%";
        K.window(at, last, T(18) - 20, null);
        at.add(last, { scale: [1.18, 1.04], duration: T(20) - T(18) + 500, ease: E.expo }, T(18) - 20);
        K.el("div", "shade", last);
        line(cam, [18, 19], "k-serifB on-photo", { left: 0, right: 0, top: 800, fontSize: 130, textAlign: "center" });
        K.flashFrame(at, s, T(18), { dur: 600, peak: 0.9 });
      }

      // ---- E. 다가 온 것 같아요 — mint feed; the real flower selfie, slowed right down, as a post
      const tE = T(20);
      const Eo = shot(tE - 180, T(24), "bg-mint");
      {
        const c = D.card(Eo, { x: 660, y: 70, w: 600, h: 900, handle: "n.pole  ♥  s.pole", likes: "좋아요 1,004개" });
        take("s5-flow", c.media).style.objectPosition = "50% 30%";
        at.add(c.card, { y: [80, 0], rotate: [4, -2], duration: 900, ease: E.expo }, tE - 180);
        const a = txt(Eo, "다가 온", "k-serifB c-white", { left: 150, top: 380, fontSize: 112 });
        const b = txt(Eo, "것 같아요", "k-serifB c-white", { left: 1340, top: 520, fontSize: 112 });
        a.style.textShadow = b.style.textShadow = "0 6px 30px rgba(30,110,70,.35)";
        soft(a, T(20));
        soft(b, T(22));
        K.whip(at, camD, Eo, tE - 180, { dir: 1, dur: 340 });
      }

      // ---- F. 꿈 꾸던 모습은 아니지만요 — the real photo-booth strips land on the beat
      {
        const s = shot(T(24), T(28), "bg-paper");
        const hits = [T(24), T(25), T(26)];
        [["d15", 300, 260, 440, 330, -5], ["d18", 795, 230, 330, 700, 2], ["d16", 1220, 380, 440, 330, 4]].forEach(([k, x, y, w, h, rot], j) => {
          const p = K.el("div", "print", s);
          p.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
          K.img(p, K.photo(k), { position: "static", width: "100%", height: "100%" });
          at.set(p, { opacity: 0 }, 0);
          at.set(p, { opacity: 1 }, hits[j]);
          at.add(p, { y: [-260, 0], rotate: [rot * 3, rot], scale: [1.25, 1], duration: 420, ease: E.expo }, hits[j]);
          K.shake(at, s, hits[j] + 60, { amp: 8, seed: 30 + j, dur: 300 });
        });
        line(s, [24, 25, 26], "k-sansB c-cobalt", { left: 0, right: 0, top: 70, fontSize: 92, textAlign: "center" });
        const big = txt(s, W[27].t, "k-sansK c-pink", { left: 0, right: 0, top: 890, fontSize: 124, textAlign: "center" });
        K.slam(at, big, T(27), null, { from: 1.2, blur: 12 });
      }

      // ---- G. 서로를 웃게 만들죠 — heart hands, real, in a bubble frame; bubbles burst on 웃게
      {
        const s = shot(T(28), T(31), "bg-peri");
        const f = K.el("div", "frame-pill", s);
        f.style.cssText += "left:470px;top:200px;width:980px;height:620px";
        take("s5-heart", f);
        pop(f, T(28) - 60, { from: 0.4, dur: 700 });
        [["♥", 220, 160, P.pink, "#fff"], ["하하", 1480, 180, "#fff", P.peri], ["웃게", 1450, 650, "#fff", P.pink], ["♥", 200, 650, "#fff", P.pink]].forEach(([t, x, y, bg, col], k) => {
          const b = D.bubble(s, t, { x, y, size: 64, bg, color: col, tail: k % 2 ? "right" : "left" });
          pop(b, (k === 2 ? T(29) : T(28) + k * 160) + 40);
        });
        K.punch(at, f, T(29), { from: 1.08, dur: 460 });
        line(s, [28, 29, 30], "k-sansB c-white", { left: 0, right: 0, top: 880, fontSize: 84, textAlign: "center" });
      }

      // ---- H. 니 곁에 있으면 자꾸만 행복하단 생각이 들죠 — down the aisle: the two of them walk toward the arch
      {
        const s = shot(T(31), T(38), "bg-lilac", 420);
        const p = vplate(s, "s5-ge09");
        p.style.transformOrigin = "50% 42%";
        at.add(p, { scale: [1.0, 1.35], duration: T(38) - T(31) + 400, ease: E.inout }, T(31) - 200);
        const pair = D.gen(s, "c12", { left: 700, bottom: 30, width: 520 });
        pair.style.transformOrigin = "50% 100%";
        at.set(pair, { opacity: 0 }, 0);
        at.add(pair, { opacity: [0, 1], duration: 700, ease: E.inout }, T(31));
        at.add(pair, { scale: [1.2, 0.62], y: [60, -150], duration: T(38) - T(31), ease: E.inout }, T(31));
        K.letterbox(at, s, T(31) - 200, { dur: 900 });
        K.leak(at, s, T(34) - 400, 3600, { peak: 0.45, from: "right", tone: "rose", z: 30 });
        const a = line(s, [31, 32, 33], "k-serif c-white glow", { left: 0, right: 0, top: 790, fontSize: 92, textAlign: "center" });
        out(a, T(34) - 340);
        line(s, [34, 35, 36, 37], "k-serif c-white glow", { left: 0, right: 0, top: 790, fontSize: 92, textAlign: "center" });
      }

      // ---- I. 사랑할 것 같아요 — the last one: the word stands behind the real two of them, slowed, and holds
      {
        const s = shot(T(38), END + 600);
        take("s5-end-bg", s);
        const word = txt(s, "사랑할", "k-serifB c-ink", { left: 0, right: 0, top: -20, fontSize: 380, textAlign: "center" });
        K.syllables(word).forEach((sy, k) => soft(sy, T(38) + k * 90, { dur: 1100, rise: 70, blur: 18 }));
        take("s5-end-fg", s);
        const rest = txt(s, "것 같아요", "k-serif on-photo", { left: 0, right: 0, top: 880, fontSize: 84, textAlign: "center" });
        soft(rest, T(39), { dur: 900 });
        K.flashFrame(at, s, T(38), { dur: 420, peak: 0.85 });
        K.punch(at, s, T(38), { from: 1.08, dur: 700 });
        const dip = K.el("div", "", s);
        dip.style.cssText = "position:absolute;inset:0;background:#ece7dc;z-index:60";
        at.set(dip, { opacity: 0 }, 0);
        at.add(dip, { opacity: [0, 1], duration: 380, ease: E.in3 }, END - 380);
      }

      cuts.forEach((t) => K.punch(at, stage, t, { from: 1.025, dur: 340 }));

      K.bridge(gtl, at, S.dur);
      window.__timelines["s5"] = gtl;
    })();
  </script>
</template>
