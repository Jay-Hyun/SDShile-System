<template>
  <style>
    [data-composition-id="s5"] { position: absolute; inset: 0; overflow: hidden; background: #0c0b0a; }
    .s5-print { position: absolute; background: #fbf8f1; padding: 14px 14px 40px; box-shadow: 7px 11px 20px rgba(30, 20, 12, 0.3), 1px 2px 3px rgba(30, 20, 12, 0.25); }
    .s5-print img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.95) contrast(0.97) sepia(0.06); }
    .s5-print::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255, 248, 236, 0.14), rgba(255, 248, 236, 0) 45%, rgba(40, 24, 10, 0.1)); }
    .s5-pin { position: absolute; left: 50%; top: -8px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; z-index: 2; background: radial-gradient(circle at 35% 35%, #f1d9a4, #b08d57 55%, #6e5430); box-shadow: 2px 3px 4px rgba(0, 0, 0, 0.35); }
  </style>

  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="s5-stage" style="position:absolute;inset:0"></div>
    <div id="s5-media" style="display:none">
      <video id="s5-E21b" data-shot="3,7" class="clip" data-start="2.879" data-duration="4.915" data-track-index="2" src="assets/media/living/v5_E21b.mp4" muted playsinline></video>
      <video id="s5-E22" data-shot="7,11" class="clip" data-start="7.494" data-duration="4.339" data-track-index="2" src="assets/media/living/v5_E22.mp4" muted playsinline></video>
      <video id="s5-flow" data-shot="20,24" class="clip" data-start="18.456" data-duration="2.608" data-playback-rate="0.9" data-track-index="3" src="assets/media/video/v04.mp4" muted playsinline></video>
      <video id="s5-E26" data-shot="31,38" class="clip" data-start="29.129" data-duration="8.089" data-track-index="2" src="assets/media/living/v5_E26.mp4" muted playsinline></video>
    </div>
  </div>

  <script>
    (function () {
      // s5 final chorus (golden hour) — the real photos on their walls: the word opens onto their photograph,
      // a hallway of their days, the corkboard, the mirror, the aisle, and the photograph again.
      // words: 0 사랑할 1 것 2 같아요 3 우린 | 4 서로 5 너무 6 다르지만요 | 7 사랑은 8 참 9 신비로운 10 거죠 | 11 살아 12 가면서 13 한 14 번 15 올까 16 말까
      //   17 한 18 그런 19 사랑인데 | 20 다가 21 온 22 것 23 같아요 | 24 꿈 25 꾸던 26 모습은 27 아니지만요 | 28 서로를 29 웃게 30 만들죠
      //   31 니 32 곁에 33 있으면 | 34 자꾸만 35 행복하단 36 생각이 37 들죠 | 38 사랑할 39 것 40 같아요
      const C = D.scene("s5");
      const { at, gtl, T, Q, B, END } = C;
      const E = K.ease;
      const nb = (ms) => C.S.beatAt(ms);
      const WARM = "saturate(.96) contrast(.96) brightness(.98) sepia(.1)";

      // the big frame on their wall (E23): its picture area, in screen px at rest
      const R23 = window.GREEN.E23;
      const k23 = 1920 / R23.W;
      const q23 = R23.holes[0].quad;
      const hx = (q23.reduce((s, p) => s + p[0], 0) / 4) * k23;
      const hy = (q23.reduce((s, p) => s + p[1], 0) / 4) * k23; // box px
      const top23 = (1080 - R23.H * k23) / 2;
      const hw = ((q23[1][0] - q23[0][0] + q23[2][0] - q23[3][0]) / 2) * k23;
      const hh = ((q23[3][1] - q23[0][1] + q23[2][1] - q23[1][1]) / 2) * k23;
      const fill23 = (1080 / hh) * 1.02; // the photograph fills the screen height; a sliver of mat shows at the sides

      // A. 사랑할 is cut out of the paper; through it, their photograph. On the beat after 같아요 the letters
      //    spread until the paper is gone (2:14), and the camera keeps pulling back until the photograph hangs on their wall.
      {
        const { cam } = D.shot(C, 0, Q(3));
        const k = D.keyed(C, cam, "E23", [{ src: K.photo("w06"), pos: "50% 13%", grade: WARM }], 0, Q(3), { origin: `${hx}px ${hy}px`, manual: true });
        // geometry: python scripts/knock_points.py "사랑할" assets/fonts/NotoSerifKR-VF.ttf 800 560 - 1085,450
        const geo = { x: 148.5, baseline: 748.5, deep: [939, 361] };
        const { wrap, glyphs } = K.knock(cam, "사랑할", geo, { fill: "#F7F2E8", size: 560, weight: 800, z: 20 });
        // 것 같아요 is printed on the same paper (masked like it), so it burns away with the paper, never over a face
        const NS = "http://www.w3.org/2000/svg";
        const svg = wrap.querySelector("svg");
        const printed = document.createElementNS(NS, "text");
        printed.setAttribute("x", "960");
        printed.setAttribute("y", "884");
        printed.setAttribute("text-anchor", "middle");
        printed.setAttribute("font-family", "Noto Serif KR");
        printed.setAttribute("font-weight", "600");
        printed.setAttribute("font-size", "60");
        printed.setAttribute("mask", svg.querySelector("rect[mask]").getAttribute("mask"));
        const word = (t) => {
          const s = document.createElementNS(NS, "tspan");
          s.textContent = t;
          s.style.fill = "#665d56";
          printed.appendChild(s);
          return s;
        };
        const wGeot = word("것 ");
        const wGata = word("같아요");
        svg.appendChild(printed);
        at.set(printed, { opacity: 0 }, 0);
        at.add(printed, { opacity: [0, 1], duration: 380, ease: E.quart }, T(1) - 160);
        gtl.fromTo(wGeot, { fill: "#665d56" }, { fill: "#232024", duration: 0.17, ease: "power2.out", immediateRender: false }, T(1) / 1000);
        gtl.fromTo(wGata, { fill: "#665d56" }, { fill: "#232024", duration: 0.17, ease: "power2.out", immediateRender: false }, T(2) / 1000);
        at.add(wrap, { scale: [1.06, 1], duration: 900, ease: E.expo }, 0);
        // the strokes thicken from beat 230 to beat 231: the paper burns away from the letters outward
        const b0 = B(nb(T(1) - 40));
        const b1 = B(nb(T(1) - 40) + 1);
        // camera: the photograph fills the frame and breathes behind the letters; the moment the paper is gone
        // (the downbeat) it keeps moving, settling back until it hangs on their wall (still drifting at the cut)
        const cx = 960 - hx;
        const cy = 540 - (hy + top23);
        at.set(k.box, { x: cx, y: cy, scale: fill23 }, 0);
        at.add(k.box, { scale: [fill23, fill23 * 1.03], duration: b1, ease: "linear" }, 0);
        at.add(k.box, { x: [cx, 0], y: [cy, 0], scale: [fill23 * 1.03, 1.0], duration: Q(3) + 600 - b1, ease: E.settle }, b1);
        gtl.fromTo(glyphs, { attr: { "stroke-width": 0 } }, { attr: { "stroke-width": 1400 }, duration: (b1 - b0) / 1000, ease: "sine.inOut", immediateRender: false }, b0 / 1000);
        at.add(wrap, { opacity: [1, 0], duration: 140, ease: "linear" }, b1 - 140);
        K.leak(at, cam, b1 - 120, 2200, { peak: 0.3, from: "right", z: 25, tone: "warm" });
      }

      // B. the finished house at golden hour; the two of them on the balcony
      {
        const { cam } = D.shot(C, Q(3), Q(7));
        D.take("s5-E21b", cam);
        D.line(C, cam, [3, 4, 5, 6], { y: 92, size: 64, color: "ink" });
      }

      // C. the garden bench: he kneels with roses
      {
        const { cam } = D.shot(C, Q(7), Q(11));
        D.take("s5-E22", cam);
        D.line(C, cam, [7, 8, 9, 10], { y: 92, size: 56, color: "ink" });
      }

      // D. a hallway of their days, from the first selfies to the proposal; the camera arrives at the biggest frame
      {
        const { cam } = D.shot(C, Q(11), Q(20));
        D.keyed(C, cam, "E29", [
          { src: K.photo("d10"), pos: "50% 40%", grade: WARM },
          { src: K.photo("d01"), pos: "50% 62%", grade: WARM },
          { src: K.photo("d64"), pos: "66% 30%", grade: WARM },
          { src: K.photo("d36"), pos: "50% 52%", grade: WARM },
          { src: K.photo("w26"), pos: "50% 38%", grade: WARM },
        ], Q(11), Q(20) + 400, { from: { x: -60, y: -60, s: 1.12 }, to: { x: -1344, y: -236, s: 1.7 }, ease: "glide", origin: "0 0" });
        D.scrim(cam, "bottom", { tone: "light", a: 0.5, reach: 26 });
        D.line(C, cam, [11, 12, 13, 14, 15, 16], { y: 930, size: 54, color: "ink", end: T(17) - 40, out: 240 });
        // by now the camera is inside the big frame: the lower band turns dark, so the last phrase goes cream
        const dark = D.scrim(cam, "bottom", { a: 0.6, reach: 34, z: 21 });
        at.set(dark, { opacity: 0 }, 0);
        at.add(dark, { opacity: [0, 1], duration: 500, ease: E.quart }, T(17) - 520);
        D.line(C, cam, [17, 18, 19], { y: 930, size: 54, color: "cream", love: [19], lead: 80, enter: 400 });
      }

      // E. her desk by the window: a small frame with the flower selfie
      {
        const { cam } = D.shot(C, Q(20), Q(24));
        const k = D.keyed(C, cam, "E24", [{ video: "s5-flow", pos: "50% 50%", grade: WARM }], Q(20), Q(24) + 400, { from: { s: 1.0 }, to: { s: 1.11 } });
        k.box.style.transformOrigin = "51% 48%";
        D.line(C, cam, [20, 21, 22, 23], { y: 930, size: 58, color: "ink" });
      }

      // F. the corkboard: two big prints are pinned, two beats apart (the heart pose, then the photo-booth strip)
      {
        const { cam } = D.shot(C, Q(24), Q(28));
        const box = K.el("div", "", cam);
        box.style.cssText = "position:absolute;inset:0;transform-origin:50% 50%";
        const bg = K.el("img", "v5-cover", box);
        bg.src = "assets/media/gen5/E25.png";
        bg.alt = "";
        const pin = (key, t, css, rot) => {
          const p = K.el("div", "s5-print", box);
          Object.assign(p.style, css);
          p.style.transform = `rotate(${rot}deg)`;
          const img = K.el("img", "", p);
          img.src = K.photo(key);
          img.alt = "";
          K.el("div", "s5-pin", p);
          at.set(p, { opacity: 0 }, 0);
          at.add(p, { opacity: [0, 1], duration: 120, ease: E.quart }, t);
          at.add(p, { y: [-12, 0], duration: 460, ease: E.expo }, t);
          return p;
        };
        const p0 = nb(T(24));
        pin("d15", B(p0), { left: "120px", top: "176px", width: "860px", height: "573px" }, -3);
        pin("d42", B(p0 + 2), { left: "1190px", top: "66px", width: "470px", height: "705px" }, 2.2);
        D.move(C, box, Q(24), Q(28) + 400, { from: { s: 1.0 }, to: { s: 1.06 } });
        D.line(C, cam, [24, 25, 26, 27], { y: 878, size: 58, color: "cream" });
      }

      // G. the oval mirror holds the two of them, the day they tried on the suit and the dress
      {
        const { cam } = D.shot(C, Q(28), Q(31));
        D.keyed(C, cam, "E11g", [{ src: K.photo("d25"), pos: "50% 30%", grade: WARM }], Q(28), Q(31) + 400, { from: { s: 1.0 }, to: { s: 1.06 }, dy: 80 });
        D.scrim(cam, "bottom", { a: 0.5, reach: 32 });
        D.line(C, cam, [28, 29, 30], { y: 922, size: 58, color: "cream" });
      }

      // H. the aisle at golden hour: hand in hand toward the arch
      {
        const { cam } = D.shot(C, Q(31), Q(38));
        D.take("s5-E26", cam);
        D.scrim(cam, "bottom", { tone: "light", a: 0.45, reach: 26 });
        // right of the bride's train: the groom's feet stay clear
        D.line(C, cam, [31, 32, 33], { align: "right", x: 1836, y: 930, size: 54, color: "ink", end: T(34) - 60, out: 260 });
        D.line(C, cam, [34, 35, 36, 37], { align: "right", x: 1836, y: 930, size: 54, color: "ink", lead: 140 });
      }

      // I. back to the big frame on their wall: the two of them on the day of the photographs; the camera leans in
      {
        const { cam } = D.shot(C, Q(38), END);
        D.keyed(C, cam, "E23", [{ src: K.photo("w04"), pos: "50% 9%", grade: WARM }], Q(38), END + 400, {
          origin: `${hx}px ${hy}px`,
          from: { s: 1.0 },
          to: { s: 1.07 },
        });
        D.line(C, cam, [38, 39, 40], { y: 930, size: 60, color: "ink", love: [38], lead: 80, enter: 420 });
      }

      D.finish(C);
    })();
  </script>
</template>
