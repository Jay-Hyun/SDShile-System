    (function () {
      // s2 chorus 1 (dusk -> night) — light comes through the wall; their real memories live inside the set.
      // words: 0 사랑할 1 것 2 같아요 3 우린 | 4 서로 5 너무 6 다르지만요 | 7 사랑은 8 참 9 신비로운 10 거죠 | 11 살아 12 가면서 13 한 14 번 15 올까 16 말까

      const C = D.scene("s2");
      const { at, T, END } = C;
      const E = K.ease;

      // A. THE DROP — a crack of warm light runs down the wall between them; the line lands low, under them
      {
        const { cam } = D.shot(C, 0, T(4));
        D.take("s2-E02g", cam);
        const glow = K.el("div", "", cam);
        glow.style.cssText = "position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;background:radial-gradient(ellipse 16% 70% at 50% 40%, rgba(255,214,150,.55), rgba(255,214,150,0) 70%)";
        at.set(glow, { opacity: 0 }, 0);
        at.add(glow, { opacity: [0, 1, 0.55], duration: 1600, ease: E.quart }, 0);
        D.scrim(cam, "bottom", { a: 0.62, reach: 40 });
        D.line(C, cam, [0, 1, 2], { y: 878, size: 88, font: "serifB", color: "cream", love: [0], lead: 40, enter: 700, end: T(3) - 60, out: 320 });
        D.line(C, cam, [3], { y: 920, size: 60, color: "cream", lead: 120 });
      }

      // B. the same moment in two rooms: his squared mug, her round cup; the wall is the seam
      {
        const { shot } = D.shot(C, T(4), T(7));
        const L = K.el("div", "", shot);
        L.style.cssText = "position:absolute;left:0;top:0;width:960px;height:1080px;overflow:hidden";
        D.take("s2-E10m", L);
        const R = K.el("div", "", shot);
        R.style.cssText = "position:absolute;left:960px;top:0;width:960px;height:1080px;overflow:hidden";
        D.take("s2-E11m", R);
        const seam = K.el("div", "", shot);
        seam.style.cssText = "position:absolute;left:957px;top:0;width:6px;height:1080px;background:linear-gradient(90deg,#d9cfbf,#f4ede1,#cfc4b2);box-shadow:0 0 18px rgba(20,16,12,.35);z-index:5";

        D.line(C, shot, [4, 5, 6], { y: 914, size: 60, color: "cream", lead: 120 });

      // C. the roof lifts off the house; two stars close together

        const { cam } = D.shot(C, T(7), T(11));

        D.line(C, cam, [7, 8, 9, 10], { align: "left", x: 120, y: 70, size: 56, color: "cream", love: [7] });

      // D. one frame on his wall: three of their real days, two beats each at least; then their hands on the wall
      {
        const tCut = T(17);
        const { cam } = D.shot(C, T(11), tCut);
        const t1 = D.onBeat(C, 12500);
        const t2 = D.onBeat(C, 14420);
        D.keyed(C, cam, "E04", [{
          build(win, grade) {
            [["d38", T(11), t1, "50% 45%"], ["d61", t1, t2, "50% 52%"], ["d63", t2, tCut, "50% 38%"]].forEach(([k, a, b, pos]) => {

              img.src = K.photo(k);
              img.alt = "";
              img.style.objectPosition = pos;
              img.style.filter = grade;
              K.window(at, img, a, b);
              D.move(C, img, a, b, { from: { s: 1.0 }, to: { s: 1.045 } });
            });
          },
        }], T(11), tCut, { from: { s: 1.0 }, to: { s: 1.03 } });
        const { cam: cam2 } = D.shot(C, tCut, T(20));
        D.take("s2-E02h", cam2);
        D.scrim(cam2, "bottom", { a: 0.55, reach: 34 });
        D.line(C, cam, [11, 12, 13, 14, 15, 16], { y: 930, size: 46, color: "ink", lead: 160 });
        D.line(C, cam2, [17, 18, 19], { y: 914, size: 58, color: "cream", love: [19], lead: 60, enter: 380 });

      // E. rain on his window at night; on the sill, a small frame: the two of them under one umbrella

        const { cam } = D.shot(C, T(20), T(24));

        k.box.style.transformOrigin = "52% 58%";
