<template>
  <style>
    @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-Bold.woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2"); }
    @font-face { font-family: "Noto Serif KR"; font-weight: 200 900; src: url("assets/fonts/NotoSerifKR-VF.ttf"); }
    @font-face { font-family: "Cormorant"; font-style: italic; src: url("assets/fonts/CormorantGaramond-Italic.ttf"); }

    #root { position: absolute; inset: 0; overflow: hidden; background: #161514; }
    .kt { line-height: 1.12; will-change: transform, opacity, filter; }
    .A { font-family: "Pretendard"; font-weight: 900; letter-spacing: -0.035em; }
    .B { font-family: "Noto Serif KR"; font-weight: 500; letter-spacing: -0.01em; }
    .Bb { font-family: "Noto Serif KR"; font-weight: 700; letter-spacing: -0.015em; }
    .E { font-family: "Cormorant"; font-style: italic; }
    .ink { color: #161514; }
    .ivory { color: #f7f3ec; }
    .rose { color: #a65e66; }
    .on-photo { color: #f7f3ec; text-shadow: 0 2px 28px rgba(10, 9, 8, 0.55), 0 1px 3px rgba(10, 9, 8, 0.35); }
    .paper { background: radial-gradient(ellipse 80% 90% at 50% 40%, #f7f3ec 0%, #efe9df 70%, #e6dfd3 100%); }
    .studio { background: radial-gradient(ellipse 70% 80% at 50% 38%, #e0ddd7 0%, #c9c5be 62%, #b7b2aa 100%); }
    .bleed { position: absolute; inset: 0; overflow: hidden; }
    .bleed img, .bleed video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(to top, rgba(12, 11, 10, 0.62), rgba(12, 11, 10, 0)); }
    .print { position: absolute; overflow: hidden; background: #fff; padding: 14px 14px 56px; box-shadow: 0 24px 50px rgba(22, 21, 20, 0.28); }
    .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .vframe { position: absolute; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45); }
    .vframe video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  </style>

  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="s2-stage" style="position:absolute;inset:0"></div>
    <div id="s2-v2" class="bleed" style="opacity:0"><video id="s2-v07" class="clip" data-start="1.6" data-duration="5.3" data-media-start="1.5" data-playback-rate="0.85" data-track-index="2" src="assets/media/video/v07.mp4" muted playsinline></video></div>
    <div id="s2-v5" class="vframe" style="left:1060px;top:80px;width:520px;height:920px;opacity:0"><video id="s2-v03" class="clip" data-start="17.6" data-duration="4.2" data-media-start="4.0" data-track-index="2" src="assets/media/video/v03.mp4" muted playsinline></video></div>
    <div id="s2-v7" class="bleed" style="opacity:0"><video id="s2-v09" class="clip" data-start="25.1" data-duration="5.0" data-media-start="0.6" data-playback-rate="0.9" data-track-index="2" src="assets/media/video/v09.mp4" muted playsinline></video></div>
  </div>

  <script>
    (function () {
      const S = K.scene("s2");
      const at = K.timeline();
      const gtl = gsap.timeline({ paused: true });
      const W = K.flat(S, 80);
      const END = S.dur * 1000;
      const T = (i) => (W[i] ? W[i].ms : END);
      const E = K.ease;
      const stage = document.getElementById("s2-stage");
      const txt = K.txt;
      const cut = (k) => `assets/media/cutout/${k}.png`;
      const XF = 500; // chorus shots cross-dissolve over 500 ms

      // a chorus shot fades in over the previous one and holds until t1
      function shot(t0, t1, cls) {
        const el = K.el("div", "shot " + (cls || ""), stage);
        el.style.cssText = "position:absolute;inset:0;overflow:hidden";
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], duration: XF, ease: E.inout }, Math.max(0, t0 - XF / 2));
        at.set(el, { opacity: 0 }, t1 + XF / 2);
        return el;
      }
      function soft(el, t, { dur = 700, rise = 16, blur = 12 } = {}) {
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], y: [rise, 0], filter: [`blur(${blur}px)`, "blur(0px)"], duration: dur, ease: E.expo }, t);
      }
      function out(els, t, dur = 360) {
        at.add(els, { opacity: [1, 0], filter: ["blur(0px)", "blur(10px)"], duration: dur, ease: E.in3 }, t);
      }
      function push(el, t0, t1, from = 1.0, to = 1.07) {
        at.add(el, { scale: [from, to], duration: Math.max(1, t1 - t0 + XF), ease: "linear" }, t0 - XF / 2);
      }
      function photo(parent, key, pos = "50% 40%") {
        const b = K.el("div", "bleed", parent);
        K.img(b, K.photo(key), {}).style.objectPosition = pos;
        return b;
      }
      // a line of words, each blurring in at its sung time, centred as one row
      function line(parent, idx, cls, css, align = "center") {
        const row = K.el("div", "kt " + cls, parent);
        row.style.cssText += `position:absolute;left:0;right:0;text-align:${align};white-space:nowrap`;
        for (const [k, v] of Object.entries(css)) row.style[k] = typeof v === "number" ? v + "px" : v;
        return idx.map((i, k) => {
          const sp = K.el("span", "", row, W[i].t);
          sp.style.display = "inline-block";
          if (k < idx.length - 1) K.el("span", "", row, " ");
          soft(sp, T(i));
          return sp;
        });
      }

      // ---- 1. 사랑할 것 같아요 — the two of them, the words standing behind
      {
        const s = shot(0, T(3), "studio");
        const words = line(s, [0, 1, 2], "Bb ink", { top: 60, fontSize: 170 });
        const g = K.img(s, cut("w03"), { left: 600, bottom: -90, height: 900 });
        at.set(g, { opacity: 0 }, 0);
        at.add(g, { opacity: [0, 1], y: [40, 0], filter: ["blur(10px)", "blur(0px)"], duration: 900, ease: E.expo }, Math.max(0, T(0) - 200));
        push(s, 0, T(3), 1.0, 1.04);
      }

      // ---- 2. 우린 서로 너무 다르지만요 — the selfie under the trees, slowed down
      {
        const s = shot(T(3), T(7));
        const v = document.getElementById("s2-v2");
        s.appendChild(v);
        v.style.opacity = 1;
        K.el("div", "shade", s);
        line(s, [3, 4, 5, 6], "B on-photo", { top: 820, fontSize: 92 });
      }

      // ---- 3. 사랑은 참 신비로운 거죠 — the proposal in the park, a slow push
      {
        const s = shot(T(7), T(11));
        const p = photo(s, "w33");
        push(p, T(7), T(11), 1.0, 1.08);
        K.el("div", "shade", s);
        const ws = line(s, [7, 8, 9, 10], "B on-photo", { top: 800, fontSize: 104 });
      }

      // ---- 4. 살아 가면서 한 번 올까 말까 한 그런 사랑인데 — a ring of words around one photo
      {
        const s = shot(T(11), T(20), "paper");
        const disc = K.el("div", "", s);
        disc.style.cssText = "position:absolute;left:660px;top:140px;width:600px;height:600px;border-radius:50%;overflow:hidden;box-shadow:0 30px 60px rgba(22,21,20,.25)";
        const ph = K.img(disc, K.photo("w40"), { left: 0, top: 0, width: "100%", height: "100%" });
        ph.style.objectFit = "cover";
        at.add(ph, { scale: [1.12, 1.0], rotate: [-6, 0], duration: T(20) - T(11) + XF, ease: "linear" }, T(11) - XF / 2);
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 1920 1080");
        svg.style.cssText = "position:absolute;inset:0;overflow:visible";
        s.appendChild(svg);
        const path = document.createElementNS(NS, "path");
        path.setAttribute("id", "s2-ring");
        path.setAttribute("d", "M 960 440 m -380 0 a 380 380 0 1 1 760 0 a 380 380 0 1 1 -760 0");
        path.setAttribute("fill", "none");
        svg.appendChild(path);
        const ringG = document.createElementNS(NS, "g");
        svg.appendChild(ringG);
        ringG.style.transformOrigin = "960px 440px";
        const tx = document.createElementNS(NS, "text");
        tx.setAttribute("font-family", "Noto Serif KR");
        tx.setAttribute("font-size", "34");
        tx.setAttribute("letter-spacing", "10");
        tx.setAttribute("fill", "#161514");
        const tp = document.createElementNS(NS, "textPath");
        tp.setAttribute("href", "#s2-ring");
        tp.textContent = "살아 가면서 · 한 번 올까 말까 한 · 그런 사랑인데 · 살아 가면서 · 한 번 올까 말까 한 · 그런 사랑인데 ·";
        tx.appendChild(tp);
        ringG.appendChild(tx);
        at.set(ringG, { opacity: 0 }, 0);
        at.add(ringG, { opacity: [0, 1], duration: 900, ease: E.inout }, T(11));
        at.add(ringG, { rotate: [0, 40], duration: T(20) - T(11) + XF, ease: "linear" }, T(11) - XF / 2);
        // the sung phrase sits under the circle, three phrases in turn
        const p1 = line(s, [11, 12], "B ink", { top: 880, fontSize: 84 });
        out(p1, T(13) - 360);
        const p2 = line(s, [13, 14, 15, 16, 17], "B ink", { top: 880, fontSize: 84 });
        out(p2, T(18) - 360);
        const p3 = line(s, [18, 19], "Bb rose", { top: 870, fontSize: 104 });
      }

      // ---- 5. 다가 온 것 같아요 — the night with the umbrella
      {
        const s = shot(T(20), T(24));
        s.style.background = "#161514";
        const v = document.getElementById("s2-v5");
        s.appendChild(v);
        v.style.opacity = 1;
        at.add(v, { y: [30, 0], duration: 1400, ease: E.expo }, T(20) - 250);
        line(s, [20, 21, 22, 23], "B ivory", { top: 400, fontSize: 96, left: 180, right: "auto" }, "left");
      }

      // ---- 6. 꿈꾸던 모습은 아니지만요 — three prints: not the dream picture, a better one
      {
        const s = shot(T(24), T(27), "paper");
        const keys = ["w30", "w31", "w36"];
        keys.forEach((k, j) => {
          const p = K.el("div", "print", s);
          p.style.cssText += `left:${300 + j * 460}px;top:${300 + (j % 2) * 40}px;width:400px;height:520px`;
          K.img(p, K.photo(k), { position: "static", width: "100%", height: "100%" });
          const rot = [-4, 2.5, -1.5][j];
          at.set(p, { opacity: 0 }, 0);
          at.add(p, { opacity: [0, 1], y: [60, 0], rotate: [rot * 2, rot], duration: 800, ease: E.expo }, T(24) + j * 260);
        });
        line(s, [24, 25, 26], "B ink", { top: 110, fontSize: 96 });
      }

      // ---- 7. 서로를 웃게 만들어주죠 — them, laughing
      {
        const s = shot(T(27), T(30));
        const v = document.getElementById("s2-v7");
        s.appendChild(v);
        v.style.opacity = 1;
        K.el("div", "shade", s);
        line(s, [27, 28, 29], "B on-photo", { top: 820, fontSize: 96 });
      }

      // ---- 8. 니 곁에 있으면 자꾸만 행복하단 생각이 들죠 — sunsets, one after another
      {
        const s = shot(T(30), T(37));
        const keys = ["d04", "d10", "d46", "d00"];
        const span = (T(37) - T(30)) / keys.length;
        keys.forEach((k, j) => {
          const p = photo(s, k);
          const a0 = T(30) + j * span;
          at.set(p, { opacity: j ? 0 : 1 }, 0);
          if (j) at.add(p, { opacity: [0, 1], duration: 700, ease: E.inout }, a0 - 350);
          at.add(p, { scale: [1.0, 1.06], duration: span + 700, ease: "linear" }, a0 - 350);
        });
        K.el("div", "shade", s);
        const p1 = line(s, [30, 31, 32], "B on-photo", { top: 800, fontSize: 96 });
        out(p1, T(33) - 360);
        const p2 = line(s, [33, 34, 35, 36], "B on-photo", { top: 800, fontSize: 96 });
      }

      // ---- 9. 사랑할 것 같아요 — back to the studio, both of them, and a breath before the rap
      {
        const s = shot(T(37), END - 200, "studio");
        const g = K.img(s, cut("w05"), { left: 560, bottom: -90, height: 920 });
        at.set(g, { opacity: 0 }, 0);
        at.add(g, { opacity: [0, 1], filter: ["blur(10px)", "blur(0px)"], duration: 800, ease: E.expo }, T(37) - 200);
        line(s, [37, 38, 39], "Bb ink", { top: 60, fontSize: 150 });
        push(s, T(37), END, 1.0, 1.03);
      }

      K.bridge(gtl, at, S.dur);
      window.__timelines["s2"] = gtl;
    })();
  </script>
</template>
