      <video id="s2-E03" data-shot="7,11" class="clip" data-start="7.35" data-duration="4.483" data-track-index="2" src="assets/media/living/v5_E03.mp4" muted playsinline></video>
      <video id="s2-E02h" data-shot="17,20" class="clip" data-start="15.86" data-duration="2.896" data-track-index="2" src="assets/media/living/v5_E02h.mp4" muted playsinline></video>

      <video id="s2-E03b" data-shot="24,27" class="clip" data-start="20.764" data-duration="5.492" data-track-index="2" src="assets/media/living/v5_E03b.mp4" muted playsinline></video>

      <video id="s2-E02r" data-shot="37,end" class="clip" data-start="36.918" data-duration="1.133" data-track-index="2" src="assets/media/living/v5_E02r.mp4" muted playsinline></video>

  <script>
    (function () {
      // s2 chorus 1 (dusk -> night) — light comes through the wall; their real memories live inside the set.
      // words: 0 사랑할 1 것 2 같아요 3 우린 | 4 서로 5 너무 6 다르지만요 | 7 사랑은 8 참 9 신비로운 10 거죠 | 11 살아 12 가면서 13 한 14 번 15 올까 16 말까
      //   17 한 18 그런 19 사랑인데 | 20 다가 21 온 22 것 23 같아요 | 24 꿈꾸던 25 모습은 26 아니지만요 | 27 서로를 28 웃게 29 만들어주죠
      //   30 니 31 곁에 32 있으면 | 33 자꾸만 34 행복하단 35 생각이 36 들죠 | 37 사랑할 38 것 39 같아요
      const C = D.scene("s2");
      const { at, T, Q, B, END } = C;
      const E = K.ease;
      const nb = (ms) => C.S.beatAt(ms); // first beat at or after a scene-local time

      // A. THE DROP — a crack of warm light runs down the wall between them; the line lands low, under them
      {
        const { cam } = D.shot(C, 0, Q(3));
        D.take("s2-E02g", cam);
        const glow = K.el("div", "", cam);
        glow.style.cssText = "position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;background:radial-gradient(ellipse 16% 70% at 50% 40%, rgba(255,214,150,.55), rgba(255,214,150,0) 70%)";
        // the light swells with 사랑할, then settles
        const hit = 380;
        at.set(glow, { opacity: 0 }, 0);
        at.add(glow, { opacity: [0, 1], duration: Math.max(1, hit), ease: E.in3 }, 0);
        at.add(glow, { opacity: [1, 0.55], duration: 1400, ease: E.quart }, hit);
        D.scrim(cam, "bottom", { a: 0.62, reach: 40 });
        D.line(C, cam, [0, 1, 2], { y: 878, size: 88, font: "serifB", color: "cream", love: [0], lead: 40, enter: 700 });
      }

      // B. the same moment in two rooms: his squared mug, her round cup; the wall is the seam
      {
        const { shot } = D.shot(C, Q(3), Q(7));
        const L = K.el("div", "", shot);
        L.style.cssText = "position:absolute;left:0;top:0;width:960px;height:1080px;overflow:hidden";
        D.take("s2-E10m", L);
        const R = K.el("div", "", shot);
        R.style.cssText = "position:absolute;left:960px;top:0;width:960px;height:1080px;overflow:hidden";
        D.take("s2-E11m", R);
        const seam = K.el("div", "", shot);
        seam.style.cssText = "position:absolute;left:957px;top:0;width:6px;height:1080px;background:linear-gradient(90deg,#d9cfbf,#f4ede1,#cfc4b2);box-shadow:0 0 18px rgba(20,16,12,.35);z-index:5";
        D.scrim(shot, "bottom", { a: 0.55, reach: 34 });
        D.line(C, shot, [3, 4, 5, 6], { y: 914, size: 60, color: "cream", lead: 120 });
      }

      // C. their house at night by the lake, two windows lit (his cobalt, her coral); two stars close together
      {
        const { cam } = D.shot(C, Q(7), Q(11));
        D.take("s2-E03", cam);
        D.line(C, cam, [7, 8, 9, 10], { align: "left", x: 120, y: 70, size: 56, color: "cream", love: [7] });
      }

      // D. one frame on his wall: three of their real days, two beats each at least; then their hands on the wall
      {
        const tCut = Q(17);
        const { cam } = D.shot(C, Q(11), tCut);
        // the photo changes on the beat, every two beats
        const b0 = nb(Q(11));
        const t1 = B(b0 + 2);
        const t2 = B(b0 + 4);
        D.keyed(C, cam, "E04", [{
          build(win, grade) {
            [["d38", Q(11), t1, "50% 45%"], ["d61", t1, t2, "50% 60%"], ["d63", t2, tCut, "50% 38%"]].forEach(([k, a, b, pos]) => {
              const img = K.el("img", "v5-cover", win);
              img.src = K.photo(k);
              img.alt = "";
              img.style.objectPosition = pos;
              img.style.filter = grade;
              K.window(at, img, a, b);
              D.move(C, img, a, b, { from: { s: 1.0 }, to: { s: 1.045 } });
            });
          },
        }], Q(11), tCut, { from: { s: 1.0 }, to: { s: 1.035 } });
        const { cam: cam2 } = D.shot(C, tCut, Q(20));
        D.take("s2-E02h", cam2);
        D.scrim(cam2, "bottom", { a: 0.55, reach: 34 });
        D.line(C, cam, [11, 12, 13, 14, 15, 16], { y: 930, size: 46, color: "ink", lead: 160 });
        D.line(C, cam2, [17, 18, 19], { y: 914, size: 58, color: "cream", love: [19], lead: 60, enter: 380 });
      }

      // E. rain on his window at night; on the sill, a big frame: the two of them under one umbrella
      {
        const { cam } = D.shot(C, Q(20), Q(24));
        const k = D.keyed(C, cam, "E05", [{ video: "s2-umb", pos: "50% 46%" }], Q(20), Q(24), { from: { s: 1.0 }, to: { s: 1.07 } });
        k.box.style.transformOrigin = "64% 47%";
        D.line(C, cam, [20, 21, 22, 23], { align: "left", x: 420, y: 150, size: 58, color: "cream", lead: 160 });
      }

      // F. back to back on the roof of the same house, under the stars
      {
        const { cam } = D.shot(C, Q(24), Q(27));
        D.take("s2-E03b", cam);
        D.line(C, cam, [24, 25, 26], { align: "left", x: 120, y: 110, size: 62, color: "cream" });
      }

      // G. the oval mirror in her room holds their photo-booth video (silly poses, both laughing)
      {
        const { cam } = D.shot(C, Q(27), Q(30));
        D.keyed(C, cam, "E11g", [{ video: "s2-laugh", pos: "50% 50%" }], Q(27), Q(30), { from: { s: 1.0 }, to: { s: 1.05 }, dy: 80 });
        D.scrim(cam, "bottom", { a: 0.5, reach: 32 });
        D.line(C, cam, [27, 28, 29], { y: 922, size: 58, color: "cream" });
      }

      // H. the kitchen at night: a cake with two candles; on the wall TV, their real cake
      {
        const { cam } = D.shot(C, Q(30), Q(37));
        const k = D.keyed(C, cam, "E06", [{ video: "s2-cake", pos: "50% 50%" }], Q(30), Q(37), { from: { s: 1.0 }, to: { s: 1.12 } });
        k.box.style.transformOrigin = "50% 33%";
        D.scrim(cam, "bottom", { a: 0.55, reach: 34 });
        D.line(C, cam, [30, 31, 32], { y: 922, size: 58, color: "cream", end: T(33) - 60, out: 260 });
        D.line(C, cam, [33, 34, 35, 36], { y: 922, size: 58, color: "cream", lead: 140 });
      }

      // I. a gap in the wall: their fingertips almost touch
      {
        const { cam } = D.shot(C, Q(37), END);
        D.take("s2-E02r", cam);
        D.scrim(cam, "bottom", { a: 0.55, reach: 34 });
        D.line(C, cam, [37, 38, 39], { y: 914, size: 60, color: "cream", love: [37], lead: 60, enter: 360 });
      }

      D.finish(C);
    })();
