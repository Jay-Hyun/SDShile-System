<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #ece7dc; }
    .shot { position: absolute; inset: 0; overflow: hidden; }
    .vcard { position: absolute; overflow: hidden; border-radius: 30px; border: 10px solid #ece7dc; box-shadow: 0 30px 70px rgba(10, 10, 40, 0.35); }
    .vcard video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .eye { position: absolute; width: 92px; height: 92px; border-radius: 50%; background: #ece7dc; }
    .pupil { position: absolute; left: 30px; top: 30px; width: 32px; height: 32px; border-radius: 50%; background: #232024; }
  </style>

  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="s1-stage" style="position:absolute;inset:0"></div>
    <div id="s1-media" style="display:none">
      <div id="s1-rock" class="fill"><video id="s1-rock-v" class="clip" data-start="2.7" data-duration="3.4" data-media-start="6.0" data-track-index="2" src="assets/media/video/v01.mp4" muted playsinline></video></div>
    </div>
  </div>

  <script>
    (function () {
      const S = K.scene("s1");
      const at = K.timeline();
      const gtl = gsap.timeline({ paused: true });
      const W = K.flat(S, 60);
      const END = S.dur * 1000;
      const T = (i) => (W[i] ? W[i].ms : END - 120);
      const E = K.ease;
      const stage = document.getElementById("s1-stage");
      const P = D.PAL;
      const cuts = [];

      // ---- grammar (Actor): one designed frame per line, neutral gothic set small and left-aligned,
      //      one hero word per frame, Hangul composes jamo by jamo, the pink badge rides the hits
      function shot(t0, t1, cls) {
        const s = K.el("div", "shot " + (cls || ""), stage);
        K.window(at, s, t0, t1);
        cuts.push(t0);
        return s;
      }
      function pattern(s, cls, dx = 160, dy = 120) {
        const p = K.el("div", cls, s);
        p.style.cssText += "position:absolute;left:-200px;top:-200px;right:-200px;bottom:-200px";
        at.add(p, { x: [0, dx], y: [0, dy], duration: 6000, ease: "linear" }, 0);
        return p;
      }
      const txt = (s, t, cls, css) => K.txt(s, t, cls, css);
      // type a word in jamo steps starting at its sung time (step shrinks if the next word comes fast)
      function typed(el, t, tNext) {
        const cells = K.imeBuild(el);
        const states = cells.reduce((n, c) => n + c.states.length, 0);
        const step = Math.max(28, Math.min(72, ((tNext || t + 600) - t) / Math.max(1, states)));
        return K.ime(at, cells, t, { step });
      }
      // a left-aligned stack: rows of word indices, each word typed at its time
      function stack(s, rows, cls, { x, y, size, gap = 1.22 }) {
        const out = {};
        rows.forEach((row, r) => {
          const line = txt(s, "", cls, { left: x, top: y + r * size * gap, fontSize: size });
          row.forEach((i, k) => {
            const sp = K.el("span", "", line, W[i].t);
            sp.style.display = "inline-block";
            if (k < row.length - 1) K.el("span", "", line, " ");
            const flat = row.concat(rows.slice(r + 1).flat());
            typed(sp, T(i), T(flat[k + 1] != null ? flat[k + 1] : i + 1));
            out[i] = sp;
          });
        });
        return out;
      }
      function pop(el, t, { dur = 620, from = 0 } = {}) {
        at.set(el, { opacity: 0, scale: from }, 0);
        at.set(el, { opacity: 1 }, t);
        at.add(el, { scale: [from, 1], rotate: [-14, 0], duration: dur, ease: E.spring(0.45, 2.2) }, t);
      }
      function rise(el, t, { from = 140, dur = 700 } = {}) {
        at.set(el, { opacity: 0 }, 0);
        at.add(el, { opacity: [0, 1], y: [from, 0], duration: dur, ease: E.expo }, t);
      }
      function pill(s, text, bg, color, css) {
        const p = K.el("div", "pill kt k-sansB", s, text);
        for (const [k, v] of Object.entries(css)) p.style[k] = typeof v === "number" ? v + "px" : v;
        p.style.background = bg;
        p.style.color = color;
        p.style.height = css.fontSize * 1.5 + "px";
        return p;
      }

      // ---------- A: 잠깐 · 어쩌면 — he stops you with a raised hand (cream paper, Actor's opening)
      {
        const s = shot(0, T(2), "bg-paper");
        D.meta(s, "N  ——  S", "반대가 끌리는 이유  ·  01", { y: 48, color: "rgba(35,32,36,.55)" });
        const fig = D.gen(s, "c03", { right: 140, bottom: -30, height: 1000 });
        rise(fig, T(0) - 80, { from: 220 });
        const w0 = txt(s, "잠깐", "k-sansK c-cobalt", { left: 150, top: 260, fontSize: 290 });
        K.slam(at, w0, T(0), T(2), { from: 1.18, creep: 1.02, blur: 8 });
        const b = D.badge(s, { size: 150 });
        b.style.left = "860px";
        b.style.top = "250px";
        pop(b, T(0) + 140);
        at.add(b, { rotate: [0, 90], duration: T(2) - T(0), ease: "linear" }, T(0) + 760);
        const w1 = txt(s, "어쩌면", "k-sans c-ink", { left: 160, top: 640, fontSize: 76 });
        typed(w1, T(1), T(2));
      }

      // ---------- B: 하는 짓들마다 / 뭔가 그렇게 / 삐딱하지 — the stack types in; on 삐딱 the whole frame tilts
      {
        const s = shot(T(2), T(7), "bg-cobalt");
        pattern(s, "pat-oval");
        const tilt = K.el("div", "fill", s);
        tilt.style.overflow = "visible";
        const card = K.el("div", "vcard", tilt);
        card.style.cssText += "left:1120px;top:150px;width:560px;height:780px";
        card.appendChild(document.getElementById("s1-rock"));
        at.add(card, { y: [900, 0], rotate: [10, 4], duration: 700, ease: E.expo }, T(2) - 100);
        stack(tilt, [[2, 3], [4, 5], [6]], "k-sans c-cream", { x: 150, y: 300, size: 104 });
        const b = D.badge(tilt, { size: 110 });
        b.style.left = "620px";
        b.style.top = "560px";
        pop(b, T(6) + 200);
        at.add(tilt, { rotate: [0, -7], duration: 700, ease: E.spring(0.4, 2.5) }, T(6));
        K.shake(at, tilt, T(6), { amp: 10, seed: 7, dur: 360 });
      }

      // ---------- C: 대체 왤까 — an orange starburst and the question echoing (Actor's TIME OVER)
      {
        const s = shot(T(7), T(9), "bg-orange");
        const burst = D.burst(s, { color: "#f4b860", rays: 14, size: 2600 });
        at.add(burst, { rotate: [0, 24], duration: T(9) - T(7) + 400, ease: "linear" }, T(7));
        const e = D.echo(s, "대체 왤까", { n: 5, gap: 128, cls: "k-sansK", size: 124, color: P.ink, y: 540 });
        e.rows.forEach((r, k) => {
          at.set(r, { opacity: 0 }, 0);
          at.set(r, { opacity: k === 2 ? 1 : 0.75 }, T(7) + Math.abs(k - 2) * 70);
          at.add(r, { y: [k < 2 ? -60 : k > 2 ? 60 : 0, 0], duration: 360, ease: E.expo }, T(7) + Math.abs(k - 2) * 70);
        });
        K.slam(at, e.hero, T(8), null, { from: 1.2, blur: 6 });
      }

      // ---------- D: 남들이 하는대로 하지 — a row of identical figures, and then him, crooked, in the middle of it
      {
        const s = shot(T(9), T(12), "bg-cream");
        const row = D.gen(s, "c14", { left: 160, bottom: 30, width: 1600 });
        rise(row, T(9) - 60, { from: 80, dur: 600 });
        const st = stack(s, [[9, 10]], "k-sansB c-cobalt", { x: 150, y: 110, size: 112 });
        const p = pill(s, "하지", P.orange, P.cream, { left: 150, top: 270, fontSize: 70 });
        pop(p, T(11));
        const him = D.gen(s, "c07", { left: 860, bottom: 20, height: 760 });
        at.set(him, { opacity: 0 }, 0);
        at.set(him, { opacity: 1 }, T(11));
        at.add(him, { y: [500, 0], rotate: [0, 9], duration: 520, ease: E.spring(0.45, 2.4) }, T(11));
        K.shake(at, s, T(11), { amp: 8, seed: 9, dur: 300 });
      }

      // ---------- E: 대체 왜 자꾸 저럴까 — a signpost pointing both ways
      {
        const s = shot(T(12), T(16), "bg-cobalt");
        pattern(s, "pat-thumb", -150, 150);
        const sign = D.gen(s, "p09", { left: 700, top: 120, height: 920 });
        rise(sign, T(12) - 80, { from: 300 });
        [T(13), T(14), T(15)].forEach((t, k) => at.add(sign, { rotate: [k % 2 ? 5 : -5, 0], duration: 500, ease: E.spring(0.35, 2.5) }, t));
        stack(s, [[12, 13]], "k-sansB c-cream", { x: 140, y: 340, size: 120 });
        stack(s, [[14], [15]], "k-sansB c-cream", { x: 1340, y: 300, size: 120 });
      }

      // ---------- F: 사람들이 모두 쳐다보는데 — a field of eyes; on 쳐다보는데 they all turn to look at you
      {
        const s = shot(T(16), T(19), "bg-cobalt");
        const eyes = [];
        for (let r = 0; r < 6; r++)
          for (let c = 0; c < 12; c++) {
            const e = K.el("div", "eye", s);
            const x = 60 + c * 156 + (r % 2) * 78, y = 40 + r * 172;
            e.style.left = x + "px";
            e.style.top = y + "px";
            const p = K.el("div", "pupil", e);
            const d = Math.hypot(x + 46 - 960, y + 46 - 540);
            eyes.push({ e, p, x, y, d });
          }
        eyes.forEach(({ e, p, x, y, d }) => {
          at.set(e, { opacity: 0, scale: 0 }, 0);
          const t = T(16) + d * 0.35;
          at.set(e, { opacity: 1 }, t);
          at.add(e, { scale: [0, 1], duration: 420, ease: E.back }, t);
          at.set(p, { x: (((x * 7) % 11) - 5) * 2, y: (((y * 3) % 9) - 4) * 2 }, 0);
          const ang = Math.atan2(540 - (y + 46), 960 - (x + 46));
          at.add(p, { x: Math.cos(ang) * 22, y: Math.sin(ang) * 22, duration: 260, ease: E.expo }, T(18) + d * 0.08);
        });
        const panel = K.el("div", "", s);
        panel.style.cssText = `position:absolute;left:420px;top:330px;width:1080px;height:420px;border-radius:40px;background:${P.cobalt};box-shadow:0 0 0 18px ${P.cobalt}`;
        stack(s, [[16, 17]], "k-sans c-cream", { x: 500, y: 370, size: 76 });
        const big = txt(s, W[18].t, "k-sansK c-cream", { left: 490, top: 480, fontSize: 176 });
        K.slam(at, big, T(18), T(19), { from: 1.15, blur: 6 });
      }

      // ---------- G: 불편하지도 않나 / 신경이 쓰일텐데 — cream page, the badge behind 않나, a hairline arrow
      {
        const s = shot(T(19), T(23), "bg-paper");
        const st = stack(s, [[19, 20], [21, 22]], "k-sansB c-cobalt", { x: 160, y: 300, size: 132 });
        const b = D.badge(s, { size: 260 });
        b.style.left = "600px";
        b.style.top = "230px";
        s.insertBefore(b, s.firstChild);
        pop(b, T(20) - 40);
        at.add(b, { rotate: [0, 40], duration: 2400, ease: "linear" }, T(20));
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 1920 1080");
        svg.style.cssText = "position:absolute;inset:0;overflow:visible";
        svg.innerHTML = `<path d="M 170 690 C 600 760, 1100 820, 1500 620 S 1700 420, 1760 520" fill="none" stroke="${P.cobalt}" stroke-width="5" stroke-linecap="round"/><path d="M 1730 500 L 1764 524 L 1736 556" fill="none" stroke="${P.cobalt}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
        s.appendChild(svg);
        const dr = K.A.svg.createDrawable(svg.querySelectorAll("path"));
        at.set(dr, { draw: "0 0" }, 0);
        at.add(dr[0], { draw: ["0 0", "0 1"], duration: 900, ease: E.inout }, T(21));
        at.add(dr[1], { draw: ["0 0", "0 1"], duration: 200, ease: E.expo }, T(21) + 860);
      }

      // ---------- H: 보든 말든 괜찮나 — she glances back over her shoulder, unbothered
      {
        const s = shot(T(23), T(26), "bg-cobalt");
        pattern(s, "pat-oval", -160, 120);
        const her = D.gen(s, "c08", { right: 170, bottom: -40, height: 1040 });
        at.set(her, { opacity: 0 }, 0);
        at.add(her, { opacity: [0, 1], x: [260, 0], duration: 620, ease: E.expo }, T(23) - 80);
        const a = txt(s, W[23].t, "k-sansK c-cream", { left: 150, top: 190, fontSize: 230 });
        const b = txt(s, W[24].t, "k-sansK c-cream", { left: 150, top: 450, fontSize: 230 });
        K.slam(at, a, T(23), T(26), { from: 1.15 });
        K.slam(at, b, T(24), T(26), { from: 1.15 });
        const p = pill(s, W[25].t, P.orange, P.ink, { left: 160, top: 760, fontSize: 70 });
        pop(p, T(25));
      }

      // ---------- I: 아님 일부러 / 시선을 끌려 — two magnets; on 끌려 they snap together
      {
        const s = shot(T(26), T(30), "bg-paper");
        stack(s, [[26, 27]], "k-sans c-ink", { x: 160, y: 120, size: 80 });
        const mk = (side) => {
          const h = K.el("div", "", s);
          h.style.cssText = `position:absolute;left:460px;top:330px;width:1000px;height:667px;clip-path:inset(0 ${side ? 0 : 50}% 0 ${side ? 50 : 0}%)`;
          D.gen(h, "p01", { left: 0, top: 0, width: 1000 });
          return h;
        };
        const L = mk(0), R = mk(1);
        [L, R].forEach((h) => rise(h, T(26) - 60, { from: 120 }));
        const a = txt(s, W[28].t, "k-sansB c-cobalt", { left: 160, top: 830, fontSize: 120 });
        const b = txt(s, W[29].t, "k-sansB c-pink", { left: 1420, top: 830, fontSize: 120 });
        K.slam(at, a, T(28), T(30));
        K.attract(at, L, R, T(28), T(29) - T(28) + 40, 110, { overshoot: 0.1 });
        K.slam(at, b, T(29), T(30), { from: 1.25 });
        K.shake(at, s, T(29) + 40, { amp: 12, seed: 13, dur: 380 });
        K.flashFrame(at, s, T(29) + 40, { color: "#fff", dur: 160, peak: 0.6 });
      }

      // ---------- J: 그러면서 속으로는 / 은근히 즐겨 — orange checker, the two of them jumping on the beat
      {
        const s = shot(T(30), T(34), "pat-check");
        const pair = D.gen(s, "c06", { left: 420, bottom: -20, width: 1180 });
        rise(pair, T(30) - 60, { from: 200 });
        for (let n = S.beatAt(T(30)); S.beat(n) < T(34); n++) at.add(pair, { y: [-46, 0], duration: 300, ease: E.quart }, S.beat(n));
        stack(s, [[30, 31]], "k-sans c-ink", { x: 140, y: 110, size: 78 });
        const a = txt(s, W[32].t, "k-sansK c-cream", { left: 140, top: 240, fontSize: 150 });
        const b = txt(s, W[33].t, "k-sansK c-cream", { left: 680, top: 240, fontSize: 150 });
        a.style.textShadow = b.style.textShadow = "0 6px 0 rgba(35,32,36,.18)";
        K.slam(at, a, T(32), T(34));
        K.slam(at, b, T(33), T(34), { from: 1.3 });
      }

      // ---------- K: 이렇게 나와 다른 사람이 있었는지 — cream half for him, cobalt half for her
      {
        const s = shot(T(34), T(39), "");
        const L = K.el("div", "bg-cream", s);
        L.style.cssText += "position:absolute;left:0;top:0;width:960px;height:1080px;overflow:hidden";
        const R = K.el("div", "bg-cobalt", s);
        R.style.cssText += "position:absolute;left:960px;top:0;width:960px;height:1080px;overflow:hidden";
        at.add(L, { y: [-1080, 0], duration: 560, ease: E.expo }, T(34) - 80);
        at.add(R, { y: [1080, 0], duration: 560, ease: E.expo }, T(34) - 80);
        D.gen(L, "c01", { left: 470, bottom: -30, height: 920 });
        D.gen(R, "c02", { left: 120, bottom: -30, height: 920 });
        const t0 = txt(s, W[34].t, "k-meta c-ink", { left: 0, right: 0, top: 60, textAlign: "center", fontSize: 18 });
        rise(t0, T(34), { from: 20 });
        const a = txt(L, W[35].t, "k-sansK c-cobalt", { left: 90, top: 140, fontSize: 210 });
        const b = txt(R, W[36].t, "k-sansK c-cream", { left: 520, top: 140, fontSize: 210 });
        const c = txt(L, W[37].t, "k-sans c-cobalt", { left: 96, top: 420, fontSize: 84 });
        const d = txt(R, W[38].t, "k-sans c-cream", { left: 520, top: 420, fontSize: 84 });
        K.slam(at, a, T(35), T(39));
        K.slam(at, b, T(36), T(39));
        typed(c, T(37), T(38));
        typed(d, T(38), T(39));
      }

      // ---------- L: 어쩜 머리부터 다리 끝까지 — a scan line runs from her head to her toes along a ruler
      {
        const s = shot(T(39), T(43), "bg-paper");
        const her = D.gen(s, "c02", { left: 760, top: 40, height: 1010 });
        rise(her, T(39) - 60, { from: 80, dur: 600 });
        const ruler = K.el("div", "", s);
        ruler.style.cssText = `position:absolute;left:1360px;top:60px;width:2px;height:960px;background:${P.ink}`;
        for (let k = 0; k <= 24; k++) {
          const tk = K.el("div", "", s);
          tk.style.cssText = `position:absolute;left:${k % 4 ? 1362 : 1356}px;top:${60 + k * 40}px;width:${k % 4 ? 16 : 28}px;height:2px;background:${P.ink}`;
        }
        const scan = K.el("div", "", s);
        scan.style.cssText = `position:absolute;left:700px;top:70px;width:700px;height:4px;background:${P.cobalt};box-shadow:0 0 30px rgba(69,84,241,.6)`;
        at.set(scan, { opacity: 0 }, 0);
        at.set(scan, { opacity: 1 }, T(40));
        at.add(scan, { y: [0, 940], duration: T(42) - T(40) + 500, ease: E.inout }, T(40));
        const a = txt(s, W[39].t, "k-sans c-ink", { left: 160, top: 90, fontSize: 70 });
        typed(a, T(39), T(40));
        const b = txt(s, W[40].t, "k-sansB c-cobalt", { left: 160, top: 190, fontSize: 120 });
        const c = txt(s, W[41].t, "k-sansB c-cobalt", { left: 160, top: 560, fontSize: 120 });
        const d = txt(s, W[42].t, "k-sansB c-cobalt", { left: 160, top: 840, fontSize: 120 });
        K.slam(at, b, T(40), T(43));
        K.slam(at, c, T(41), T(43));
        K.slam(at, d, T(42), T(43));
      }

      // ---------- M: 다른 사람이 있을까 / 정말이지 처음 봤어 — black; 처음 opens out of its own letter
      {
        const s = shot(T(43), T(49), "bg-black");
        stack(s, [[43, 44, 45]], "k-sans c-cream", { x: 160, y: 140, size: 70 });
        stack(s, [[46]], "k-sans c-cream", { x: 160, y: 240, size: 70 });
        const heart = D.gen(s, "p03", { left: 1500, top: 120, width: 200 });
        pop(heart, T(45));
        at.add(heart, { rotate: [-10, 10], y: [0, -20], duration: 2600, ease: E.inout }, T(45));
        const big = txt(s, W[47].t, "k-sansK c-cream", { left: 0, right: 0, top: 330, fontSize: 420, textAlign: "center" });
        at.set(big, { opacity: 0 }, 0);
        at.set(big, { opacity: 1 }, T(47));
        K.zoomOut(at, big, T(47), { from: 18, dur: 200, origin: "38% 55%" });
        const p = pill(s, W[48].t, P.orange, P.ink, { left: 1390, top: 840, fontSize: 64 });
        pop(p, T(48));
      }

      // ---------- N: 그래서 보게 됐지 / 놀랐어 / 정말 신기했어 — a ring of hearts turns around a black disc
      {
        const s = shot(T(49), T(55), "bg-cobalt");
        pattern(s, "pat-oval");
        const disc = K.el("div", "", s);
        disc.style.cssText = `position:absolute;left:600px;top:180px;width:720px;height:720px;border-radius:50%;background:${P.black};box-shadow:0 0 0 26px ${P.cream}`;
        const ring = D.ring(s, 16, (h, i) => D.gen(h, "p03", { left: -44, top: -44, width: 88 }), { cx: 960, cy: 540, r: 470 });
        at.set(ring.wrap, { opacity: 0, scale: 0.6 }, 0);
        at.add(ring.wrap, { opacity: [0, 1], scale: [0.6, 1], duration: 600, ease: E.expo }, T(49) - 80);
        at.add(ring.wrap, { rotate: [0, 120], duration: T(55) - T(49) + 400, ease: "linear" }, T(49) - 80);
        stack(s, [[49], [50, 51]], "k-sans c-cream", { x: 740, y: 400, size: 68 });
        const inv = K.el("div", "", s);
        inv.style.cssText = `position:absolute;inset:0;background:${P.cream};z-index:30`;
        K.flash(at, inv, T(52), 2);
        const wow = txt(s, W[52].t, "k-sansK c-orange", { left: 600, right: 600, top: 400, fontSize: 150, textAlign: "center", zIndex: 31 });
        at.set(wow, { opacity: 0 }, 0);
        at.set(wow, { opacity: 1 }, T(52));
        at.add(wow, { scale: [1.4, 1], duration: 240, ease: E.expo }, T(52));
        at.set(wow, { opacity: 0 }, T(53) - 40);
        K.shake(at, s, T(52), { amp: 14, seed: 17, dur: 400 });
