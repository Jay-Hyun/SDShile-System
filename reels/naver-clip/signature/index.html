<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Paper","default":"#FBF9F4"},
  {"id":"color-ink","type":"color","label":"Ink","default":"#161616"},
  {"id":"color-accent","type":"color","label":"Gold","default":"#B8955A"},
  {"id":"font-display","type":"string","label":"Display font","default":"PretendardGOV"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #161616;
      }
    </style>
  </head>
  <body>
    <!-- 「마지막 서명」 30초 · docs/ads/naver-clip/01-last-signature.md §4 컷씬 시트 기준. tools/build.py 가 생성 -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0.0" data-duration="3.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="fill" class="clip" data-composition-id="fill" data-composition-src="compositions/fill.html"
        data-start="3.0" data-duration="3.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="blank" class="clip" data-composition-id="blank" data-composition-src="compositions/blank.html"
        data-start="6.0" data-duration="4.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="dust" class="clip" data-composition-id="dust" data-composition-src="compositions/dust.html"
        data-start="10.0" data-duration="4.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="desk" class="clip" data-composition-id="desk" data-composition-src="compositions/desk.html"
        data-start="14.0" data-duration="4.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="sign" class="clip" data-composition-id="sign" data-composition-src="compositions/sign.html"
        data-start="18.0" data-duration="6.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="cross" class="clip" data-composition-id="cross" data-composition-src="compositions/cross.html"
        data-start="24.0" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="end" class="clip" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="27.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="legal" class="clip" data-composition-id="legal" data-composition-src="compositions/legal.html"
        data-start="15.5" data-duration="14.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <!-- 사운드 베드(음악 + SFX, 합성). tools/make_audio.py. 내레이션은 추후 녹음 후 별도 <audio id="vo"> 로 추가 -->
      <audio id="bed" class="clip" src="assets/audio/bed.mp3" data-start="0" data-duration="30" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
