<!doctype html>
<html

  data-resolution="portrait"

  {"id":"color-ink","type":"color","label":"Ink","default":"#0E1116"},
  {"id":"color-paper","type":"color","label":"Paper","default":"#F7F6F2"},
  {"id":"color-navy","type":"color","label":"Navy","default":"#0B1A33"},

    </div>
  </body>
