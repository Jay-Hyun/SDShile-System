    <!-- 고정 앱 헤더 (카메라 줌 밖): 위쪽은 평평한 바탕으로 덮어 배지와 겹치지 않게 -->

  <script>
    const tl = gsap.timeline({ paused: true });

    // ---- helpers ----
    // 글자를 span으로 쪼갠다(빌드 시 1회, 동기). .nl(줄바꿈)은 한 글자처럼 취급
    function items(sel) {
      const el = document.querySelector(sel);
      const out = [];
      (function walk(node) {
        for (const n of Array.from(node.childNodes)) {
          if (n.nodeType === 3) {
            const f = document.createDocumentFragment();
            for (const c of n.textContent) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              f.appendChild(s);
              out.push(s);
            }
            node.replaceChild(f, n);
          } else if (n.nodeType === 1) {
            if (n.classList.contains("nl")) out.push(n);
            else if (!n.classList.contains("caret") && n.tagName !== "I") walk(n);
          }
        }
      })(el);
      return out;
    }
    // t0→t1 사이에 한 글자씩 켠다 (탐색 안전: set만 사용)
    function TYPE(sel, t0, t1) {
      const it = items(sel);
      const n = it.length;
      it.forEach((s, i) => {
        tl.set(s, { display: s.classList.contains("nl") ? "block" : "inline" }, +(t0 + ((t1 - t0) * i) / Math.max(1, n - 1)).toFixed(3));
      });
    }
    // 카메라: 점 (px,py)를 중심으로 s배 확대 (원점 0 0 고정 → 상태 사이를 끊김 없이 보간)
    function Z(s, px, py, dy) {
      return { scale: s, x: +(px * (1 - s)).toFixed(2), y: +(py * (1 - s) + (dy || 0)).toFixed(2) };
    }
    // 같은 대상에 fromTo를 여러 번 걸 때: 첫 번째만 즉시 렌더 → 그 값이 기준(0초) 상태가 된다
    const seen = new Set();
    function FT(sel, a, b, t) {
      const first = !seen.has(sel);
      seen.add(sel);
      tl.fromTo(sel, a, Object.assign({ immediateRender: first }, b), t);
    }
    function CAM(t, dur, a, b, ease) {
      FT("#ch-cam", a, Object.assign({}, b, { duration: dur, ease: ease || "power2.inOut" }), t);
    }
    function SCROLL(t, dur, a, b, ease) {
      FT("#ch-thread", { y: -a }, { y: -b, duration: dur, ease: ease || "power3.inOut" }, t);
    }
    function CLIP(t, dur, a, b, ease) {
      const r = (v) => "inset(0px 0px " + v + "px 0px round 10px 36px 36px 36px)";
      FT("#ch-a1", { clipPath: r(a) }, { clipPath: r(b), duration: dur, ease: ease || "power3.out" }, t);
    }

    // ---- 카메라 상태 ----
    const C0 = Z(1, 0, 0), C1 = Z(1.04, 540, 820), C2 = Z(1.03, 480, 820), C3 = Z(1.1, 400, 760), C3b = Z(1.05, 420, 820);
    const C4 = Z(1.15, 460, 1280, -220), C5 = Z(1.06, 420, 1210);

    // ===== C1 훅 0.0–3.0: F0부터 제목+전송된 질문. 1.5초 아바타+타이핑 점 =====
    CAM(0, 1.5, C0, C1, "power1.out");
    tl.fromTo(["#ch-av1", "#ch-typing"], { opacity: 0, scale: 0.6, transformOrigin: "0% 0%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.5);
    tl.fromTo(".td", { opacity: 0.25 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 5, stagger: 0.12, ease: "sine.inOut" }, 1.62);

    // ===== C2 핵심 답변 3.0–7.0 =====
    tl.to("#ch-title", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 3.0);
    tl.to("#ch-typing", { opacity: 0, duration: 0.12, ease: "none" }, 3.0);
    CLIP(3.0, 0.5, 592, 92);
    SCROLL(3.0, 0.6, -120, 436);
    FT("#ch-thread", { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.3, ease: "power2.in" }, 3.0);
    FT("#ch-thread", { filter: "blur(5px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 3.3);
    CAM(3.0, 0.6, C1, C0, "power2.inOut");
    tl.fromTo("#ch-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.3);
    // 빈 말풍선에 커서 깜빡 → 타이핑 → 0.3초 정지
    tl.set("#a1-caret", { opacity: 1 }, 3.35);
    tl.set("#a1-caret", { opacity: 0 }, 3.5);
    tl.set("#a1-caret", { opacity: 1 }, 3.6);
    TYPE("#a1-key", 3.6, 6.35);
    tl.set("#a1-caret", { opacity: 0 }, 6.45);
    CAM(3.6, 3.3, C0, C2, "power1.inOut");

    // ===== C3 하이라이트 + 예시 7.0–10.0 =====
    tl.to("#hl1", { backgroundSize: "100% 46%", duration: 0.25, ease: "power2.out" }, 7.0);
    tl.to("#hl2", { backgroundSize: "100% 46%", duration: 0.2, ease: "power2.out" }, 7.28);
    CAM(7.4, 0.6, C2, C3, "power2.inOut");
    CLIP(7.85, 0.3, 92, 0);
    tl.fromTo("#ch-note", { y: 0 }, { y: 92, duration: 0.3, ease: "power3.out" }, 7.85);
    tl.set("#ex-caret", { opacity: 1 }, 8.05);
    TYPE("#a1-ex", 8.15, 8.9);
    tl.set("#ex-caret", { opacity: 0 }, 9.0);
    tl.fromTo("#ex-b", { scale: 1 }, { scale: 1.14, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 9.0);
    CAM(9.1, 0.9, C3, C3b, "power2.inOut");

    // ===== C4 두 번째 질문 10.0–12.5 =====
    CAM(10.0, 0.45, C3b, C4, "power3.inOut");
    tl.fromTo("#ch-dim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 10.0);
    tl.fromTo("#ch-comp2", { opacity: 0, clipPath: "inset(250px 0px 0px 0px round 40px)" }, { opacity: 1, clipPath: "inset(0px 0px 0px 0px round 40px)", duration: 0.3, ease: "power3.out" }, 10.0);
    tl.set("#cp-caret", { opacity: 1 }, 10.0);
    tl.set("#cp-d2", { display: "none" }, 10.3);
    tl.set("#cp-d1", { display: "none" }, 10.42);
    TYPE("#cp-typed", 10.55, 11.1);
    tl.set("#cp-send", { backgroundColor: "#2a9d8f" }, 11.1);
    tl.fromTo("#cp-send", { scale: 1 }, { scale: 0.88, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 11.18);
    // 전송: 입력창이 닫히고 말풍선이 올라옴
    tl.to("#cp-text", { opacity: 0, duration: 0.06, ease: "none" }, 11.25);
    tl.to("#ch-comp2", { opacity: 0, clipPath: "inset(250px 0px 0px 0px round 40px)", duration: 0.22, ease: "power3.in" }, 11.27);
    tl.to("#ch-dim", { opacity: 0, duration: 0.25, ease: "power2.in" }, 11.27);
    tl.fromTo("#ch-u2", { opacity: 0, y: 240, scale: 0.92, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 11.27);
    SCROLL(11.27, 0.5, 436, 560, "power3.out");
    CAM(11.27, 0.6, C4, C0, "power3.out");

    // ===== C5 고민 중 (코믹 비트) 12.5–15.0 =====
    SCROLL(12.45, 0.35, 560, 700, "power3.inOut");
    tl.fromTo(["#ch-av2", "#ch-dots", "#st1"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 12.55);
    CAM(12.5, 2.5, C0, C5, "none");
    tl.fromTo("#ch-dots .sd", { y: 0 }, { y: -12, duration: 0.2, yoyo: true, repeat: 9, stagger: 0.08, ease: "sine.inOut" }, 12.6);
    tl.fromTo("#sd4", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 12.85);
    tl.fromTo("#sd5", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 13.15);
    tl.to("#st1", { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in" }, 13.35);
    tl.fromTo("#st2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power3.out" }, 13.42);
    tl.fromTo("#av2-eyes", { x: 0 }, { x: -8, duration: 0.25, ease: "power2.inOut" }, 13.5);
    tl.to("#av2-eyes", { x: 8, duration: 0.35, ease: "power2.inOut" }, 13.85);
    tl.to("#st2", { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in" }, 14.25);
    tl.fromTo("#st3", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power3.out" }, 14.32);
    tl.to("#av2-eyes", { x: 0, y: 9, duration: 0.3, ease: "power2.out" }, 14.32);

    // ===== C6 AI가 '책임'을 넘긴다 15.0–18.0 =====
    tl.to(["#ch-dots", "#st3"], { opacity: 0, duration: 0.12, ease: "power2.in" }, 15.0);
