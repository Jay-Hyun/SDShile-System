<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-chat-ground","type":"color","label":"챗 배경","default":"#F2F3F5"},
    {"id":"color-teal","type":"color","label":"챗 포인트(틸)","default":"#2A9D8F"},
    {"id":"color-ink","type":"color","label":"본문","default":"#161616"},
    {"id":"color-navy","type":"color","label":"브랜드 네이비","default":"#0B1A33"},
    {"id":"color-paper","type":"color","label":"웜화이트","default":"#FBF9F4"},
    {"id":"color-gold","type":"color","label":"골드","default":"#B8955A"},
    {"id":"color-gold-light","type":"color","label":"골드(어두운 배경용)","default":"#E0C27E"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/anime.min.js"></script>
    <script src="lib/beat.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2f3f5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- 15초판: tools/build_15s.py 가 생성 — 직접 고치지 말 것 -->
      <!-- 엔진: anime.js v4 (lib/anime.min.js) + lib/beat.js. 모든 타이밍은 BGM 비트 그리드(P = 60/125.03 s) -->
      <!-- C1–C4 가상 챗봇 화면 (0–8.5). 원형 전환 아래로 9.0까지 -->
      <div id="chat" class="clip" data-composition-id="chat" data-composition-src="compositions/chat.html"
        data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- C5–C6 브랜드 · 상담사 답 · 엔드카드 (8.5–15.0, 원곡 B섹션 크래시에 진입) -->
      <div id="brand" class="clip" data-composition-id="brand" data-composition-src="compositions/brand.html"
        data-start="8.5" data-duration="6.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 연출 배지 · 국내 유일 각주 · 보장 금지 고지 (전 구간 오버레이) -->
      <div id="legal" class="clip" data-composition-id="legal" data-composition-src="compositions/legal.html"
        data-start="0" data-duration="15" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- 오디오: tools/make_audio.py — 제공 BGM(Pixabay 505611) 편집 스템 + 비트 맞춤 SFX 스템 (합 −15 LUFS, TP ≤ −1 dBTP) -->
      <audio id="bgm" class="clip" src="assets/audio/bgm-15s.wav" data-start="0" data-duration="15" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx-15s.wav" data-start="0" data-duration="15" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
