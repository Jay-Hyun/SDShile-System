  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { ms, E, D, timeline, rise, words, wordsOut, sweep, split } = window.HF;
      const C = window.HFCUE(CUT);
      const L = C.L;
      const $ = (s) => document.querySelector(s);
      const tl = timeline();

      // ---------- 15초: 상담사 답 한 줄, 부엌 없음, 엔드카드 본문 줄 없음 ----------
      if (CUT === 15) {
        $("#w-a1").innerHTML = '<span class="ld" style="margin-top: 12px"><span data-m="l">퇴근 후·주말에,</span></span><span class="hx hl" style="margin-top: 8px"><span id="w-a1-1" data-m="l">100% 온라인으로.</span></span>';
        ["#w-a2", "#w-kt", "#w-e-bd"].forEach((q) => $(q).remove());
        $("#w-dk-txt > .eb").remove(); // 15초는 읽기 속도(≤ 10 자/초) 때문에 아이브로 없음
        $("#w-a1 .ld").style.marginTop = "0px";
      }
      // ---------- 엔드카드 세로 배치 (블록 틈 ≤ 140, 위 빈 띠 ≤ 15 %, 읽을 글 ≤ y 1500) ----------
      const Y = CUT === 30
        ? { logo: 230, eb: 402, hd: 458, bd: 782, ck: 986, link: 1240, tel: 1328 }
        : { logo: 284, eb: 476, hd: 532, ck: 936, link: 1216, tel: 1304 };
      const pos = (q, y) => { const el = $(q); if (el) el.style.top = y + "px"; };
      pos("#w-logo", Y.logo); pos("#w-e-eb", Y.eb); pos("#w-e-hd", Y.hd); pos("#w-e-bd", Y.bd); pos("#w-e-ck", Y.ck); pos("#w-link", Y.link); pos("#w-tel", Y.tel);

      // ---------- 시작 상태 ----------
      const B = L.bub;
      const bubClip = "inset(" + B.t.toFixed(1) + "px " + B.l.toFixed(1) + "px " + (1920 - B.b).toFixed(1) + "px " + B.l.toFixed(1) + "px round " + B.rad.toFixed(1) + "px)";
      tl.set("#w-dk", { clipPath: bubClip }, 0);
      const later = ["#w-st", "#w-end"].concat(CUT === 30 ? ["#w-kt", "#w-a2"] : []);
      tl.set(later, { opacity: 0 }, 0);

      // ===== 말풍선이 세계가 된다 (GROW → WORLD = 다운비트, 0.65 s in-out, 모서리 38 → 0). 사진은 처음부터 100 % 불투명, 1.12 → 1.00 =====
      tl.add("#w-dk", { clipPath: [bubClip, "inset(0px 0px 0px 0px round 0px)"], duration: ms(C.WORLD) - ms(C.GROW), ease: E.cam }, ms(C.GROW));
      tl.add("#w-dk-set", { scale: [1.12, 1], duration: 900, ease: E.cam }, ms(C.GROW));
      const dkEnd = CUT === 30 ? C.DIP1 : C.DIP2;
      tl.add("#w-dk-pan", { translateX: [25, -25], duration: ms(dkEnd) - ms(C.WORLD), ease: E.cam }, ms(C.WORLD)); // 히어로: 팬 −50 px
      // 상담사 답 ①: 아이브로·리드 단어 블러, 헤드 두 줄 마스크 줄 상승 (영화의 2/2)
      const ebEl = $("#w-dk-txt > .eb");
      const ebw = ebEl ? split(ebEl) : [];
      const a1ld = split($("#w-a1 .ld"));
      tl.set(ebw.concat(a1ld), { opacity: 0 }, 0);
      words(tl, ebw.concat(a1ld), C.WORLD + 0.05);
      const a1h = Array.from(document.querySelectorAll("#w-a1 .hl > span"));
      tl.set(a1h, { translateY: "105%" }, 0);
      rise(tl, a1h, C.WORLD + 0.35);

      if (CUT === 30) {
        // 상담사 답 ②: ①은 단어별 블러아웃, ②는 리드 단어 블러 + 헤드 회색 → 잉크 쓸기
        split($("#w-a1"));
        const w1 = Array.from(document.querySelectorAll("#w-a1 .w")); // 이미 나눈 리드 단어까지 모두
        wordsOut(tl, w1, C.ANS2 - 0.35);
        tl.set("#w-a2", { opacity: 1 }, ms(C.ANS2));
        const a2ld = split($("#w-a2 .ld"));
        tl.set(a2ld, { opacity: 0 }, 0);
        words(tl, a2ld, C.ANS2);
        const a2h = split($("#w-a2")).filter((w) => w.closest(".hx"));
        tl.set(a2h, { color: "#d6cfc2" }, 0);
        sweep(tl, a2h, C.ANS2 + 0.2, "#d6cfc2", "#161616");

        // ===== 딥컷 1 → 부엌: 3프레임 40 % 어둡게 뒤 하드컷. 샌드 패널이 아래에서 들리듯(마스크 리빌), 체크 60 ms 스태거 =====
        tl.set("#w-dip", { opacity: 0.4 }, ms(C.DIP1 - 0.1));
        tl.set("#w-dip", { opacity: 0 }, ms(C.DIP1));
        tl.set("#w-kt", { opacity: 1 }, ms(C.DIP1));
        tl.set("#w-dk", { opacity: 0 }, ms(C.DIP1));
        tl.add("#w-kt-push", { scale: [1, 1.06], duration: ms(C.DIP2) - ms(C.DIP1), ease: E.cam }, ms(C.DIP1));
        tl.set("#w-pn", { clipPath: "inset(840px 0px 0px 0px)" }, 0);
        tl.add("#w-pn", { clipPath: ["inset(840px 0px 0px 0px)", "inset(0px 0px 0px 0px)"], duration: 600, ease: E.expo }, ms(C.DIP1 + 0.1));
        const items = ["#w-i1", "#w-i2", "#w-i3"].map((q) => $(q));
        tl.set(items, { opacity: 0 }, 0);
        items.forEach((el, i) => tl.add(el, { opacity: [0, 1], filter: ["blur(6px)", "blur(0px)"], duration: 160, ease: E.expo }, ms(C.DIP1 + 0.55 + i * 0.06)));
      }

      // ===== 딥컷 2 → 계단 (풀블리드), 슬로건 단어 블러 =====
      const prev = CUT === 30 ? "#w-kt" : "#w-dk";
      tl.set("#w-dip", { opacity: 0.4 }, ms(C.DIP2 - 0.1));
      tl.set("#w-dip", { opacity: 0 }, ms(C.DIP2));
      tl.set("#w-st", { opacity: 1 }, ms(C.DIP2));
      tl.set(prev, { opacity: 0 }, ms(C.DIP2));
      // 계단 사진은 위쪽 기준 1.15배로 놓아 천장 면을 넓히고(창 y 563–), 1.15 → 1.20 푸시
      $("#w-st-push").style.transformOrigin = "540px 0px";
      tl.add("#w-st-push", { scale: [1.15, 1.2], duration: ms(C.FLOOD + 0.55) - ms(C.DIP2), ease: E.cam }, ms(C.DIP2));
      const sw = split($("#w-st-txt"));
      tl.set(sw, { opacity: 0 }, 0);
      words(tl, sw, C.DIP2 + 0.1);

      // ===== 계단 사진이 아래에서 위로 걷히며(0.55 s in-out) 크림 종이 엔드카드가 드러난다. 티커 띠가 먼저 보인다 =====
      const F = C.FLOOD;
      tl.set("#w-end", { opacity: 1 }, ms(F));
      tl.add("#w-st", { clipPath: ["inset(0px 0px 0px 0px)", "inset(0px 0px 1920px 0px)"], duration: 550, ease: E.cam }, ms(F));
      // 과목 티커: 일정한 속도로 왼쪽으로 (브랜드 띠의 동작)
      tl.add("#w-tk-row", { translateX: [0, -260], duration: ms(C.END) - ms(F), ease: "linear" }, ms(F));
      // 엔드카드 블록: 블러 등장 (슬라이드 없음)
      const fade = (q, t) => tl.add(q, { opacity: [0, 1], filter: ["blur(6px)", "blur(0px)"], duration: 200, ease: E.expo }, ms(t));
      const blocks = ["#w-logo", "#w-e-eb", "#w-e-bd", "#w-link", "#w-tel", "#w-dial"].concat(Array.from(document.querySelectorAll("#w-e-ck .ck")));
      tl.set(blocks.filter((q) => typeof q !== "string" || $(q)), { opacity: 0 }, 0);
      const hw = split($("#w-e-hd"));
      tl.set(hw, { opacity: 0 }, 0);
      const T = CUT === 30
        ? { logo: 0.45, eb: 0.55, hd: 0.6, bd: 0.95, ck: 1.05, link: 1.2, tel: 1.3 }
        : { logo: 0.45, eb: 0.55, hd: 0.6, ck: 0.9, link: 1.05, tel: 1.15 };
      fade("#w-dial", F + 0.3);
      fade("#w-logo", F + T.logo);
      fade("#w-e-eb", F + T.eb);
      words(tl, hw, F + T.hd);
      if (CUT === 30) fade("#w-e-bd", F + T.bd);
      document.querySelectorAll("#w-e-ck .ck").forEach((el, i) => fade(el, F + T.ck + i * 0.06));
