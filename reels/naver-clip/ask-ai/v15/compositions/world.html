<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOV-subset.woff2") format("woff2");
      font-weight: 45 930;
    }
    /* v7 편 A — 마디 8–16. 핸드오프 말풍선이 자라 세계가 된다(0.65 s in-out, 모서리 40→0) → 주말 아침 책상(A-02) 상담사 답 Head 88
       → 딥컷 → 부엌(A-03) 위 종이 카드 840 한 장(마스크 리빌, 근거 3줄) → 딥컷 → 계단(A-04) 위 종이 띠 + 슬로건 Display 144
       → 컬러 플러드 Paper→Navy(0.4 s in-out) → 엔드카드(락업 · 슬로건 캐리 0.611 · 질문형 CTA · 링크 안내 + 골드 화살표 · 전화).
       버튼·알약 모양 없음. 사진 위 글자는 하늘·종이 띠 같은 조용한 면에서만. 딤·블러(사진)·그림자·그라데이션 없음. */
    #root { position: absolute; inset: 0; overflow: hidden; color: var(--color-ink, #0e1116); font-family: "PretendardGOV", sans-serif; word-break: keep-all; }
    .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    .plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    .row { position: absolute; left: 0; width: 1080px; text-align: center; }
    .hd { font-size: 88px; line-height: 101px; font-weight: 600; letter-spacing: -0.03em; }
    .bd { font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    .dsp { font-size: 144px; line-height: 151px; font-weight: 700; letter-spacing: -0.045em; }
    .ln { display: block; overflow: hidden; white-space: nowrap; }
    .ln > span { display: inline-block; }
    .dl { display: block; height: 151px; white-space: nowrap; }
    .dl > span { display: inline-block; padding-right: 0.045em; }
    .g { font-style: normal; color: var(--color-gold, #b8955a); }
    .mut { color: #5f6368; }

    /* 주말 책상: 사진 1.06배(팬 −50 px 여유), 말풍선 톤이 사진으로 바뀐다 */
    #w-dk-img { position: absolute; left: -32px; top: -58px; width: 1145px; height: 2036px; display: block; }
    #w-dk-tone { position: absolute; inset: 0; background: #eae7df; }
    #w-dk-lab { top: 236px; font-weight: 600; }
    #w-ans1, #w-ans2 { top: 322px; }

    /* 부엌 + 종이 카드 하나 (840, 가운데) */
    #w-card { position: absolute; left: 120px; top: 600px; width: 840px; height: 444px; background: var(--color-paper, #f7f6f2); border-radius: 20px; }
    #w-list { position: absolute; left: 0; top: 56px; width: 840px; text-align: center; }
    #w-list-in { display: inline-block; text-align: left; }
    .it { display: block; height: 62px; white-space: nowrap; }
    .it + .it { margin-top: 73px; position: relative; }
    .it + .it::before { content: ""; position: absolute; left: -64px; right: -64px; top: -37px; height: 1px; background: rgba(14, 17, 22, 0.14); }
    .chk { display: inline-block; width: 40px; height: 40px; vertical-align: -6px; margin-right: 18px; }

    /* 계단 + 종이 띠(플러드로 Navy 엔드카드가 된다) */
    #w-st-img { position: absolute; left: 0; top: 510px; width: 1080px; height: 1920px; display: block; }
    #w-band { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--color-paper, #f7f6f2); }
    #w-foot { position: absolute; left: 0; top: 1580px; width: 1080px; height: 340px; background: var(--color-paper, #f7f6f2); }
    #w-slo { position: absolute; left: 0; top: 280px; width: 1080px; text-align: center; transform-origin: 540px 0px; }

    /* 엔드카드 */
    #w-logo { height: 62px; display: flex; justify-content: center; }
    #w-logo-row { display: flex; align-items: center; gap: 18px; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-paper, #f7f6f2); }
    #w-mark { display: block; width: 56px; height: 62px; background: var(--color-gold, #b8955a); -webkit-mask: url("assets/img/mark-gold.svg") center / contain no-repeat; mask: url("assets/img/mark-gold.svg") center / contain no-repeat; }
    .on-navy { color: var(--color-paper, #f7f6f2); }
    .sec { color: #9aa0a6; }
    #w-arrow { position: absolute; left: 512px; width: 56px; height: 40px; overflow: visible; }
    #w-arrow path { fill: none; stroke: var(--color-gold, #b8955a); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    #w-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-motion-blur="on">
    <!-- 세계 2: 주말 아침 책상 (말풍선이 자라 이 세계가 된다) -->
    <div id="w-dk" class="layer" data-layout-allow-overflow>
      <div id="w-dk-set" class="layer" data-layout-allow-overflow>
        <div id="w-dk-pan" class="layer" data-layout-allow-overflow><img id="w-dk-img" src="assets/img/A-02-weekend-desk.png" alt="" data-fill /></div>
      </div>
      <div id="w-dk-tone"></div>
      <div id="w-dk-lab" class="row bd mut"><span data-m="c">상담사</span></div>
      <div id="w-ans1" class="row hd">
        <div class="ln"><span data-m="c"><em class="g">퇴근 후·주말에,</em></span></div>
        <div class="ln"><span data-m="c">100% 온라인으로</span></div>
        <div class="ln"><span data-m="c">들을 수 있어요.</span></div>
      </div>
      <div id="w-ans2" class="row hd">
        <div class="ln"><span data-m="c">이미 딴 학점이</span></div>
        <div class="ln"><span data-m="c">있으면 <em class="g" data-gold="1">기간·비용</em>을</span></div>
        <div class="ln"><span data-m="c">줄일 수 있어요.</span></div>
      </div>
    </div>
    <!-- 세계 3: 부엌, 종이 카드 하나 -->
    <div id="w-kt" class="layer" data-layout-allow-overflow>
      <div id="w-kt-push" class="layer" data-layout-allow-overflow><img class="plate" src="assets/img/A-03-kitchen-laptop.png" alt="" data-fill /></div>
      <div id="w-card" data-m="col">
        <div id="w-list" class="bd"><div id="w-list-in" data-m="c">
          <span class="it" id="w-i1"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>100% 온라인, 출석 없이</span>
          <span class="it" id="w-i2"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>교육부장관 명의 법학사</span>
          <span class="it" id="w-i3"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>전문대 졸업이면 60학점부터</span>
        </div></div>
      </div>
    </div>
    <!-- 세계 4: 계단, 위쪽 종이 띠 + 슬로건 → 플러드 → 엔드카드 -->
    <div id="w-st" class="layer" data-layout-allow-overflow>
      <div id="w-st-push" class="layer" data-layout-allow-overflow><img id="w-st-img" src="assets/img/A-04-stairs.png" alt="" data-fill /></div>
      <div id="w-band" data-fill data-layout-ignore><div id="w-foot" data-fill></div></div>
      <div id="w-slo" class="dsp">
        <div class="dl"><span data-m="c">책임지는</span></div>
        <div class="dl"><span data-m="c">자리로,</span></div>
        <div class="dl"><span data-m="c">지금 있는</span></div>
        <div class="dl"><span data-m="c">자리에서.</span></div>
      </div>
      <div id="w-logo" class="row"><div id="w-logo-row" data-m="c"><span id="w-mark"></span><span>경찰복지사이버평생교육원</span></div></div>
      <div id="w-q" class="row hd on-navy">
        <div class="ln"><span data-m="c">내 학점이면,</span></div>
        <div class="ln"><span data-m="c"><em class="g">얼마나 남았을까?</em></span></div>
      </div>
      <div id="w-one" class="row bd on-navy"><span data-m="c">지금 학력·학점으로 남은 과정, 1:1로 짚어드려요</span></div>
      <div id="w-tel" class="row bd sec"><span data-m="c">전화 문의 070-4006-7128 (평일 10–18시)</span></div>
      <div id="w-act" class="row bd on-navy"><span data-m="c">아래 링크에서 내 경우 확인하기</span></div>
      <svg id="w-arrow" viewBox="0 0 56 40"><path d="M28 2V36M12 22L28 37L44 22" /></svg>
    </div>
    <div id="w-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { ms, E, D, timeline, rise, words, wordsOut, sweep, split, A } = window.HF;
      const C = window.HFCUE(CUT);
      const L = C.L;
      const $ = (s) => document.querySelector(s);
      const tl = timeline();
      const INK = "#0e1116", PAPER = "#f7f6f2", NAVY = "#0b1a33", FOOT = "#102545", GOLD = "#b8955a";

      // ---------- 15초: 상담사 답은 한 줄짜리, 부엌 카드 없음, 엔드카드 1:1 줄 없음 ----------
      if (CUT === 15) {
        $("#w-ans1").innerHTML = '<div class="ln"><span data-m="c"><em class="g">퇴근 후·주말에,</em></span></div><div class="ln"><span data-m="c">100% 온라인으로.</span></div>';
        ["#w-ans2", "#w-kt", "#w-one", "#w-dk-lab"].forEach((q) => $(q).remove());
        $("#w-ans1").style.top = "300px"; // 두 줄 묶음을 하늘 면 가운데로
      }
      // ---------- 엔드카드 세로 배치 (블록 사이 ≤ 140, 위 빈 띠 ≤ 15%) ----------
      const Y = CUT === 30
        ? { logo: 228, sloTo: 360, q: 809, one: 1047, tel: 1145, act: 1277, arrow: 1375 }
        : { logo: 260, sloTo: 402, q: 861, tel: 1133, act: 1285, arrow: 1387 };
      const pos = (q, y) => { const el = $(q); if (el) el.style.top = y + "px"; };
      pos("#w-logo", Y.logo); pos("#w-q", Y.q); pos("#w-one", Y.one); pos("#w-tel", Y.tel); pos("#w-act", Y.act); pos("#w-arrow", Y.arrow);

      // ---------- 시작 상태 ----------
      const B = L.bub;
      const bubClip = "inset(" + B.t.toFixed(1) + "px " + B.l.toFixed(1) + "px " + (1920 - B.b).toFixed(1) + "px " + B.l.toFixed(1) + "px round " + B.rad.toFixed(1) + "px)";
      tl.set("#w-dk", { clipPath: bubClip }, 0);
      const later = ["#w-st"].concat(CUT === 30 ? ["#w-kt", "#w-ans2"] : []);
      tl.set(later, { opacity: 0 }, 0);
      const a1 = Array.from(document.querySelectorAll("#w-ans1 .ln > span"));
      tl.set(a1, { translateY: "105%" }, 0);
      if (CUT === 30) tl.set("#w-dk-lab", { opacity: 0 }, 0);

      // ===== 말풍선이 세계가 된다 (GROW → WORLD = 다운비트, 0.65 s in-out, 모서리 40 → 0). 톤 면이 사진으로 바뀌고 사진은 살짝 크게 들어와 앉는다 =====
      tl.add("#w-dk", { clipPath: [bubClip, "inset(0px 0px 0px 0px round 0px)"], duration: ms(C.WORLD) - ms(C.GROW), ease: E.cam }, ms(C.GROW));
      tl.add("#w-dk-tone", { opacity: [1, 0], duration: 350, ease: E.exit }, ms(C.GROW + 0.1));
      tl.add("#w-dk-set", { scale: [1.12, 1], duration: 900, ease: E.cam }, ms(C.GROW));
      // 히어로 무브: 팬 −50 px (다음 컷까지)
      const dkEnd = CUT === 30 ? C.DIP1 : C.DIP2;
      tl.add("#w-dk-pan", { translateX: [25, -25], duration: ms(dkEnd) - ms(C.WORLD), ease: E.cam }, ms(C.WORLD));
      // 상담사 답 ① — 마스크 줄 상승 (이 영화의 2/2)
      if (CUT === 30) tl.add("#w-dk-lab", { opacity: [0, 1], filter: ["blur(6px)", "blur(0px)"], duration: 200, ease: E.expo }, ms(C.WORLD + 0.05));
      rise(tl, a1, C.WORLD + 0.15);

      if (CUT === 30) {
        // 상담사 답 ② — ①은 단어별로 흐려지며 빠지고, ②는 회색에서 잉크로 쓸린다
        const w1 = split($("#w-ans1"));
        wordsOut(tl, w1, C.ANS2 - 0.3);
        const w2 = split($("#w-ans2"));
        w2.forEach((w) => { if (w.closest("[data-gold]")) w.dataset.to = GOLD; });
        tl.set(w2, { color: "#cfccc4" }, 0);
        tl.set("#w-ans2", { opacity: 1 }, ms(C.ANS2));
        sweep(tl, w2, C.ANS2 + 0.02, "#cfccc4", INK);

        // ===== 딥컷 1 → 부엌: 3프레임 40% 어둡게 뒤 하드컷 =====
        tl.set("#w-dip", { opacity: 0.4 }, ms(C.DIP1 - 0.1));
        tl.set("#w-dip", { opacity: 0 }, ms(C.DIP1));
        tl.set("#w-kt", { opacity: 1 }, ms(C.DIP1));
        tl.add("#w-kt-push", { scale: [1, 1.06], duration: ms(C.DIP2) - ms(C.DIP1), ease: E.cam }, ms(C.DIP1));
        // 종이 카드: 아래에서 들리듯 마스크 리빌 0.7 s, 근거 줄은 60 ms 간격 블러 등장
        tl.set("#w-card", { clipPath: "inset(100% 0px 0px 0px round 20px)" }, 0);
        tl.add("#w-card", { clipPath: ["inset(100% 0px 0px 0px round 20px)", "inset(0% 0px 0px 0px round 20px)"], duration: 700, ease: E.expo }, ms(C.DIP1 + 0.12));
        const items = ["#w-i1", "#w-i2", "#w-i3"].map((q) => $(q));
        tl.set(items, { opacity: 0 }, 0);
        items.forEach((el, i) => tl.add(el, { opacity: [0, 1], filter: ["blur(6px)", "blur(0px)"], duration: 160, ease: E.expo }, ms(C.DIP1 + 0.5 + i * 0.06)));
      }

      // ===== 딥컷 2 → 계단 + 종이 띠 + 슬로건 (단어별 블러) =====
      const prev = CUT === 30 ? "#w-kt" : "#w-dk";
      tl.set("#w-dip", { opacity: 0.4 }, ms(C.DIP2 - 0.1));
      tl.set("#w-dip", { opacity: 0 }, ms(C.DIP2));
      tl.set("#w-st", { opacity: 1 }, ms(C.DIP2));
      tl.set(prev, { opacity: 0 }, ms(C.DIP2));
      $("#w-st-push").style.transformOrigin = "540px 1300px";
      tl.add("#w-st-push", { scale: [1, 1.05], duration: ms(C.FLOOD + 0.4) - ms(C.DIP2), ease: E.cam }, ms(C.DIP2));
      tl.set("#w-band", { clipPath: "inset(0px 0px 950px 0px)" }, 0);
      const sw = split($("#w-slo"));
      tl.set(sw, { opacity: 0 }, 0);
      words(tl, sw, C.DIP2 + 0.1);

      // ===== 컬러 플러드: 종이 띠가 화면 전체로 내려오며 Navy 가 된다 (0.4 s in-out). 슬로건은 남아 색만 바뀐다 =====
      const F = C.FLOOD;
      tl.add("#w-band", { clipPath: ["inset(0px 0px 950px 0px)", "inset(0px 0px 0px 0px)"], backgroundColor: [PAPER, NAVY], duration: 400, ease: E.cam }, ms(F));
      tl.add("#w-foot", { backgroundColor: [PAPER, FOOT], duration: 400, ease: E.cam }, ms(F));
      tl.add("#w-slo", { color: [INK, PAPER], duration: 400, ease: E.cam }, ms(F));
      // 캐리: 슬로건이 0.611배(Display 144 → 시각 88)로 줄며 엔드카드 자리로
      tl.add("#w-slo", { scale: [1, 0.611], translateY: [0, Y.sloTo - 280], duration: 500, ease: E.cam }, ms(F + 0.25));
      // 엔드카드 블록: 블러 등장 (슬라이드 없음)
      const endEls = ["#w-logo-row", "#w-q", "#w-tel", "#w-act"].concat(CUT === 30 ? ["#w-one"] : []);
      tl.set(endEls, { opacity: 0 }, 0);
      const fade = (q, t) => tl.add(q, { opacity: [0, 1], filter: ["blur(6px)", "blur(0px)"], duration: 200, ease: E.expo }, ms(t));
      fade("#w-logo-row", F + 0.45);
      tl.set("#w-q", { opacity: 1 }, ms(F + 0.55));
      const qw = split($("#w-q"));
      tl.set(qw, { opacity: 0 }, 0);
      words(tl, qw, F + 0.55);
      if (CUT === 30) fade("#w-one", F + 0.85);
      fade("#w-tel", F + (CUT === 30 ? 0.95 : 0.85));
      fade("#w-act", F + (CUT === 30 ? 1.05 : 0.95));
      const arrow = A.svg.createDrawable("#w-arrow path");
      tl.set(arrow, { draw: "0 0" }, 0);
      tl.add(arrow, { draw: ["0 0", "0 1"], duration: 350, ease: E.expo }, ms(F + (CUT === 30 ? 1.15 : 1.05)));
      tl.set({ v: 0 }, { v: 1 }, ms(C.END));
      tl.seek(0);
    })();
  </script>
</template>
