<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOV-subset.woff2") format("woff2");
      font-weight: 45 930;
    }
    /* 아트 디렉션 v3.2 + v6 편 A: Navy 단색 필드, 중심축 x=540, 텍스트 폭 ≤ 840, 크기 4단계(144/88/44/26), 골드 ≤ 5%.
       로고 락업(y 300) → 내용 블록(질문 인용 → 상담사 답 → 근거 → 슬로건) → 고정 CTA 트랙(골드 버튼 1개 + 전화 보조 한 줄).
       내용 블록은 락업과 버튼 사이에 위·아래·사이 틈이 같게 앉고 틈 ≤ 140. 바닥은 한 톤 다른 전체 폭 풋터 필드(y 1580–1920), 고지는 그 위(legal 레이어). */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: var(--color-paper, #f7f6f2);
      font-family: "PretendardGOV", sans-serif;
      word-break: keep-all;
    }
    /* 오프닝 윈도우: [상담사 연결] 버튼 크기의 clip-path inset → 전체 화면 */
    #br-win { position: absolute; inset: 0; background: var(--color-navy, #0b1a33); }
    #br-foot { position: absolute; left: 0; top: 1580px; width: 1080px; height: 340px; background: var(--color-foot, #102545); }
    .row { position: absolute; left: 0; width: 1080px; text-align: center; }
    .blk { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; }
    .push { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    .lnD, .lnH, .lnB { display: block; overflow: hidden; white-space: nowrap; }
    .lnD > span, .lnH > span, .lnB > span { display: inline-block; }
    /* Display 144 / 700 / −0.045em / 1.05 */
    .dsp { font-size: 144px; line-height: 1.05; font-weight: 700; letter-spacing: -0.045em; }
    .dsp .lnD > span { padding-right: 0.045em; }
    /* Head 88 / 600 / −0.03em / 1.15 */
    .hd { font-size: 88px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em; }
    .hd .lnH > span { padding-right: 0.03em; }
    /* Body 44 / 500 / −0.01em / 62px */
    .bd { font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    .bd .lnB > span { padding-right: 0.01em; }
    .g { font-style: normal; color: var(--color-gold, #b8955a); }
    .sec { color: var(--color-sec, #9aa0a6); }

    /* 로고 락업: 금색 심볼(62px) + 기관명(Body 44/600), 간격 18px, 한 줄, 락업 전체가 x=540. y 300 에 끝까지 */
    #br-logo { top: 300px; height: 62px; display: flex; align-items: center; justify-content: center; }
    #br-logo-row { display: flex; align-items: center; gap: 18px; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; padding-right: 0.01em; }
    #br-mark { display: block; width: 56px; height: 62px; background: var(--color-gold, #b8955a); -webkit-mask: url("assets/img/mark-gold.svg") center / contain no-repeat; mask: url("assets/img/mark-gold.svg") center / contain no-repeat; }

    /* 근거 리스트: 골드 체크 + 글, 묶음 가운데·줄 왼쪽 맞춤 (체크가 한 세로줄). 카드·박스 없음 */
    #b-list .lnB { margin-bottom: 60px; }
    #b-list .lnB:last-child { margin-bottom: 0; }
    #list-blk { display: inline-block; text-align: left; }
    .chk { display: inline-block; width: 34px; height: 34px; vertical-align: -4px; margin-right: 16px; }

    /* CTA 버튼 하나: 컬럼 전폭 골드 면 + Navy 글자 (840×104). 라벨은 한 줄 */
    #b-btn { height: 104px; }
    #btn-face { position: absolute; left: 120px; top: 0; width: 840px; height: 104px; border-radius: 52px; background: var(--color-gold, #b8955a); color: var(--color-navy, #0b1a33); display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
    #btn-face span { padding-right: 0.01em; }
    /* 전화: 보조 한 줄 (Body 44) — 번호는 Paper, 운영 시간은 보조색 */
    #tel-1 .tn { color: var(--color-paper, #f7f6f2); }

    /* 열리기 직전 버튼 라벨 (chat.html 의 #ch-btn 과 같은 자리·같은 배율) */
    #br-label { position: absolute; left: 120px; width: 840px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; transform: scale(1.03); }
  </style>
  <div id="root" data-composition-id="brand" data-width="1080" data-height="1920">
    <div id="br-win" data-layout-allow-overflow>
      <div id="br-foot" data-fill data-layout-ignore></div>
      <div id="br-label"><span>상담사 연결</span></div>

      <div id="br-logo" class="row"><div id="br-logo-row" data-m="c"><span id="br-mark"></span><span>경찰복지사이버평생교육원</span></div></div>

      <!-- 내용 그룹: 질문 인용(상단 고정) → 상담사 답 ① ② → 근거 3줄 → 슬로건(인용 자리로 교체). 30초는 한 컷, 안에서 블록이 바뀐다 -->
      <div id="br-c" class="push">
        <div id="b-q" class="blk bd sec">
          <div class="lnB"><span id="q-1" data-m="c">“전문대 나왔는데,</span></div>
          <div class="lnB"><span id="q-2" data-m="c">퇴근하고 법 공부 할 수 있을까?”</span></div>
        </div>
        <div id="b-ans1" class="blk hd">
          <div class="lnH"><span id="ca-1" data-m="c"><em class="g">퇴근 후·주말에,</em></span></div>
          <div class="lnH"><span id="ca-2" data-m="c">100% 온라인으로</span></div>
          <div class="lnH"><span id="ca-3" data-m="c">들을 수 있어요.</span></div>
        </div>
        <div id="b-ans2" class="blk hd">
          <div class="lnH"><span id="cb-1" data-m="c">이미 딴 학점이</span></div>
          <div class="lnH"><span id="cb-2" data-m="c">있으면 <em class="g">기간·비용</em>을</span></div>
          <div class="lnH"><span id="cb-3" data-m="c">줄일 수 있어요.</span></div>
        </div>
        <div id="b-list" class="blk bd"><div id="list-blk" data-m="c">
          <div class="lnB"><span id="ls-1"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>100% 온라인, 출석 없이</span></div>
          <div class="lnB"><span id="ls-2"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>교육부장관 명의 법학사</span></div>
          <div class="lnB"><span id="ls-3"><svg class="chk" viewBox="0 0 24 24"><path d="M4.5 12.5l4.8 4.6L19.5 7" fill="none" stroke="#b8955a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>전문대 졸업이면 60학점부터</span></div>
        </div></div>
      </div>
      <!-- 슬로건: 30초는 #br-c 안(인용 자리)으로 옮겨 같은 컷 푸시를 이어받고, 15초는 C6 하드컷의 엔드카드 -->
      <div id="br-end" class="push">
        <div id="b-slo" class="blk hd">
          <div class="lnH"><span id="slo-1" data-m="c">책임지는 자리로,</span></div>
          <div class="lnH"><span id="slo-2" data-m="c">지금 있는 자리에서.</span></div>
        </div>
      </div>

      <!-- CTA 트랙: 주 CTA 버튼 하나 + 전화 보조 한 줄. 브랜드 진입(BR)부터 끝까지 같은 자리 -->
      <div id="b-btn" class="blk"><div id="btn-face" data-m="col"><span>내 학점으로 남은 기간, 무료로 진단받기</span></div></div>
      <div id="b-tel" class="blk bd sec"><div class="lnB"><span id="tel-1" data-m="c"><span class="tn">070-4006-7128</span> (평일 10–18시)</span></div></div>
    </div>
  </div>
  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { ms, E, D, timeline, rise, riseOut, ui, push } = window.HF;
      const C = window.HFCUE(CUT); // lib/cue.js
      const $ = (q) => document.querySelector(q);
      const tl = timeline();
      const { BR, WIN, END } = C;
      const BTN_CY = 1302; // chat.html 과 같은 값 (입력 독 위 16 − 버튼 높이/2)

      if (CUT === 15) {
        // 15초: 하드컷(C6) 뒤 엔드카드 = 슬로건 Display 144 네 줄 + 같은 버튼·전화. 상담사 답은 ① 하나, 근거 리스트 없음
        ["#b-ans2", "#b-list"].forEach((q) => $(q).remove());
        const slo = $("#b-slo");
        slo.className = "blk dsp";
        slo.innerHTML = ["책임지는", "자리로,", "지금 있는", "자리에서."].map((t, i) => '<div class="lnD"><span id="slo-' + (i + 1) + '" data-m="c">' + t + "</span></div>").join("");
      } else {
        $("#br-c").appendChild($("#b-slo"));
        $("#br-end").remove();
      }
      $("#br-label").style.top = BTN_CY - 60 + "px";

      // ---------- 레이아웃: 빌드 때 한 번 잰다 ----------
      const H = (q) => $(q).offsetHeight;
      const FROM = 362; // 로고 락업 아래
      const TRACK_BOTTOM = 1390; // 전화 줄 아래 (고지 y 1520 까지 130)
      const TG = 40; // 버튼과 전화 사이
      const yTel = TRACK_BOTTOM - H("#b-tel");
      const yBtn = yTel - TG - H("#b-btn");
      // 같은 간격으로 앉히기: ids 블록들을 [from, to] 안에 위·아래·사이 틈을 같게
      function even(ids, from, to) {
        const hs = ids.map(H);
        const g = (to - from - hs.reduce((s, h) => s + h, 0)) / (ids.length + 1);
        let y = from + g;
        return ids.map((q, i) => { const r = Math.round(y); y += hs[i] + g; return r; });
      }
      // 블록 위치 추적: 처음 자리는 t=0 에 놓고, 이후엔 450ms in-out 글라이드 (같은 요소에 글라이드 뒤 set 을 걸지 않는다)
      const Y = {};
      const place = (q, y) => { Y[q] = y; tl.set(q, { translateY: y }, 0); };
      const move = (q, y, t) => { tl.add(q, { translateY: [Y[q], y], duration: D.glide, ease: E.glide }, ms(t)); Y[q] = y; };

      // 질문 인용은 상단에 고정, 그 아래 슬롯에 상담사 답 → 근거가 같은 가운데 자리로 들어온다
      const yQ = even(["#b-q", "#b-ans1"], FROM, yBtn)[0];
      const slotFrom = yQ + H("#b-q");
      const inSlot = (q) => slotFrom + Math.round((yBtn - slotFrom - H(q)) / 2);
      place("#b-q", yQ);
      place("#b-ans1", inSlot("#b-ans1"));
      place("#b-btn", yBtn);
      place("#b-tel", yTel);

      // ---------- 시작 상태 ----------
      const half = { w: 432.6, h: 61.8 }; // 840×120 버튼 × 1.03 (챗 카메라 푸시 끝 배율)
      const winFrom = "inset(" + (BTN_CY - half.h) + "px " + (540 - half.w) + "px " + (1920 - BTN_CY - half.h) + "px " + (540 - half.w) + "px round " + half.h + "px)";
      const winTo = "inset(0px 0px 0px 0px round 0px)";
      tl.set("#br-win", { clipPath: winFrom }, 0);
      const lines = Array.from(document.querySelectorAll(".lnD > span, .lnH > span, .lnB > span"));
      tl.set(lines, { translateY: "105%" }, 0);
      tl.set(["#br-logo-row", "#btn-face"], { opacity: 0 }, 0);

      // ===== 시그니처: 눌린 버튼이 열려 화면 전체가 상담 화면이 된다 (1200ms in-out, 중간점 = BR 크래시) =====
      tl.add("#br-win", { clipPath: [winFrom, winTo], duration: D.open, ease: E.draw }, ms(WIN));
      tl.add("#br-label", { opacity: [1, 0], duration: D.exit, ease: E.exit }, ms(WIN + 0.05));
      ui(tl, "#br-logo-row", BR);
      // 질문 인용 → 상담사 답 ① ; 주 CTA 버튼과 전화 보조 줄은 처음부터 끝까지 같은 자리
      rise(tl, ["#q-1", "#q-2"], BR + 0.12);
      rise(tl, ["#ca-1", "#ca-2", "#ca-3"], BR + 0.5);
      rise(tl, "#tel-1", BR + 0.75);
      ui(tl, "#btn-face", BR + 0.95);
      const out3 = (ids, t) => ids.forEach((q, i) => riseOut(tl, q, t + i * 0.06));

      if (CUT === 30) {
        // 다음 다운비트(+2마디): ① 이 위로 빠지고 ② 가 같은 자리로
        place("#b-ans2", inSlot("#b-ans2"));
        out3(["#ca-1", "#ca-2", "#ca-3"], C.S2 - 0.3);
        rise(tl, ["#cb-1", "#cb-2", "#cb-3"], C.S2);
        // +4마디: ② 가 빠지고 근거 3줄 (한 줄씩 90ms)
        place("#b-list", inSlot("#b-list"));
        out3(["#cb-1", "#cb-2", "#cb-3"], C.S3 - 0.3);
        rise(tl, ["#ls-1", "#ls-2", "#ls-3"], C.S3);
        // 마지막 구간 C(+6마디): 인용이 슬로건으로 바뀌고(교체), 근거 리스트는 아래로 고르게 다시 앉는다
        const pe = even(["#b-slo", "#b-list"], FROM, yBtn);
        place("#b-slo", pe[0]);
        out3(["#q-1", "#q-2"], C.S4 - 0.3);
        move("#b-list", pe[1], C.S4 - 0.1);
        rise(tl, ["#slo-1", "#slo-2"], C.S4);
        push(tl, "#br-c", WIN, END);
      } else {
        // 15초: 상담사 답 ① 하나 → C6 하드컷(마지막 크래시): 슬로건 Display 네 줄 + 같은 버튼·전화
        push(tl, "#br-c", WIN, C.C6);
        tl.set("#br-c", { opacity: 0 }, ms(C.C6));
        place("#b-slo", even(["#b-slo"], FROM, yBtn)[0]);
        rise(tl, ["#slo-1", "#slo-2", "#slo-3", "#slo-4"], C.C6);
        push(tl, "#br-end", C.C6, END);
      }
      tl.set({ v: 0 }, { v: 1 }, ms(END));
      tl.seek(0);
    })();
  </script>
</template>
