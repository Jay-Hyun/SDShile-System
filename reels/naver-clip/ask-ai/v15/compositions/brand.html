  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { A, P, ms, timeline, shake, flash } = window.HF;
      const $ = (q) => document.querySelector(q);
      const tl = timeline();
      // 브랜드 진입 = 버튼 탭 다음 비트 = 원곡 B섹션 크래시 (src 16.363)
      const T = CUT === 30 ? 30.5 * P + 8 * P : 8.5;
      const at = (k) => ms(T + k * P); // 브랜드 진입 기준 k비트

      if (CUT === 15) {
        $("#br-bub").innerHTML = $("#br-bub").innerHTML.replace("첫 계단은,", "첫 계단,");
        ["#br-chip", "#br-cta1", "#br-cta2", "#br-sub"].forEach((q) => $(q).remove());
        $("#br-cs").style.top = "800px"; $("#br-bub").style.top = "800px"; $("#br-cdots").style.top = "808px";
      }
      // 오도미터 숫자 (0→60): 십의 자리 0–6, 일의 자리 0–9 ×6 + 0
      const H = 76;
      $("#odo-t").innerHTML = [0, 1, 2, 3, 4, 5, 6].map((d) => "<b>" + d + "</b>").join("");
      let ones = "";
      for (let i = 0; i <= 60; i++) ones += "<b>" + (i % 10) + "</b>";
      $("#odo-o").innerHTML = ones;

      const IN = (q, k, from, dur, ease) => {
        const p = Object.assign({ opacity: [0, 1], filter: ["blur(10px)", "blur(0px)"] }, from || {});
        tl.add(q, Object.assign(p, { duration: (dur || 0.3) * 1000, ease: ease || "outExpo" }), at(k));
      };
      const OUT = (q, k, to, dur) => tl.add(q, Object.assign({ opacity: 0, filter: "blur(8px)", duration: (dur || 0.2) * 1000, ease: "inQuad" }, to || {}), at(k));
      const SPRING = (b, d) => A.spring({ bounce: b, duration: d });

      // ---- 시작 상태 ----
      const hidden = ["#br-logo", "#br-logo-s", "#br-h1", "#br-h2 .w", "#br-cs", "#br-cdots", "#br-bub", "#br-btn", "#br-tel", "#br-hand", "#br-ring", "#br-s1", "#br-s2", "#br-desk", "#br-flash"];
      if (CUT === 30) hidden.push("#br-chip", "#br-sub");
      tl.set(hidden, { opacity: 0 }, 0);
      if (CUT === 30) tl.set(["#br-cta1-t", "#br-cta2-t"], { translateY: "105%" }, 0);
      tl.set("#br-wrap", { clipPath: "circle(0px at 440px 1290px)" }, 0);
      const numUl = A.svg.createDrawable("#br-numul");
      tl.set(numUl, { draw: "0 0" }, 0);
      tl.set(["#odo-t", "#odo-o"], { translateY: 0 }, 0);

      // ===== C7 반전·브랜드: 탭한 버튼에서 원형 전환 =====
      tl.add("#br-wrap", { clipPath: ["circle(0px at 440px 1290px)", "circle(2300px at 440px 1290px)"], duration: 170, ease: "inOutQuad" }, at(0));
      tl.add("#br-sweep", { translateX: [0, 2700], rotate: [18, 18], duration: 600, ease: "inOutQuad" }, at(0.3));
      shake(tl, "#br-shake", T + 0.17, 10, 6, 41);
      IN("#br-logo", CUT === 30 ? 1 : 0.5, { translateY: [-20, 0] }, 0.35);
      const hK = CUT === 30 ? 2 : 1;
      IN("#br-h1", hK, { scale: [1.7, 1], filter: ["blur(14px)", "blur(0px)"] }, 0.28);
      shake(tl, "#br-shake", T + hK * P + 0.12, 12, 6, 42);
      document.querySelectorAll("#br-h2 .w").forEach((w, i) => IN(w, hK + (CUT === 30 ? 1 : 0.5) + i * 0.5, { translateY: [40, 0] }, 0.22));
      if (CUT === 30) shake(tl, "#br-shake", T + 4 * P, 8, 5, 43);
      tl.add("#br-cam", { scale: [1, 1.03], duration: (CUT === 30 ? 6 : 8) * P * 1000, ease: "inOutSine" }, at(0.5));

      // ===== C8 사람의 답 · 첫 계단 =====
      const c8 = CUT === 30 ? 6 : 3; // 30: T+6P, 15: 같은 화면 안
      if (CUT === 30) {
        flash(tl, "#br-flash", T + 6 * P, 0.45);
        IN("#br-chip", 6, { translateX: [-260, 0], filter: ["blur(6px)", "blur(0px)"] }, 0.35, "outQuart");
      }
      IN("#br-cs", c8 + 0.5, { scale: [0.5, 1] }, 0.35, "outBack(2)");
      tl.add("#br-cdots", { opacity: [{ to: 1, duration: 60 }, { to: 1, duration: P * 400 }, { to: 0, duration: 60 }], ease: "linear" }, at(c8 + 0.5));
      const bubK = c8 + 1;
      tl.add("#br-bub", { opacity: [0, 1], scale: [0.7, 1], ease: SPRING(0.45, 420) }, at(bubK));
      shake(tl, "#br-shake", T + bubK * P, 7, 5, 44);
      // 0→60 카운트 (2비트)
      tl.add("#odo-t", { translateY: [0, -6 * H], duration: 2 * P * 1000, ease: "outQuart" }, at(bubK + 0.5));
      tl.add("#odo-o", { translateY: [0, -60 * H], duration: 2 * P * 1000, ease: "outQuart" }, at(bubK + 0.5));
      tl.add(numUl, { draw: ["0 0", "0 1"], duration: 260, ease: "outQuart" }, at(bubK + 2.5));
      tl.add("#br-num", { scale: [{ to: 1.2, duration: 80 }, { to: 1, duration: 300, ease: "outBack(3)" }] }, at(bubK + 2.5));
      shake(tl, "#br-shake", T + (bubK + 2.5) * P, 6, 4, 45);

      if (CUT === 30) {
        // ===== C9 엔드카드 A (CTA) T+11P =====
        flash(tl, "#br-flash", T + 11 * P, 0.45);
        OUT(["#br-h1", "#br-h2", "#br-chip", "#br-cs", "#br-bub"], 11, { translateY: -60 }, 0.1);
        tl.add("#br-cam", { scale: 1, duration: 300, ease: "outExpo" }, at(11));
        tl.add("#br-cta1-t", { translateY: ["105%", "0%"], duration: 400 }, at(11.25));
        tl.add("#br-cta2-t", { translateY: ["105%", "0%"], duration: 400 }, at(12));
        shake(tl, "#br-shake", T + 12 * P, 9, 5, 46);
        tl.add("#br-11", { scale: [{ to: 1.3, duration: 90 }, { to: 1, duration: 320, ease: "outBack(3)" }] }, at(12.5));
        tl.add("#br-btn", { opacity: [0, 1], scale: [0.6, 1], ease: SPRING(0.5, 420) }, at(13));
        IN("#br-tel", 13.5, { translateY: [16, 0] }, 0.3);
        tl.add("#br-hand", { opacity: [0, 1], translateX: [150, 0], translateY: [170, 0], duration: 320 }, at(15));
        tl.add("#br-hand", { scale: [{ to: 0.84, duration: 70 }, { to: 1, duration: 140 }], ease: "outQuad" }, at(16));
        tl.add("#br-btn", { scale: [{ to: 0.94, duration: 70 }, { to: 1, duration: 160 }], ease: "outQuad" }, at(16));
        tl.add("#br-ring", { opacity: [0.9, 0], scale: [1, 1.15], duration: 380, ease: "outQuad" }, at(16));
        tl.add("#br-hand", { opacity: 0, translateX: 90, translateY: 100, duration: 220, ease: "inQuad" }, at(17));
        tl.add("#br-cam", { scale: [1, 1.025], duration: 3.5 * P * 1000, ease: "inOutSine" }, at(14));

        // ===== C10 엔드카드 B (슬로건) T+18.5P = 원곡 비트 / 마지막 크래시 T+19.5P =====
        const s1 = 30.5 * P + 26 * P - T; // 슬로건 시작 (비트 단위 아님 → 초)
        const k10 = s1 / P;
        flash(tl, "#br-flash", T + k10 * P, 0.4);
        tl.add(["#br-cta1-t", "#br-cta2-t"], { translateY: "-105%", duration: 110, ease: "inQuad" }, at(k10));
        tl.add("#br-cam", { scale: 1, duration: 300 }, at(k10));
        tl.add("#br-desk", { opacity: [0, 1], duration: 400, ease: "outQuad" }, at(k10));
        tl.add("#br-desk", { scale: [1.1, 1], duration: (30 - (T + k10 * P)) * 1000, ease: "outSine" }, at(k10));
        OUT("#br-logo", k10, { translateY: -10 }, 0.15);
        IN("#br-logo-s", k10 + 0.25, { translateX: [-16, 0] }, 0.3);
        tl.add("#br-s1", { opacity: [0, 1], translateY: [-140, 0], ease: SPRING(0.35, 420) }, at(k10 + 0.25));
        tl.add("#br-s2", { opacity: [0, 1], translateY: [-140, 0], ease: SPRING(0.35, 420) }, at(k10 + 1));
        // 마지막 크래시 (원곡 src 31.719)
        flash(tl, "#br-flash", T + (k10 + 2) * P, 0.55);
        shake(tl, "#br-shake", T + (k10 + 2) * P, 14, 7, 47);
        IN("#br-sub", k10 + 2, { translateY: [24, 0] }, 0.35, "outQuart");
        tl.add("#br-btn", { scale: [{ to: 1.06, duration: 90 }, { to: 1, duration: 320, ease: "outBack(3)" }] }, at(k10 + 2));
        tl.add("#br-cam", { scale: [1, 1.02], duration: (30 - (T + (k10 + 2) * P)) * 1000, ease: "outSine" }, at(k10 + 2.2));
      } else {
        // 15초: 전화는 브랜드 진입부터
        IN("#br-tel", 1, { translateY: [16, 0] }, 0.3);
        // ===== C6 엔드카드 T+8P = 원곡 마지막 크래시 (슬로건 착지) =====
        flash(tl, "#br-flash", T + 8 * P, 0.6);
        shake(tl, "#br-shake", T + 8 * P, 14, 7, 47);
        OUT(["#br-h1", "#br-h2", "#br-cs", "#br-bub"], 7.85, { translateY: -60 }, 0.15);
        tl.add("#br-cam", { scale: 1, duration: 300 }, at(8));
        tl.add("#br-desk", { opacity: [0, 1], duration: 350, ease: "outQuad" }, at(8));
        tl.add("#br-desk", { scale: [1.1, 1], duration: (15 - (T + 8 * P)) * 1000, ease: "outSine" }, at(8));
        OUT("#br-logo", 8, { translateY: -10 }, 0.15);
        IN("#br-logo-s", 8.25, { translateX: [-16, 0] }, 0.3);
        tl.add("#br-s1", { opacity: [0, 1], translateY: [-140, 0], ease: SPRING(0.35, 420) }, at(8));
        tl.add("#br-btn", { opacity: [0, 1], scale: [0.6, 1], ease: SPRING(0.5, 420) }, at(8));
        tl.add("#br-s2", { opacity: [0, 1], translateY: [-140, 0], ease: SPRING(0.35, 420) }, at(9));
        tl.add("#br-cam", { scale: [1, 1.02], duration: (15 - (T + 9.3 * P)) * 1000, ease: "outSine" }, at(9.3));
      }
      tl.set({ v: 0 }, { v: 1 }, ms(CUT === 30 ? 30 : 15));
      tl.seek(0);
    })();
  </script>
