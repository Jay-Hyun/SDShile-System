<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOV-subset.woff2") format("woff2");
      font-weight: 45 930;
    }
    /* 아트 디렉션 v3.2: Paper 단색 바탕, 중심축 x=540, 컬럼 x 120–960(840), 크기 4단계(144/88/44/26).
       헤더 아래(y 348)와 입력 독(y 1378) 사이를 대화가 채운다. 쌓인 높이가 그 사이보다 짧으면 위·아래 틈을 같게(≤140)
       나누고, 길면 바닥(독 위 24px)에 붙여 위가 헤더 밑으로 스크롤된다. 독은 전체 폭 한 톤 다른 면(y 1378–1920). */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-paper, #f7f6f2);
      color: var(--color-ink, #0e1116);
      font-family: "PretendardGOV", sans-serif;
      word-break: keep-all;
    }
    .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    /* 앱 헤더: 가상 "AI 어시스턴트" (실존 서비스 요소 없음). 가운데 정렬 한 줄 */
    #ch-head { position: absolute; left: 0; top: 286px; width: 1080px; height: 62px; display: flex; align-items: center; justify-content: center; }
    #ch-head-row { display: flex; align-items: center; gap: 18px; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; padding-right: 0.01em; }
    #ch-head svg { width: 52px; height: 52px; display: block; }

    /* 대화 창: 헤더 아래부터 */
    #ch-vp { position: absolute; inset: 0; clip-path: inset(348px 0px 0px 0px); }
    /* 대화 컬럼: x 120–960. 말풍선은 모두 컬럼 전폭, 화자는 색으로 구분 (사용자 = Ink, AI = 톤 한 단계) */
    #ch-thread { position: absolute; left: 120px; top: 0; width: 840px; height: 1700px; }
    .b { position: absolute; left: 0; width: 840px; border-radius: 36px; padding: 44px 48px; font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    .u { background: var(--color-ink, #0e1116); color: var(--color-paper, #f7f6f2); }
    .a { background: var(--color-tone, #eae7df); color: var(--color-ink, #0e1116); }
    .ln { display: block; height: 62px; overflow: hidden; white-space: nowrap; }
    .ln > span { display: block; }
    .pre { color: var(--color-muted, #5f6368); }
    /* 큰 말풍선: Head 88 / 600 / −0.03em / 줄 101px. big = 30초 AI 답(안쪽 폭 760), hb = 15초 질문·책임 넘김 말풍선 */
    .big, .hb { font-size: 88px; line-height: 101px; font-weight: 600; letter-spacing: -0.03em; }
    .big { padding: 44px 40px; }
    .hb { padding: 56px 48px; }
    .big .ln, .hb .ln { height: 101px; }

    /* 골드 언더라인 (법적 책임 · 사람 · 책임): SVG 선 드로잉 */
    .ul { font-style: normal; position: relative; display: inline-block; }
    .uls { position: absolute; left: 0; bottom: 0px; height: 4px; overflow: visible; }
    .big .uls, .hb .uls { bottom: 10px; height: 6px; }
    .uls path { fill: none; stroke: var(--color-gold, #b8955a); stroke-width: 4; }
    .big .uls path, .hb .uls path { stroke-width: 6; }
    /* 🙂: 글자와 같은 잉크의 작은 인라인 SVG */
    .emo { display: inline-block; width: 40px; height: 40px; vertical-align: -7px; margin-left: 10px; }
    .hb .emo { width: 72px; height: 72px; vertical-align: -10px; margin-left: 14px; }

    /* 타이핑 점 */
    #a1-dots { position: absolute; left: 44px; top: 87px; display: flex; gap: 14px; }
    #a1-dots b { display: block; width: 14px; height: 14px; border-radius: 7px; background: var(--color-muted, #5f6368); }
    .hb #a1-dots { left: 52px; top: 99px; }

    /* 입력 독: 훅에서는 화면 전체가 입력 시트(헤더 아래 y 348–1920)이고 질문이 크게 들어간다.
       전송하면 시트가 접혀 y 1378–1920 의 독이 되고 입력창은 두 줄 높이 알약(y 1410–1584)이 된다. 접힘은 clip-path 하나로 한다 */
    #ch-dock { position: absolute; left: 0; top: 348px; width: 1080px; height: 1572px; background: var(--color-field, #eeebe4); }
    #ch-bar { position: absolute; left: 120px; top: 396px; width: 840px; height: 1188px; background: var(--color-paper, #f7f6f2); clip-path: inset(0px 0px 0px 0px round 56px); font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    /* 훅 질문: Display 144 / 700 / −0.045em / 1.05, 여섯 줄(구절 단위), 세 덩어리로 들어간다 */
    #hk { position: absolute; left: 0; top: 84px; width: 840px; text-align: center; font-size: 144px; line-height: 151px; font-weight: 700; letter-spacing: -0.045em; }
    .hl { display: block; height: 151px; white-space: nowrap; }
    .hl > span { display: inline-block; padding-right: 0.045em; }
    #bar-ph { position: absolute; left: 48px; top: 1039px; height: 62px; color: #6b6f76; white-space: nowrap; opacity: 0; }
    #bar-send { position: absolute; right: 16px; bottom: 16px; width: 80px; height: 80px; border-radius: 40px; background: #0e1116; display: flex; align-items: center; justify-content: center; }
    #bar-send svg { width: 40px; height: 40px; }

    /* [상담사 연결]: 컬럼 전폭 Navy 알약. 시그니처 — 이 버튼이 열려 상담 화면이 된다 (brand.html 오프닝 윈도우) */
    #ch-btn { position: absolute; left: 0; width: 840px; height: 120px; border-radius: 60px; background: var(--color-navy, #0b1a33); color: var(--color-paper, #f7f6f2); display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; }
    #ch-btn span { padding-right: 0.01em; }
  </style>
  <div id="root" data-composition-id="chat" data-width="1080" data-height="1920">
    <div id="ch-cam" class="cam">
      <div id="ch-head">
        <div id="ch-head-row" data-m="c">
          <svg viewBox="0 0 52 52"><rect width="52" height="52" rx="15" fill="#c9c6be" /><circle cx="19.5" cy="26" r="4.4" fill="#0e1116" /><circle cx="32.5" cy="26" r="4.4" fill="#0e1116" /></svg>
          <span>AI 어시스턴트</span>
        </div>
      </div>

      <div id="ch-vp" data-layout-allow-overflow>
        <div id="ch-thread" data-layout-allow-overflow>
          <div id="ch-u1" class="b u" data-m="col"><div class="ln"><span>전문대 나왔는데, 퇴근하고 법 공부</span></div><div class="ln"><span>할 수 있을까?</span></div></div>

          <div id="ch-a1" class="b a big" data-m="col">
            <i id="a1-dots"><b></b><b></b><b></b></i>
            <div class="ln"><span id="a1-p1" class="pre">반복 업무는</span></div>
            <div class="ln"><span id="a1-p2" class="pre">자동화되고,</span></div>
            <div class="ln"><span id="a1-l1">최종 판단과</span></div>
            <div class="ln"><span id="a1-l2"><em class="ul">법적 책임<svg class="uls"><path d="M0 3H10" /></svg></em>은</span></div>
            <div class="ln"><span id="a1-l3"><em class="ul">사람<svg class="uls"><path d="M0 3H10" /></svg></em>이 맡게 됩니다.</span></div>
          </div>

          <div id="ch-a2" class="b a" data-m="col">
            <div class="ln"><span id="a2-l1">이건 <em class="ul">책임<svg class="uls"><path d="M0 2H10" /></svg></em>지고 답할 분께 넘길게요<svg class="emo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" /><circle cx="8.7" cy="10" r="1.35" fill="currentColor" /><circle cx="15.3" cy="10" r="1.35" fill="currentColor" /><path d="M8 14.3c1 1.5 2.4 2.3 4 2.3s3-.8 4-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg></span></div>
          </div>

          <div id="ch-btn" data-m="c"><span>상담사 연결</span></div>
        </div>
      </div>

      <div id="ch-dock" data-fill data-layout-ignore></div>
      <div id="ch-bar" data-m="col">
        <div id="hk">
          <div class="hl"><span id="hk-1" data-m="c">전문대</span></div>
          <div class="hl"><span id="hk-2" data-m="c">나왔는데,</span></div>
          <div class="hl"><span id="hk-3" data-m="c">퇴근하고</span></div>
          <div class="hl"><span id="hk-4" data-m="c">법 공부</span></div>
          <div class="hl"><span id="hk-5" data-m="c">할 수</span></div>
          <div class="hl"><span id="hk-6" data-m="c">있을까?</span></div>
        </div>
        <div id="bar-ph">메시지를 입력하세요</div>
        <i id="bar-send"><svg viewBox="0 0 24 24"><path d="M12 18V6M7 11l5-5 5 5" fill="none" stroke="#f7f6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { A, ms, E, D, timeline, rise, ui, exit, push } = window.HF;
      const C = window.HFCUE(CUT); // lib/cue.js
      const $ = (s) => document.querySelector(s);
      const tl = timeline();

      const HB = 348; // 헤더 아래 (대화가 여기서 잘린다)
      const DT = 1378; // 입력 독 위
      const G = 36; // 말풍선 사이
      const ONE = 150; // 한 줄 말풍선
      const BTN_GAP = 24, BTN_H = 120, BTN_BOTTOM = DT - 16;
      const BTN_CY = BTN_BOTTOM - BTN_H / 2; // 1302 — brand.html 의 오프닝 윈도우 중심
      const SHEET = 800; // 입력 시트가 접히는 시간 (in-out)
      const EMO = '<svg class="emo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" /><circle cx="8.7" cy="10" r="1.35" fill="currentColor" /><circle cx="15.3" cy="10" r="1.35" fill="currentColor" /><path d="M8 14.3c1 1.5 2.4 2.3 4 2.3s3-.8 4-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>';
      const UL = '<svg class="uls"><path d="M0 3H10" /></svg>';

      // ---------- 15초판: AI 답 없이 질문 → 책임 넘김 (03-revision-v6.md §4). 두 말풍선 모두 Head 88 ----------
      if (CUT === 15) {
        $("#ch-a1").remove();
        const u1 = $("#ch-u1");
        u1.className = "b u hb";
        u1.innerHTML = '<div class="ln"><span>전문대 나왔는데,</span></div><div class="ln"><span>퇴근하고 법 공부</span></div><div class="ln"><span>할 수 있을까?</span></div>';
        const a2 = $("#ch-a2");
        a2.className = "b a hb";
        a2.innerHTML = '<i id="a1-dots"><b></b><b></b><b></b></i><div class="ln"><span id="a2-l1">이건 <em class="ul">책임' + UL + '</em>지고 답할</span></div><div class="ln"><span id="a2-l2">분께 넘길게요' + EMO + '</span></div>';
      }

      // ---------- 레이아웃: 빌드 때 한 번 잰다 (thread 좌표, 쌓인 순서대로) ----------
      const H = (q) => $(q).offsetHeight;
      const top = (q, v) => ($(q).style.top = Math.round(v) + "px");
      const yU1 = 0;
      const yA1 = CUT === 30 ? H("#ch-u1") + G : 0;
      const yA2 = CUT === 30 ? yA1 + H("#ch-a1") + G : H("#ch-u1") + G;
      const hA2 = H("#ch-a2");
      const yBtn = yA2 + hA2 + BTN_GAP;
      top("#ch-u1", yU1);
      if (CUT === 30) top("#ch-a1", yA1);
      top("#ch-a2", yA2);
      top("#ch-btn", yBtn);
      // 쌓인 [top, bottom] 을 헤더·독 사이에 앉힌다: 짧으면 위·아래 틈을 같게(각 ≤140), 길면 바닥에 붙인다
      const fit = (t, b) => ((b - t) <= (DT - HB) - 48 ? Math.round((HB + DT) / 2 - (t + b) / 2) : Math.round(DT - 24 - b));
      const flush = (b, pad) => Math.round(DT - pad - b);

      let offNow = 0;
      function glide(t, to) {
        tl.add("#ch-thread", { translateY: [offNow, to], duration: D.glide, ease: E.glide }, ms(t));
        offNow = to;
      }

      // 언더라인: 단어 폭에 맞춘 SVG 선
      const uls = Array.from(document.querySelectorAll(".uls")).map((svg) => {
        const big = !!svg.closest(".big, .hb");
        const h = big ? 6 : 4;
        const w = svg.parentNode.offsetWidth;
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.style.width = w + "px";
        svg.firstElementChild.setAttribute("d", "M0 " + h / 2 + "H" + w);
        return A.svg.createDrawable(svg.firstElementChild);
      });
      const ulA2 = uls[uls.length - 1];
      const ulA1 = CUT === 30 ? uls.slice(0, 2) : [];

      // ---------- 시작 상태 (t=0): 입력 시트에 첫 덩어리가 이미 들어 있다 ----------
      const lines = Array.from(document.querySelectorAll("#ch-a1 .ln > span, #a2-l1, #a2-l2"));
      tl.set(lines, { translateY: "105%" }, 0);
      tl.set(["#ch-u1", "#ch-a1", "#ch-a2", "#ch-btn"], { opacity: 0 }, 0);
      tl.set("#a1-dots b", { opacity: 0.3 }, 0);
      uls.forEach((d) => tl.set(d, { draw: "0 0" }, 0));
      tl.set(["#hk-3", "#hk-4", "#hk-5", "#hk-6"], { opacity: 0 }, 0);
      offNow = CUT === 30 ? fit(yU1, yA1 + H("#ch-a1")) : fit(yU1, yA2 + hA2);
      tl.set("#ch-thread", { translateY: offNow }, 0);
      // 카메라: 한 컷(챗 전체)에 한 번, 1.00 → 1.03 선형 푸시. 원점 = 시그니처 버튼 중심
      $("#ch-cam").style.transformOrigin = "540px " + BTN_CY + "px";
      push(tl, "#ch-cam", 0, C.WIN);

      // ===== C1 훅: 질문이 입력 시트에 세 덩어리로 들어간다 (전문대 나왔는데, / 퇴근하고 법 공부 / 할 수 있을까?) =====
      const chunk = (ids, t) => tl.add(ids, { opacity: [0, 1], duration: 240, ease: E.ui }, ms(t));
      chunk(["#hk-3", "#hk-4"], 0.4);
      chunk(["#hk-5", "#hk-6"], 0.8);

      // ===== C2 전송: 보내기 누름 → 다운비트에 시트가 접히고 질문이 사용자 말풍선으로 =====
      tl.add("#bar-send", { scale: [1, 0.94], duration: D.press / 2, ease: E.ui }, ms(C.SEND));
      tl.add("#bar-send", { scale: [0.94, 1], duration: D.press / 2, ease: E.ui }, ms(C.SEND + D.press / 2000));
      tl.add("#ch-dock", { clipPath: ["inset(0px 0px 0px 0px)", "inset(" + (DT - HB) + "px 0px 0px 0px)"], duration: SHEET, ease: E.glide }, ms(C.C2));
      tl.add("#ch-bar", { clipPath: ["inset(0px 0px 0px 0px round 56px)", "inset(" + (1410 - 396) + "px 0px 0px 0px round 56px)"], duration: SHEET, ease: E.glide }, ms(C.C2));
      tl.add("#hk", { opacity: [1, 0], duration: D.exit, ease: E.exit }, ms(C.C2));
      tl.add("#bar-send", { backgroundColor: ["#0e1116", "#c9c6be"], duration: 200, ease: "inOutSine" }, ms(C.C2 + 0.5));
      tl.add("#bar-ph", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(C.C2 + 0.8));
      ui(tl, "#ch-u1", C.C2 + 0.35);

      const dots = document.querySelectorAll("#a1-dots b");
      function breathe(t0, t1) {
        for (let t = t0; t < t1 - 0.6; t += 0.9) {
          dots.forEach((d, i) => {
            tl.add(d, { opacity: [0.3, 1], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15));
            tl.add(d, { opacity: [1, 0.3], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15 + 0.3));
          });
        }
      }

      if (CUT === 30) {
        // ===== AI 답: 큰 말풍선(Head 88)이 점을 띄우고 → 흐린 앞 문단(3박) → 핵심 문장(4박) → 골드 언더라인 =====
        ui(tl, "#ch-a1", C.C2 + 0.55);
        breathe(C.C2 + 0.9, C.C2b);
        tl.add("#a1-dots", { opacity: [1, 0], duration: 200, ease: E.exit }, ms(C.C2b));
        rise(tl, ["#a1-p1", "#a1-p2"], C.C2b + 0.05);
        rise(tl, ["#a1-l1", "#a1-l2", "#a1-l3"], C.C3 + 0.05);
        ulA1.forEach((d, i) => tl.add(d, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(C.C3 + 1.0 + i * 0.09)));

        // ===== R 이음 다운비트: 질문이 물러나고 '책임'을 이유로 넘긴다 → [상담사 연결] =====
        exit(tl, "#ch-u1", C.R);
        glide(C.R, fit(yA1, yA2 + hA2));
        ui(tl, "#ch-a2", C.R);
        rise(tl, "#a2-l1", C.R + 0.05);
        tl.add(ulA2, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(C.R + 0.95));
        const tBtn = C.R + 1.55;
        ui(tl, "#ch-btn", tBtn);
        glide(tBtn, flush(yBtn + BTN_H, 16));
      } else {
        // ===== 15초: 질문 아래 AI 말풍선이 점을 띄우고 → 3박 다운비트에 '책임' 넘김 → [상담사 연결] =====
        ui(tl, "#ch-a2", C.C2 + 0.55);
        breathe(C.C2 + 0.9, C.HAND);
        tl.add("#a1-dots", { opacity: [1, 0], duration: 200, ease: E.exit }, ms(C.HAND));
        rise(tl, ["#a2-l1", "#a2-l2"], C.HAND + 0.05);
        tl.add(ulA2, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(C.HAND + 0.7));
        const tBtn = C.R + 0.1;
        ui(tl, "#ch-btn", tBtn);
        glide(tBtn, flush(yBtn + BTN_H, 16));
      }
      // 누름 140ms (스프링 없음) → 버튼이 열린다 (brand.html, WIN)
      tl.add("#ch-btn", { scale: [1, 0.985], duration: D.press / 2, ease: E.ui }, ms(C.PRESS));
      tl.add("#ch-btn", { scale: [0.985, 1], duration: D.press / 2, ease: E.ui }, ms(C.PRESS + D.press / 2000));

      tl.set({ v: 0 }, { v: 1 }, ms(C.WIN + 1.3));
      tl.seek(0);
    })();
  </script>
</template>
