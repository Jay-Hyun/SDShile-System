<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOV-subset.woff2") format("woff2");
      font-weight: 45 930;
    }
    /* 아트 디렉션 v3.1: Paper 단색 바탕, 중심축 x=540, 컬럼 x 120–960(840), 크기 4단계(144/88/44/26).
       대화는 실제 챗처럼 안전 영역 바닥(y 1440)에 붙고, 새 줄이 생기면 위로 밀린다. 헤더 아래(y 290)에서 잘린다 */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-paper, #f7f6f2);
      color: var(--color-ink, #0e1116);
      font-family: "PretendardGOV", sans-serif;
      word-break: keep-all;
    }
    .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    /* 앱 헤더: 가상 "AI 어시스턴트" (실존 서비스 요소 없음). 가운데 정렬 한 줄 */
    #ch-head { position: absolute; left: 0; top: 199px; width: 1080px; height: 62px; display: flex; align-items: center; justify-content: center; }
    #ch-head-row { display: flex; align-items: center; gap: 18px; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; padding-right: 0.01em; }
    #ch-head svg { width: 52px; height: 52px; display: block; }

    /* 대화 창: 헤더 아래부터 */
    #ch-vp { position: absolute; inset: 0; clip-path: inset(290px 0px 0px 0px); }
    /* 대화 컬럼: x 120–960. 말풍선은 모두 컬럼 전폭, 화자는 색으로 구분 (사용자 = Ink, AI = 톤 한 단계) */
    #ch-thread { position: absolute; left: 120px; top: 0; width: 840px; height: 1500px; }
    .b { position: absolute; left: 0; width: 840px; border-radius: 34px; padding: 36px 48px; font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    .u { background: var(--color-ink, #0e1116); color: var(--color-paper, #f7f6f2); }
    .a { background: var(--color-tone, #eae7df); color: var(--color-ink, #0e1116); }
    .ln { display: block; height: 62px; overflow: hidden; white-space: nowrap; }
    .ln > span { display: block; }
    .ln.ex { margin-top: 16px; }
    .pre { color: var(--color-muted, #5f6368); }

    /* 훅 제목: Display 144 / 700 / −0.045em / 1.05, 두 줄 직접 지정 */
    #ch-title { position: absolute; left: 0; top: 0; width: 840px; text-align: center; font-size: 144px; line-height: 1.05; font-weight: 700; letter-spacing: -0.045em; }
    .lnD { display: block; overflow: hidden; }
    /* 음수 자간의 마지막 글자 뒤 여백을 되돌려 박스 중심 = 글자 중심 */
    .lnD > span { display: inline-block; padding-right: 0.045em; }

    /* 골드 언더라인 (법적 책임 · 사람 · 책임): SVG 선 드로잉 */
    .ul { font-style: normal; position: relative; display: inline-block; }
    .uls { position: absolute; left: 0; bottom: 0px; height: 4px; overflow: visible; }
    .uls path { fill: none; stroke: var(--color-gold, #b8955a); stroke-width: 4; }
    /* 🙂: 글자와 같은 잉크의 작은 인라인 SVG */
    .emo { display: inline-block; width: 40px; height: 40px; vertical-align: -7px; margin-left: 10px; }

    /* 타이핑 점 */
    #a1-dots { position: absolute; left: 48px; top: 60px; display: flex; gap: 14px; }
    #a1-dots b { display: block; width: 14px; height: 14px; border-radius: 7px; background: var(--color-muted, #5f6368); }

    /* 입력창: 대화 컬럼 바로 아래 상시 UI (840 폭, 톤 한 단계 면, 선·그림자 없음). 한 줄 = y 1456–1544.
       글이 둘째 줄로 넘어가면 위로 한 줄 자라고(clip-path), 대화도 같은 만큼 올라간다 */
    #ch-bar { position: absolute; left: 120px; top: 1394px; width: 840px; height: 150px; background: var(--color-field, #eeebe4); font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }
    #bar-ph { position: absolute; left: 48px; top: 75px; height: 62px; color: #6b6f76; white-space: nowrap; }
    #bar-text { position: absolute; left: 48px; top: 13px; width: 704px; }
    .ln2 { display: block; height: 62px; white-space: nowrap; }
    #bar-c2, #bar-c3 { display: none; }
    #bar-send { position: absolute; right: 12px; top: 74px; width: 64px; height: 64px; border-radius: 32px; background: #c9c6be; display: flex; align-items: center; justify-content: center; }
    #bar-send svg { width: 32px; height: 32px; }

    /* 로딩 개그: 답이 올 자리 가운데에 Head 88 상태 문구 */
    #ch-gag { position: absolute; left: 0; width: 840px; }
    .gagl { position: absolute; left: 0; width: 840px; height: 101px; overflow: hidden; text-align: center; font-size: 88px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em; color: var(--color-muted, #5f6368); white-space: nowrap; }
    .gagl > span { position: absolute; left: 0; top: 0; width: 840px; text-align: center; }
    .gagl > span > i { font-style: normal; display: inline-block; padding-right: 0.03em; }

    /* [상담사 연결]: 컬럼 전폭 Navy 알약. 시그니처 — 이 버튼이 열려 상담 화면이 된다 (brand.html 오프닝 윈도우) */
    #ch-btn { position: absolute; left: 0; width: 840px; height: 120px; border-radius: 60px; background: var(--color-navy, #0b1a33); color: var(--color-paper, #f7f6f2); display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; }
    #ch-btn span { padding-right: 0.01em; }
  </style>
  <div id="root" data-composition-id="chat" data-width="1080" data-height="1920">
    <div id="ch-cam" class="cam">
      <div id="ch-head">
        <div id="ch-head-row" data-m="c">
          <svg viewBox="0 0 52 52"><rect width="52" height="52" rx="15" fill="#c9c6be" /><circle cx="19.5" cy="26" r="4.4" fill="#0e1116" /><circle cx="32.5" cy="26" r="4.4" fill="#0e1116" /></svg>
          <span>AI 어시스턴트</span>
        </div>
      </div>

      <div id="ch-vp" data-layout-allow-overflow>
        <div id="ch-thread" data-layout-allow-overflow>
          <div id="ch-title">
            <div class="lnD"><span id="tt-1" data-m="c">AI가</span></div>
            <div class="lnD"><span id="tt-2" data-m="c">답 못 한 질문</span></div>
          </div>

          <div id="ch-u1" class="b u" data-m="col"><div class="ln"><span>AI 시대에도 안 없어질 직업 알려줘.</span></div></div>

          <div id="ch-a1" class="b a" data-m="col">
            <i id="a1-dots"><b></b><b></b><b></b></i>
            <div class="ln"><span id="a1-p1" class="pre">반복 업무는 점점 자동화되고,</span></div>
            <div class="ln"><span id="a1-p2" class="pre">문서 정리와 자료 검색도 빨라지겠지만</span></div>
            <div class="ln"><span id="a1-l1">…최종 판단과 <em class="ul">법적 책임<svg class="uls"><path d="M0 2H10" /></svg></em>이</span></div>
            <div class="ln"><span id="a1-l2">따르는 일은 <em class="ul">사람<svg class="uls"><path d="M0 2H10" /></svg></em>이 맡게 됩니다.</span></div>
            <div class="ln ex"><span id="a1-l3">예: 법조인, 법무 책임자</span></div>
          </div>

          <div id="ch-u2" class="b u" data-m="col">
            <div class="ln"><span>나 전문대 나왔고 회사 다니는데,</span></div>
            <div class="ln"><span>법 공부 할 수 있어?</span></div>
          </div>

          <div id="ch-gag">
            <div class="gagl">
              <span id="st1"><i id="st1-t" data-m="c">고민 중…</i></span>
              <span id="st2"><i id="st2-t" data-m="c">아직 고민 중…</i></span>
              <span id="st3"><i id="st3-t" data-m="c">음…</i></span>
            </div>
          </div>

          <div id="ch-a2" class="b a" data-m="col">
            <div class="ln"><span id="a2-l1">이건 <em class="ul">책임<svg class="uls"><path d="M0 2H10" /></svg></em>지고 답할 분께 넘길게요<svg class="emo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" /><circle cx="8.7" cy="10" r="1.35" fill="currentColor" /><circle cx="15.3" cy="10" r="1.35" fill="currentColor" /><path d="M8 14.3c1 1.5 2.4 2.3 4 2.3s3-.8 4-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg></span></div>
          </div>

          <div id="ch-btn" data-m="c"><span>상담사 연결</span></div>
        </div>
      </div>

      <div id="ch-bar" data-m="col">
        <div id="bar-ph">메시지를 입력하세요</div>
        <div id="bar-text">
          <div class="ln2"><span id="bar-c1">나 전문대 나왔</span><span id="bar-d">는데</span><span id="bar-c2">고 회사 다니는데,</span></div>
          <div class="ln2"><span id="bar-c3">법 공부 할 수 있어?</span></div>
        </div>
        <i id="bar-send"><svg viewBox="0 0 24 24"><path d="M12 18V6M7 11l5-5 5 5" fill="none" stroke="#f7f6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { A, P, BAR, ms, E, D, timeline, rise, riseOut, ui, exit, push } = window.HF;
      const $ = (s) => document.querySelector(s);
      const tl = timeline();
      const DB = (k) => k * BAR; // 다운비트 k (A 구간: 첫 프레임 = 원곡 다운비트)
      const R = CUT === 30 ? 30.5 * P : 8.5 - 4 * P; // 음악 복귀 다운비트 (🙂 답)
      const WIN = CUT === 30 ? 536 / 30 : 237 / 30; // 버튼이 열리기 시작 (중간점 = 원곡 B섹션 크래시)
      const FLOOR = 1440; // 대화 바닥 = 안전 영역 아래 끝
      const BTN_CY = FLOOR - 60; // 시그니처 버튼 화면 중심 y — brand.html 의 BTN_CY 와 같은 값

      // ---------- 15초판 문구 (05-ask-ai.md §3) ----------
      if (CUT === 15) {
        $("#a1-p1").textContent = "반복 업무는 점점 자동화되겠지만,";
        $("#a1-p2").parentNode.remove();
        $("#a1-l1").innerHTML = '<em class="ul">법적 책임<svg class="uls"><path d="M0 2H10" /></svg></em>은 <em class="ul">사람<svg class="uls"><path d="M0 2H10" /></svg></em> 몫입니다.';
        $("#a1-l2").parentNode.remove();
        $("#a1-l3").textContent = "예: 법조인";
        const u2 = $("#ch-u2");
        u2.innerHTML = '<div class="ln"><span id="u2-l1">전문대 졸 직장인도 법 공부 돼?</span></div>';
        $("#st2").remove();
        $("#st3").remove();
        $("#a2-l1").innerHTML = $("#a2-l1").innerHTML.replace(/이건 (<em[\s\S]*?<\/em>)지고 답할 분께 넘길게요/, "$1질 분께 넘길게요");
      }

      // ---------- 레이아웃: 빌드 때 한 번 잰다 (thread 좌표) ----------
      const H = (q) => $(q).offsetHeight;
      const G = 24; // 말풍선 사이
      const LINE = 62, ONE = 36 + LINE + 36; // 한 줄 말풍선 = 134
      const BTN_H = 120, BTN_GAP = 32;
      const yU1 = H("#ch-title") + 88;
      const yA1 = yU1 + H("#ch-u1") + G;
      const hA1 = H("#ch-a1");
      const yU2 = yA1 + hA1 + G;
      const hU2 = H("#ch-u2");
      const yGap = yU2 + hU2 + G; // 답이 올 자리: 개그 문구 → 🙂 답 + 버튼
      const hGap = ONE + BTN_GAP + BTN_H;
      const top = (q, v) => ($(q).style.top = Math.round(v) + "px");
      top("#ch-title", 0);
      top("#ch-u1", yU1);
      top("#ch-a1", yA1);
      top("#ch-u2", yU2);
      top("#ch-gag", yGap);
      $("#ch-gag").style.height = hGap + "px";
      document.querySelector(".gagl").style.top = Math.round((hGap - 101) / 2) + "px";
      top("#ch-a2", yGap);
      top("#ch-btn", yGap + ONE + BTN_GAP);
      // 바닥 고정: 보이는 마지막 요소의 아래 끝이 y 1440 에 온다
      const off = (bottom) => FLOOR - bottom;

      // 말풍선 높이 = clip-path(inset 아래쪽)로 줄 단위로 늘린다. 컬럼도 같은 곡선으로 같은 만큼 올라가 바닥이 고정된다
      const clip = (h, full) => "inset(0px 0px " + (full - h) + "px 0px round 34px)";
      let offNow = 0;
      function glide(t, to) {
        tl.add("#ch-thread", { translateY: [offNow, to], duration: D.glide, ease: E.glide }, ms(t));
        offNow = to;
      }
      let a1Now = ONE;
      function growA1(t, h) {
        tl.add("#ch-a1", { clipPath: [clip(a1Now, hA1), clip(h, hA1)], duration: D.glide, ease: E.glide }, ms(t));
        a1Now = h;
        glide(t, off(yA1 + h));
      }

      // 언더라인: 단어 폭에 맞춘 SVG 선
      const uls = Array.from(document.querySelectorAll(".uls")).map((svg) => {
        const w = svg.parentNode.offsetWidth;
        svg.setAttribute("viewBox", "0 0 " + w + " 4");
        svg.style.width = w + "px";
        svg.firstElementChild.setAttribute("d", "M0 2H" + w);
        return A.svg.createDrawable(svg.firstElementChild);
      });
      const ulA1 = uls.slice(0, 2), ulA2 = uls[2];

      // ---------- 시작 상태 (t=0): 제목과 첫 질문은 F0에 이미 보인다 ----------
      const lines = Array.from(document.querySelectorAll("#ch-a1 .ln > span, #a2-l1, .gagl > span"));
      tl.set(lines, { translateY: "105%" }, 0);
      tl.set(["#ch-a1", "#ch-u2", "#ch-a2", "#ch-btn"], { opacity: 0 }, 0);
      tl.set("#a1-dots b", { opacity: 0.3 }, 0);
      tl.set("#ch-a1", { clipPath: clip(ONE, hA1) }, 0);
      uls.forEach((d) => tl.set(d, { draw: "0 0" }, 0));
      // 입력창: 한 줄(아래 88px)만 보이게. 두 줄이면 위로 한 줄(62) 더
      const barClip = (n) => "inset(" + (n === 1 ? LINE : 0) + "px 0px 0px 0px round 44px)";
      tl.set("#ch-bar", { clipPath: barClip(1) }, 0);
      tl.set("#bar-text", { translateY: LINE }, 0);
      tl.set(["#bar-c1", "#bar-d", "#bar-c2", "#bar-c3"], { opacity: 0 }, 0);
      offNow = off(yU1 + ONE);
      tl.set("#ch-thread", { translateY: offNow }, 0);
      // 카메라: 한 컷(챗 전체)에 한 번, 1.00 → 1.03 선형 푸시. 원점 = 시그니처 버튼 중심
      $("#ch-cam").style.transformOrigin = "540px " + BTN_CY + "px";
      push(tl, "#ch-cam", 0, WIN);

      // ===== C1 훅: 1마디 뒤 다운비트에 타이핑 점, 대화가 한 칸 밀려 올라간다 =====
      const tDots = DB(1);
      ui(tl, "#ch-a1", tDots);
      glide(tDots, off(yA1 + ONE));
      const dots = document.querySelectorAll("#a1-dots b");
      const tC2 = CUT === 30 ? DB(2) : 3.0;
      for (let t = tDots + 0.35; t < tC2 - 0.6; t += 0.9) {
        dots.forEach((d, i) => {
          tl.add(d, { opacity: [0.3, 1], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15));
          tl.add(d, { opacity: [1, 0.3], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15 + 0.3));
        });
      }

      // ===== C2 답변: 큰 AI 말풍선이 줄 단위로 열린다 (앞 문단 → 핵심 문장) =====
      tl.add("#a1-dots", { opacity: [1, 0], duration: 200, ease: E.exit }, ms(tC2));
      if (CUT === 30) {
        growA1(tC2, ONE + LINE);
        rise(tl, ["#a1-p1", "#a1-p2"], tC2 + 0.05);
        const tK1 = tC2 + 0.55;
        growA1(tK1, ONE + 2 * LINE);
        rise(tl, "#a1-l1", tK1 + 0.05);
        const tK2 = tC2 + 1.35;
        growA1(tK2, ONE + 3 * LINE);
        rise(tl, "#a1-l2", tK2 + 0.05);
        // ===== C3 다운비트: 골드 언더라인 → 예시 줄 =====
        const tC3 = DB(4);
        ulA1.forEach((d, i) => tl.add(d, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(tC3 + i * 0.09)));
        const tEx = tC3 + 0.95;
        growA1(tEx, hA1);
        rise(tl, "#a1-l3", tEx + 0.05);

        // ===== C4 다운비트: 아래 입력창에 질문이 3–4 덩어리로 들어간다 =====
        const tC4 = DB(5);
        tl.add("#bar-ph", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(tC4 + 0.1));
        const k1 = tC4 + 0.25; // "나 전문대 나왔는데"
        tl.add(["#bar-c1", "#bar-d"], { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k1));
        tl.add("#bar-send", { backgroundColor: ["#c9c6be", "#0e1116"], duration: 200, ease: "inOutSine" }, ms(k1));
        const k2 = k1 + 0.6; // 망설임: "는데"를 지운다
        tl.add("#bar-d", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(k2));
        tl.set("#bar-d", { display: "none" }, ms(k2 + 0.17));
        tl.set("#bar-c2", { display: "inline" }, ms(k2 + 0.17));
        const k3 = k2 + 0.25; // "고 회사 다니는데,"
        tl.add("#bar-c2", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k3));
        const k4 = k3 + 0.5; // 둘째 줄: 입력창이 위로 한 줄 자라고 대화도 그만큼 올라간다
        tl.add("#ch-bar", { clipPath: [barClip(1), barClip(2)], duration: D.glide, ease: E.glide }, ms(k4));
        tl.add("#bar-text", { translateY: [LINE, 0], duration: D.glide, ease: E.glide }, ms(k4));
        glide(k4, offNow - LINE);
        tl.set("#bar-c3", { display: "inline" }, ms(k4));
        tl.add("#bar-c3", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k4 + 0.1));
        const kSend = k4 + 0.7; // 전송: 입력창은 비고 한 줄로 돌아가며, 질문은 대화에 사용자 말풍선으로
        tl.add("#bar-send", { scale: [1, 0.94], duration: D.press / 2, ease: E.ui }, ms(kSend));
        tl.add("#bar-send", { scale: [0.94, 1], duration: D.press / 2, ease: E.ui }, ms(kSend + D.press / 2000));
        const kOut = kSend + 0.08;
        tl.add("#bar-text", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(kOut));
        tl.add("#ch-bar", { clipPath: [barClip(2), barClip(1)], duration: D.glide, ease: E.glide }, ms(kOut));
        tl.add("#bar-send", { backgroundColor: ["#0e1116", "#c9c6be"], duration: 200, ease: "inOutSine" }, ms(kOut));
        tl.add("#bar-ph", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(kOut + 0.3));
        ui(tl, "#ch-u2", kOut);
        glide(kOut, off(yU2 + hU2));
        exit(tl, "#ch-title", kOut); // 헤더 바로 밑에 붙기 전에 퇴장
      } else {
        // ===== 15초 C2: 앞 문단 + 핵심 문장 → 다운비트에 언더라인 → 예시 줄 =====
        growA1(tC2, ONE + LINE);
        rise(tl, ["#a1-p1", "#a1-l1"], tC2 + 0.05);
        const tU = DB(2);
        ulA1.forEach((d, i) => tl.add(d, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(tU + i * 0.09)));
        const tEx = 4.3;
        growA1(tEx, hA1);
        rise(tl, "#a1-l3", tEx + 0.05);
        // ===== 15초 C3: 다시 묻는다 (말풍선으로 바로) =====
        const tC3 = 4.9;
        ui(tl, "#ch-u2", tC3);
        glide(tC3, off(yU2 + hU2));
      }

      // ===== C5 로딩 개그: 음악이 테이프 스톱으로 멈추고, 답이 올 자리 가운데에 Head 상태 문구 =====
      const tGag = CUT === 30 ? 26 * P : DB(3);
      glide(tGag, off(yGap + hGap));
      if (CUT === 15) exit(tl, "#ch-title", tGag);
      rise(tl, "#st1", tGag + 0.05);
      // 문구 교체는 제자리 크로스페이드 200ms (교체 사이 공백 없이 읽는 시간을 지킨다)
      function swap(a, b, t) {
        tl.add(a, { opacity: [1, 0], duration: 160, ease: "inOutSine" }, ms(t));
        tl.set(b, { translateY: "0%" }, ms(t));
        tl.add(b, { opacity: [0, 1], duration: 200, ease: "inOutSine" }, ms(t));
      }
      if (CUT === 30) {
        // 무음 속: 고민 중… → 아직 고민 중… → 음…(셋째 초침 틱 B29)
        tl.set(["#st2", "#st3"], { opacity: 0 }, 0);
        swap("#st1", "#st2", 27.5 * P);
        swap("#st2", "#st3", 29 * P);
        riseOut(tl, "#st3", R - 0.2);
      } else {
        riseOut(tl, "#st1", R - 0.2);
      }

      // ===== C6 음악 복귀 다운비트: '책임'을 이유로 넘긴다 → [상담사 연결] =====
      ui(tl, "#ch-a2", R);
      rise(tl, "#a2-l1", R + 0.05);
      const tUl = R + (CUT === 30 ? 0.95 : 0.4);
      tl.add(ulA2, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(tUl));
      const tBtn = CUT === 30 ? R + 1.55 : R + 0.6;
      ui(tl, "#ch-btn", tBtn);
      // 누름 140ms (스프링 없음) → 버튼이 열린다 (brand.html, WIN)
      const tPress = WIN - 0.42;
      tl.add("#ch-btn", { scale: [1, 0.985], duration: D.press / 2, ease: E.ui }, ms(tPress));
      tl.add("#ch-btn", { scale: [0.985, 1], duration: D.press / 2, ease: E.ui }, ms(tPress + D.press / 2000));

      tl.set({ v: 0 }, { v: 1 }, ms(CUT === 30 ? 19.1 : 9.15));
      tl.seek(0);
    })();
  </script>
</template>
