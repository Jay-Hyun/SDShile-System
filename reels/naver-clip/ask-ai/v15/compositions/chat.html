    /* 입력 독: 전체 폭 한 톤 다른 면. 안에 입력창 알약(Paper)과 ※ 안내(legal 레이어)가 든다 */
    #ch-dock { position: absolute; left: 0; top: 1378px; width: 1080px; height: 542px; background: var(--color-field, #eeebe4); }
    /* 입력창: 알약. 한 줄 = y 1472–1584. 둘째 줄이 오면 위로 한 줄 자란다(clip-path) */
    #ch-bar { position: absolute; left: 120px; top: 1410px; width: 840px; height: 174px; background: var(--color-paper, #f7f6f2); border-radius: 56px; font-size: 44px; line-height: 62px; font-weight: 500; letter-spacing: -0.01em; }

    /* 로딩 개그: 답이 올 자리 가운데에 Head 88 상태 문구 */
    #ch-gag { position: absolute; left: 0; width: 840px; height: 101px; overflow: hidden; text-align: center; font-size: 88px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em; color: var(--color-muted, #5f6368); white-space: nowrap; }
    #ch-gag > span { position: absolute; left: 0; top: 0; width: 840px; text-align: center; }
    #ch-gag > span > i { font-style: normal; display: inline-block; padding-right: 0.03em; }

    /* [상담사 연결]: 컬럼 전폭 Navy 알약. 시그니처 — 이 버튼이 열려 상담 화면이 된다 (brand.html 오프닝 윈도우) */
    #ch-btn { position: absolute; left: 0; width: 840px; height: 120px; border-radius: 60px; background: var(--color-navy, #0b1a33); color: var(--color-paper, #f7f6f2); display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 62px; font-weight: 600; letter-spacing: -0.01em; }

  </style>
  <div id="root" data-composition-id="chat" data-width="1080" data-height="1920">
    <div id="ch-cam" class="cam">
      <div id="ch-head">
        <div id="ch-head-row" data-m="c">
          <svg viewBox="0 0 52 52"><rect width="52" height="52" rx="15" fill="#c9c6be" /><circle cx="19.5" cy="26" r="4.4" fill="#0e1116" /><circle cx="32.5" cy="26" r="4.4" fill="#0e1116" /></svg>
          <span>AI 어시스턴트</span>
        </div>
      </div>

      <div id="ch-vp" data-layout-allow-overflow>
        <div id="ch-thread" data-layout-allow-overflow>
          <div id="ch-title"><div id="ch-title-in">
            <div class="lnD"><span id="tt-1" data-m="c">AI가</span></div>
            <div class="lnD"><span id="tt-2" data-m="c">답 못 한 질문</span></div>
          </div></div>

          <div id="ch-u1" class="b u" data-m="col"><div class="ln"><span>AI 시대에도 안 없어질 직업 알려줘.</span></div></div>

          <div id="ch-a1" class="b a" data-m="col">
            <i id="a1-dots"><b></b><b></b><b></b></i>

            <div class="ln"><span id="a1-l1">…최종 판단과 <em class="ul">법적 책임<svg class="uls"><path d="M0 2H10" /></svg></em>이</span></div>
            <div class="ln"><span id="a1-l2">따르는 일은 <em class="ul">사람<svg class="uls"><path d="M0 2H10" /></svg></em>이 맡게 됩니다.</span></div>
            <div class="ln ex"><span id="a1-l3">예: 법조인, 법무 책임자</span></div>

            <span id="st2"><i id="st2-t" data-m="c">아직 고민 중…</i></span>

          <div class="ln2"><span id="bar-c3">법 공부 할 수 있어?</span></div>
        </div>
        <i id="bar-send"><svg viewBox="0 0 24 24"><path d="M12 18V6M7 11l5-5 5 5" fill="none" stroke="#f7f6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg></i>

  <script>
    (function () {
      const CUT = 15; // tools/build_15s.py 가 v15에서 15로 바꾼다
      const { A, BAR, ms, E, D, timeline, rise, riseOut, ui, exit, push } = window.HF;
      const C = window.HFCUE(CUT); // lib/cue.js: R(🙂 답=음악 이음새), WIN(버튼이 열리기 시작), SEND, PRESS …
      const $ = (s) => document.querySelector(s);
      const tl = timeline();

      const HB = 348; // 헤더 아래 (대화가 여기서 잘린다)
      const DT = 1378; // 입력 독 위
      const LINE = 62, ONE = 44 * 2 + LINE; // 한 줄 말풍선 = 150
      const G = 36; // 말풍선 사이
      const GT0 = 136, GT1 = 60; // 제목 → 첫 질문: 훅에서는 넓게(위아래 균형), 답이 자라기 시작하면 60 으로 좁힌다
      const TD = GT0 - GT1; // 그때 제목이 아래로 내려오는 양
      const GGAG = 104; // 고민 중 문구 위·아래 (문구는 마지막 말풍선과 독 사이 가운데)
      const GAG_H = 101;
      const BTN_GAP = 24, BTN_H = 120, BTN_BOTTOM = DT - 16;
      const BTN_CY = BTN_BOTTOM - BTN_H / 2; // 1302 — brand.html 의 오프닝 윈도우 중심

      // ---------- 15초판 문구 (05-ask-ai.md §3) ----------
      if (CUT === 15) {
        $("#a1-p1").textContent = "반복 업무는 점점 자동화되겠지만,";
        $("#a1-p2").parentNode.remove();
        $("#a1-l1").innerHTML = '<em class="ul">법적 책임<svg class="uls"><path d="M0 2H10" /></svg></em>은 <em class="ul">사람<svg class="uls"><path d="M0 2H10" /></svg></em> 몫입니다.';
        $("#a1-l2").parentNode.remove();
        $("#a1-l3").textContent = "예: 법조인";
        $("#ch-u2").innerHTML = '<div class="ln"><span id="u2-l1">전문대 졸 직장인도 법 공부 돼?</span></div>';
        $("#st2").remove();
        $("#st3").remove();
        $("#bar-text").remove();
        $("#a2-l1").innerHTML = $("#a2-l1").innerHTML.replace(/이건 (<em[\s\S]*?<\/em>)지고 답할 분께 넘길게요/, "$1질 분께 넘길게요");
      }

      // ---------- 레이아웃: 빌드 때 한 번 잰다 (thread 좌표) ----------
      const H = (q) => $(q).offsetHeight;
      const yU1 = H("#ch-title") + GT0;
      const hA1 = H("#ch-a1");
      const yA1 = yU1 + H("#ch-u1") + G;
      const yU2 = yA1 + hA1 + G;
      const hU2 = H("#ch-u2");
      const yGag = yU2 + hU2 + GGAG;
      const yA2 = yU2 + hU2 + G;
      const yBtn = yA2 + ONE + BTN_GAP;
      const top = (q, v) => ($(q).style.top = Math.round(v) + "px");
      top("#ch-title", 0);
      top("#ch-u1", yU1);
      top("#ch-a1", yA1);
      top("#ch-u2", yU2);
      top("#ch-gag", yGag);
      top("#ch-a2", yA2);
      top("#ch-btn", yBtn);

      // 쌓인 [top, bottom] 을 헤더·독 사이에 앉힌다: 짧으면 위·아래 틈을 같게(각 ≤140), 길면 바닥(독 위 24)에 붙인다
      const fit = (t, b) => ((b - t) <= (DT - HB) - 48 ? Math.round((HB + DT) / 2 - (t + b) / 2) : Math.round(DT - 24 - b));
      const flush = (b, pad) => Math.round(DT - pad - b);

      let offNow = 0;
      function glide(t, to) {
        tl.add("#ch-thread", { translateY: [offNow, to], duration: D.glide, ease: E.glide }, ms(t));
        offNow = to;
      }
      // 말풍선 높이 = clip-path(inset 아래쪽)로 줄 단위로 늘린다. 쌓인 높이가 커지니 컬럼이 같은 곡선으로 다시 앉는다
      const clip = (h, full) => "inset(0px 0px " + (full - h) + "px 0px round 36px)";
      let a1Now = ONE;
      function growA1(t, h) {
        tl.add("#ch-a1", { clipPath: [clip(a1Now, hA1), clip(h, hA1)], duration: D.glide, ease: E.glide }, ms(t));
        a1Now = h;
        glide(t, fit(TD, yA1 + h)); // 제목은 이미 TD 만큼 내려와 있다 (첫 성장과 같은 순간에 내려온다)
      }

      // 언더라인: 단어 폭에 맞춘 SVG 선
      const uls = Array.from(document.querySelectorAll(".uls")).map((svg) => {
        const w = svg.parentNode.offsetWidth;
        svg.setAttribute("viewBox", "0 0 " + w + " 4");
        svg.style.width = w + "px";
        svg.firstElementChild.setAttribute("d", "M0 2H" + w);
        return A.svg.createDrawable(svg.firstElementChild);
      });
      const ulA1 = uls.slice(0, 2), ulA2 = uls[2];

      // ---------- 시작 상태 (t=0): 제목·첫 질문·AI 타이핑 말풍선이 F0에 다 보인다 ----------
      const lines = Array.from(document.querySelectorAll("#ch-a1 .ln > span, #a2-l1"));
      tl.set(lines, { translateY: "105%" }, 0);
      tl.set(["#st1", "#st2", "#st3"], { translateY: "105%" }, 0);
      tl.set(["#ch-u2", "#ch-a2", "#ch-btn"], { opacity: 0 }, 0);
      tl.set("#a1-dots b", { opacity: 0.3 }, 0);
      tl.set("#ch-a1", { clipPath: clip(ONE, hA1) }, 0);
      uls.forEach((d) => tl.set(d, { draw: "0 0" }, 0));
      // 입력창: 한 줄(아래 112px)만 보이게. 둘째 줄이 오면 위로 한 줄(62) 더
      const barClip = (n) => "inset(" + (n === 1 ? LINE : 0) + "px 0px 0px 0px round 56px)";
      tl.set("#ch-bar", { clipPath: barClip(1) }, 0);
      if (CUT === 30) {
        tl.set("#bar-text", { translateY: LINE }, 0);
        tl.set(["#bar-c1", "#bar-d", "#bar-c2", "#bar-c3"], { opacity: 0 }, 0);
      }
      offNow = fit(0, yA1 + ONE);
      tl.set("#ch-thread", { translateY: offNow }, 0);
      // 카메라: 한 컷(챗 전체)에 한 번, 1.00 → 1.03 선형 푸시. 원점 = 시그니처 버튼 중심
      $("#ch-cam").style.transformOrigin = "540px " + BTN_CY + "px";
      push(tl, "#ch-cam", 0, C.WIN);

      // ===== C1 훅: AI 타이핑 점이 천천히 숨 쉰다 =====
      const dots = document.querySelectorAll("#a1-dots b");
      const tC2 = C.C2;
      for (let t = 0.35; t < tC2 - 0.6; t += 0.9) {
        dots.forEach((d, i) => {
          tl.add(d, { opacity: [0.3, 1], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15));
          tl.add(d, { opacity: [1, 0.3], duration: 300, ease: "inOutSine" }, ms(t + i * 0.15 + 0.3));
        });
      }
      tl.add("#a1-dots", { opacity: [1, 0], duration: 200, ease: E.exit }, ms(tC2));

      // ===== C2 답변: 제목이 질문 쪽으로 다가오고(140 → 60), 큰 AI 말풍선이 줄 단위로 열린다 (앞 문단 → 핵심 문장) =====
      tl.add("#ch-title-in", { translateY: [0, TD], duration: D.glide, ease: E.glide }, ms(tC2));
      if (CUT === 30) {
        growA1(tC2, ONE + LINE);
        rise(tl, ["#a1-p1", "#a1-p2"], tC2 + 0.05);
        const tK1 = tC2 + 0.55;
        growA1(tK1, ONE + 2 * LINE);
        rise(tl, "#a1-l1", tK1 + 0.05);
        const tK2 = tC2 + 1.35;
        growA1(tK2, ONE + 3 * LINE);
        rise(tl, "#a1-l2", tK2 + 0.05);
        // ===== C3 다운비트: 골드 언더라인 → 예시 줄 =====
        const tC3 = C.C3;
        ulA1.forEach((d, i) => tl.add(d, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(tC3 + i * 0.09)));
        const tEx = tC3 + 0.95;
        growA1(tEx, hA1);
        rise(tl, "#a1-l3", tEx + 0.05);

        // ===== C4 다운비트: 아래 입력창에 질문이 3–4 덩어리로 들어간다 =====
        const tC4 = C.C4;
        tl.add("#bar-ph", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(tC4 + 0.1));
        const k1 = tC4 + 0.25; // "나 전문대 나왔는데"
        tl.add(["#bar-c1", "#bar-d"], { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k1));
        tl.add("#bar-send", { backgroundColor: ["#c9c6be", "#0e1116"], duration: 200, ease: "inOutSine" }, ms(k1));
        const k2 = k1 + 0.6; // 망설임: "는데"를 지운다
        tl.add("#bar-d", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(k2));
        tl.set("#bar-d", { display: "none" }, ms(k2 + 0.17));
        tl.set("#bar-c2", { display: "inline" }, ms(k2 + 0.17));
        const k3 = k2 + 0.25; // "고 회사 다니는데,"
        tl.add("#bar-c2", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k3));
        const k4 = k3 + 0.5; // 둘째 줄: 입력창이 위로 한 줄 자란다 (독은 처음부터 그만큼 열려 있어 대화는 움직이지 않는다)
        tl.add("#ch-bar", { clipPath: [barClip(1), barClip(2)], duration: D.glide, ease: E.glide }, ms(k4));
        tl.add("#bar-text", { translateY: [LINE, 0], duration: D.glide, ease: E.glide }, ms(k4));
        tl.set("#bar-c3", { display: "inline" }, ms(k4));
        tl.add("#bar-c3", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(k4 + 0.1));
        const kSend = C.SEND; // 전송: 입력창은 비고 한 줄로 돌아가며, 질문은 대화에 사용자 말풍선으로
        tl.add("#bar-send", { scale: [1, 0.94], duration: D.press / 2, ease: E.ui }, ms(kSend));
        tl.add("#bar-send", { scale: [0.94, 1], duration: D.press / 2, ease: E.ui }, ms(kSend + D.press / 2000));
        const kOut = C.GAG;
        tl.add("#bar-text", { opacity: [1, 0], duration: 150, ease: E.exit }, ms(kOut));
        tl.add("#ch-bar", { clipPath: [barClip(2), barClip(1)], duration: D.glide, ease: E.glide }, ms(kOut));
        tl.add("#bar-send", { backgroundColor: ["#0e1116", "#c9c6be"], duration: 200, ease: "inOutSine" }, ms(kOut));
        tl.add("#bar-ph", { opacity: [0, 1], duration: 200, ease: E.ui }, ms(kOut + 0.3));
      } else {
        // ===== 15초 C2: 앞 문단 + 핵심 문장 → 다운비트에 언더라인 → 예시 줄 =====
        growA1(tC2, ONE + LINE);
        rise(tl, ["#a1-p1", "#a1-l1"], tC2 + 0.05);
        ulA1.forEach((d, i) => tl.add(d, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(C.UL + i * 0.09)));
        growA1(C.EX, hA1);
        rise(tl, "#a1-l3", C.EX + 0.05);
      }

      // ===== C5 로딩 개그: 음악은 그대로 흐르고, 화면 글자만 바뀐다. 질문이 도착하는 순간 컬럼이 개그 자리까지 한 번에 올라간다 =====
      const kOut = C.GAG;
      exit(tl, "#ch-title", kOut);
      if (CUT === 30) exit(tl, "#ch-u1", kOut); // 30초: 첫 질문은 헤더 밑으로 밀려 조각만 남으므로 제목과 함께 물러난다 (15초는 온전히 보인다)
      ui(tl, "#ch-u2", kOut);
      glide(kOut, flush(yGag + GAG_H, GGAG));
      const g0 = kOut + 0.1; // 문구가 올라오기 시작
      rise(tl, "#st1", g0);
      // 문구 교체는 제자리 크로스페이드 (교체 사이 공백 없이 읽는 시간을 지킨다)
      function swap(a, b, t) {
        tl.add(a, { opacity: [1, 0], duration: 160, ease: "inOutSine" }, ms(t));
        tl.set(b, { translateY: "0%" }, ms(t));
        tl.add(b, { opacity: [0, 1], duration: 200, ease: "inOutSine" }, ms(t));
      }
      let lastGag = "#st1";
      if (CUT === 30) {
        // 고민 중… → 아직 고민 중… → 음… : 음악이 흐르는 2.3초를 같은 길이로 나눈다
        const dw = (C.R - g0) / 3;
        tl.set(["#st2", "#st3"], { opacity: 0 }, 0);
        swap("#st1", "#st2", g0 + dw);
        swap("#st2", "#st3", g0 + 2 * dw);
        lastGag = "#st3";
      }

      // ===== C6 음악 이음새 다운비트(R): '책임'을 이유로 넘긴다 → [상담사 연결] =====
      riseOut(tl, lastGag, C.R);
      ui(tl, "#ch-a2", C.R);
      rise(tl, "#a2-l1", C.R + 0.05);
      tl.add(ulA2, { draw: ["0 0", "0 1"], duration: D.draw, ease: E.draw }, ms(C.R + (CUT === 30 ? 0.95 : 0.4)));
      const tBtn = C.R + (CUT === 30 ? 1.55 : 0.6);
      ui(tl, "#ch-btn", tBtn);
      glide(tBtn, flush(yBtn + BTN_H, 16));
      // 누름 140ms (스프링 없음) → 버튼이 열린다 (brand.html, WIN)
      tl.add("#ch-btn", { scale: [1, 0.985], duration: D.press / 2, ease: E.ui }, ms(C.PRESS));
      tl.add("#ch-btn", { scale: [0.985, 1], duration: D.press / 2, ease: E.ui }, ms(C.PRESS + D.press / 2000));

      tl.set({ v: 0 }, { v: 1 }, ms(C.WIN + 1.3));
      tl.seek(0);
    })();
  </script>
</template>
