      tl.add(ttlUl, { draw: ["0 0", "0 1"], duration: 320, ease: "outQuart" }, ms(B(1)));
      tl.add("#ch-u1", { scale: [{ to: 1.05, duration: 70, ease: "outQuad" }, { to: 1, duration: 320, ease: "outBack(3)" }] }, ms(B(2)));
      POP(["#ch-av1", "#ch-typing"], B(3), { scale: [0.4, 1] }, 0.5);
      dotsBounce("#ch-typing .td", B(3.5), B(6), P / 2);
      shake(tl, "#ch-shake", B(4), 6, 5, 11);

      if (CUT === 30) {
        // ===== C2 핵심 답변 B6 – B14 =====
        flash(tl, "#ch-flash", B(6), 0.55);
        tl.add("#ch-title", { opacity: 0, translateY: -60, duration: 200, ease: "inQuad" }, ms(B(6)));
        tl.add("#ch-title-ul", { opacity: 0, duration: 150, ease: "inQuad" }, ms(B(6)));
        HIDE("#ch-typing", B(6), 0.08);
        tl.set("#ch-a1", { opacity: 1 }, ms(B(6)));
        CLIP(B(6), full - typingH, exH, 0.35);
        SCROLL(B(6), S_C2, 0.4);
        CAM(B(6), 0.3, Z(1, 0, 0), "outExpo");
        tl.add("#ch-note", { opacity: [0, 1], translateY: [12, 0], duration: 250 }, ms(B(7)));
        type(tl, splitA1, B(6.5), P / 4);
        CAM(B(7), B(14) - B(7), Z(1.03, 480, 960), "inOutSine");
        shake(tl, "#ch-shake", B(8), 4, 4, 12);
        shake(tl, "#ch-shake", B(12), 4, 4, 13);

        // ===== C3 하이라이트 + 예시 B14 – B20 =====
        flash(tl, "#ch-flash", B(14), 0.5);
        tl.add("#hl1 > i", { scaleX: [0, 1], duration: 180, ease: "outQuart" }, ms(B(14)));
        tl.add("#hl2 > i", { scaleX: [0, 1], duration: 150, ease: "outQuart" }, ms(B(15)));
        CAM(B(14), 0.3, Z(1.1, 400, 920), "outExpo");
        shake(tl, "#ch-shake", B(14), 9, 5, 14);
        shake(tl, "#ch-shake", B(15), 5, 4, 15);
        CLIP(B(16), exH, 0, 0.3);
        SCROLL(B(16), S_C3, 0.3);
        tl.add("#ch-note", { translateY: [0, exH], duration: 300, ease: "outExpo" }, ms(B(16)));
        CAM(B(16), 0.5, Z(1.05, 420, 1000), "inOutQuad");
        type(tl, splitEx, B(16.5), P / 4);
        tl.add("#ex-b", { scale: [{ to: 1.2, duration: 80, ease: "outQuad" }, { to: 1, duration: 300, ease: "outBack(3)" }] }, ms(B(19)));
        shake(tl, "#ch-shake", B(19), 5, 4, 16);

        // ===== C4 두 번째 질문 B20 – B26 (입력창 클로즈업, 지웠다 다시 쓰기) =====
        flash(tl, "#ch-flash", B(20), 0.5);
        CAM(B(20), 0.35, Z(1.08, 490, 1305), "outExpo");
        tl.add("#ch-dim", { opacity: [0, 1], duration: 250 }, ms(B(20)));
        tl.add("#ch-comp2", { opacity: [0, 1], clipPath: ["inset(250px 0px 0px 0px round 44px)", "inset(0px 0px 0px 0px round 44px)"], duration: 300 }, ms(B(20)));
        // 캐럿 위치: 지울 글자를 뺀 최종 레이아웃에서 잰다
        const typed = split("#cp-typed");
        const ct = $("#cp-text");
        const caretAt = (el) => ({ x: el.offsetLeft + el.offsetWidth + 3, y: el.offsetTop + 12 });
        const posFull = caretAt($("#cp-d2"));
        const posD1 = caretAt($("#cp-d1"));
        $("#cp-d1").style.display = "none";
        $("#cp-d2").style.display = "none";
        const posTyped = typed.map(caretAt);
        const lastFixed = ct.firstChild; // "나 전문대 나왔"
        const r0 = document.createRange();
        r0.selectNodeContents(lastFixed);
        const rr = r0.getBoundingClientRect(), cr = ct.getBoundingClientRect();
        const posBase = { x: rr.right - cr.left + 3, y: 12 };
        $("#cp-d1").style.display = "";
        $("#cp-d2").style.display = "";
        tl.set(typed, { opacity: 0 }, 0);
        tl.set(["#cp-d1", "#cp-d2"], { display: "inline-block" }, 0);
        tl.set("#cp-caret", { translateX: posFull.x, translateY: posFull.y, opacity: 1 }, ms(B(20)));
        tl.set("#cp-caret", { opacity: 0 }, ms(B(20.5)));
        tl.set("#cp-caret", { opacity: 1 }, ms(B(20.75)));
        // 백스페이스 ×2 (32분)
        tl.set("#cp-d2", { display: "none" }, ms(B(21)));
        tl.set("#cp-caret", { translateX: posD1.x }, ms(B(21)));
        press(bksp, B(21));
        tl.set("#cp-d1", { display: "none" }, ms(B(21.5)));
        tl.set("#cp-caret", { translateX: posBase.x }, ms(B(21.5)));
        press(bksp, B(21.5));
        // 다시 쓰기: 32분 음표마다 한 글자
        typed.forEach((c, i) => {
          const t = B(22) + i * (P / 8) * 2;
          tl.set(c, { opacity: 1 }, ms(t));
          tl.set("#cp-caret", { translateX: posTyped[i].x, translateY: posTyped[i].y }, ms(t));
          press(keys[krnd(0, keys.length - 1)], t);
        });
        const tDone = B(22) + (typed.length - 1) * (P / 4);
        tl.set("#cp-send", { backgroundColor: "#2a9d8f" }, ms(tDone + 0.05));
        tl.add("#cp-send", { scale: [{ to: 0.86, duration: 60 }, { to: 1, duration: 120 }], ease: "outQuad" }, ms(B(24) - 0.06));
        // 전송 (다운비트 B24)
        tl.set("#cp-caret", { opacity: 0 }, ms(B(24)));
        tl.add("#ch-comp2", { opacity: [1, 0], clipPath: ["inset(0px 0px 0px 0px round 44px)", "inset(300px 0px 0px 0px round 44px)"], duration: 200, ease: "inQuad" }, ms(B(24)));
        tl.add("#ch-dim", { opacity: [1, 0], duration: 200, ease: "inQuad" }, ms(B(24)));
        POP("#ch-u2", B(24), { translateY: [320, 0], scale: [0.85, 1] }, 0.4, 450);
        SCROLL(B(24), S_C4, 0.45);
        CAM(B(24), 0.4, Z(1, 0, 0), "outExpo");
        shake(tl, "#ch-shake", B(24), 6, 4, 17);
      } else {
        // ===== 15초 C2 B6 – B10: 짧은 답 → 형광펜 → 예시 =====
        flash(tl, "#ch-flash", B(6), 0.55);
        tl.add("#ch-title", { opacity: 0, translateY: -60, duration: 200, ease: "inQuad" }, ms(B(6)));
        tl.add("#ch-title-ul", { opacity: 0, duration: 150, ease: "inQuad" }, ms(B(6)));
        HIDE("#ch-typing", B(6), 0.08);
        tl.set("#ch-a1", { opacity: 1 }, ms(B(6)));
        CLIP(B(6), full - typingH, exH, 0.3);
        SCROLL(B(6), S_C2, 0.4);
        CAM(B(6), 0.3, Z(1, 0, 0), "outExpo");
        tl.add("#ch-note", { opacity: [0, 1], translateY: [12, 0], duration: 250 }, ms(B(7)));
        type(tl, splitA1, B(6.5), P / 8);
        tl.add("#hl1 > i", { scaleX: [0, 1], duration: 160, ease: "outQuart" }, ms(B(8)));
        tl.add("#hl2 > i", { scaleX: [0, 1], duration: 140, ease: "outQuart" }, ms(B(8.5)));
        CAM(B(8), 0.3, Z(1.08, 420, 840), "outExpo");
        shake(tl, "#ch-shake", B(8), 8, 5, 21);
        CLIP(B(9), exH, 0, 0.25);
        SCROLL(B(9), S_C3, 0.25);
        tl.add("#ch-note", { translateY: [0, exH], duration: 250, ease: "outExpo" }, ms(B(9)));
        type(tl, splitEx, B(9), P / 8);
        tl.add("#ex-b", { scale: [{ to: 1.2, duration: 70, ease: "outQuad" }, { to: 1, duration: 240, ease: "outBack(3)" }] }, ms(B(9.5)));

        // ===== 15초 C3 B10 – 고민 중 =====
        flash(tl, "#ch-flash", B(10), 0.5);
        POP("#ch-u2", B(10), { translateY: [300, 0], scale: [0.85, 1] }, 0.4, 420);
        SCROLL(B(10), S_C4, 0.4);
        CAM(B(10), 0.35, Z(1, 0, 0), "outExpo");
        shake(tl, "#ch-shake", B(10), 6, 4, 22);
      }

      // ===== 로딩 개그: 음악이 테이프 스톱으로 멈춘다 =====
      const G0 = CUT === 30 ? B(26) : B(12); // 개그 시작
      const R = CUT === 30 ? B(30.5) : 8.5 - 4 * P; // 음악 슬램 (🙂 말풍선)
      tl.add("#ch-dip", { opacity: [{ to: 0.28, duration: 33, ease: "linear" }, { to: 0, duration: 100, ease: "linear" }] }, ms(G0));
      SCROLL(G0, S_C5, 0.45);
      tl.add(["#ch-av2", "#ch-dots"], { opacity: [0, 1], translateY: [24, 0], duration: 300 }, ms(G0));
      tl.add("#st1", { opacity: [0, 1], filter: ["blur(8px)", "blur(0px)"], duration: 180 }, ms(G0 + 0.1));
      CAM(G0, R - G0, CUT === 30 ? Z(1.06, 420, 1210) : Z(1.05, 420, 1250), "linear");
      // 점이 점점 느려진다 (테이프 스톱과 같이)
      dotsBounce("#ch-dots .sd", G0 + 0.05, R - 0.05, P * 0.75);
      if (CUT === 30) {
        tl.add("#sd4", { opacity: [0, 1], duration: 60, ease: "linear" }, ms(B(27)));
        tl.add("#sd5", { opacity: [0, 1], duration: 60, ease: "linear" }, ms(B(28)));
        const S2 = B(27.5), S3 = B(29);
        tl.add("#st1", { opacity: 0, filter: "blur(8px)", duration: 100, ease: "inQuad" }, ms(S2 - 0.08));
        tl.add("#st2", { opacity: [0, 1], filter: ["blur(8px)", "blur(0px)"], duration: 140 }, ms(S2));
        tl.add("#av2-eyes", { translateX: [0, -8], duration: 220, ease: "inOutQuad" }, ms(S2));
        tl.add("#av2-eyes", { translateX: 8, duration: 300, ease: "inOutQuad" }, ms(S2 + 0.36));
        tl.add("#st2", { opacity: 0, filter: "blur(8px)", duration: 100, ease: "inQuad" }, ms(S3 - 0.08));
        tl.add("#st3", { opacity: [0, 1], filter: ["blur(8px)", "blur(0px)"], duration: 140 }, ms(S3));
        tl.add("#av2-eyes", { translateX: 0, translateY: [0, 9], duration: 300, ease: "outQuad" }, ms(S3));
      } else {
        tl.add("#sd4", { opacity: [0, 1], duration: 60, ease: "linear" }, ms(B(12.75)));
        tl.add("#sd5", { opacity: [0, 1], duration: 60, ease: "linear" }, ms(B(13.25)));
        tl.add("#av2-eyes", { translateX: [0, -8], duration: 200, ease: "inOutQuad" }, ms(B(12.5)));
        tl.add("#av2-eyes", { translateX: 8, translateY: [0, 6], duration: 250, ease: "inOutQuad" }, ms(B(13.1)));
      }

      // ===== C6 '책임'을 넘긴다: 음악이 다운비트로 돌아온다 =====
      const ST = CUT === 30 ? ["#st3"] : ["#st1"];
      flash(tl, "#ch-flash", R, 0.75);
      shake(tl, "#ch-shake", R, 16, 7, 31);
      HIDE(["#ch-dots", ...ST], R, 0.08);
      tl.add("#av2-eyes", { translateX: 0, translateY: 0, duration: 150, ease: "outQuad" }, ms(R));
      SCROLL(R, S_C6, 0.35);
      CAM(R, 0.3, Z(1, 0, 0), "outBack(1.6)");
      POP("#ch-a2", R, { scale: [0.55, 1] }, 0.5, 420);
      const a2step = CUT === 30 ? P / 4 : P / 8;
      type(tl, splitA2, R + P / 2, a2step);
      const emoT = R + (CUT === 30 ? 4 : 2) * P;
      tl.add("#a2-emo", { scale: [0, 1], ease: A.spring({ bounce: 0.65, duration: 420 }) }, ms(emoT));
      CAM(emoT, 0.25, Z(1.03, 500, 1150), "outExpo");
      shake(tl, "#ch-shake", emoT, 8, 5, 32);
      tl.add(a2Ul, { draw: ["0 0", "0 1"], duration: 260, ease: "outQuart" }, ms(emoT + P / 2));
      tl.set("#emo-wink", { opacity: 1 }, ms(emoT + P));
      tl.set("#emo-eye", { opacity: 0 }, ms(emoT + P));
      tl.set("#emo-wink", { opacity: 0 }, ms(emoT + P * 1.6));
      tl.set("#emo-eye", { opacity: 1 }, ms(emoT + P * 1.6));
      const btnT = CUT === 30 ? R + 5 * P : R + 2.5 * P;
      const tapT = CUT === 30 ? R + 7 * P : R + 3.5 * P;
      POP("#ch-btn", btnT, { translateY: [50, 0], scale: [0.8, 1] }, 0.5, 400);
      tl.add("#ch-hand", { opacity: [0, 1], translateX: [160, 0], translateY: [180, 0], duration: 300, ease: "outExpo" }, ms(tapT - (CUT === 30 ? P : P / 2)));
      tl.add("#ch-hand", { scale: [{ to: 0.84, duration: 70 }, { to: 1, duration: 140 }], ease: "outQuad" }, ms(tapT));
      tl.add("#ch-btn", { scale: [{ to: 0.94, duration: 70 }, { to: 1.03, duration: 140 }], backgroundColor: "#1f7a6f", ease: "outQuad" }, ms(tapT));
      tl.add("#ch-ring", { opacity: [0.9, 0], scale: [1, 1.18], duration: 380, ease: "outQuad" }, ms(tapT));
      // 버튼으로 줌 스루 → 원형 전환(brand)으로 이어진다
      const brandT = CUT === 30 ? R + 8 * P : 8.5;
      CAM(tapT + 0.1, brandT - tapT - 0.1, Z(1.12, 440, btnScreenY), "inQuad");
      tl.set({ v: 0 }, { v: 1 }, ms(CUT === 30 ? 19 : 9));

      // 모든 tl.add 뒤에 첫 프레임을 그린다
      tl.seek(0);
    })();
  </script>
</template>
