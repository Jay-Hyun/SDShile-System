<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Ink (본문·사용자 말풍선)","default":"#0E1116"},
    {"id":"color-paper","type":"color","label":"Paper (챗 바탕)","default":"#F7F6F2"},
    
    {"id":"color-muted","type":"color","label":"보조 글자 (Paper 위)","default":"#5F6368"},
    {"id":"color-field","type":"color","label":"챗 입력창 면","default":"#EEEBE4"},
    {"id":"color-navy","type":"color","label":"브랜드 Navy","default":"#0B1A33"},
    {"id":"color-sec","type":"color","label":"보조 글자 (Navy 위)","default":"#9AA0A6"},
    {"id":"color-foot","type":"color","label":"브랜드 풋터 필드 (Navy 한 톤)","default":"#102545"},
    {"id":"color-gold","type":"color","label":"골드 (강조 하나)","default":"#B8955A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/anime.min.js"></script>
    <script src="lib/cue.js"></script>
    <script src="lib/beat.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f6f2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <!-- v7 편 A (04-v7-visual.md §2). 엔진: anime.js v4 (lib/anime.min.js) + lib/beat.js. 모든 시각 = lib/cue.js (영상 다운비트 = Alex 원곡 다운비트 − 3.239 s).
           아래 data-start/data-duration 은 tools/stamp_timing.py 가 찍는다 (손으로 고치지 말 것) -->
      <!-- 마디 1–7: 버스 창가 사진 + 폰 → 디바이스 다이브 → 가상 챗봇 → 핸드오프 말풍선 -->
      <div id="phone" class="clip" data-composition-id="phone" data-composition-src="compositions/phone.html"
        data-start="0" data-duration="13.033" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- 마디 8–16: 말풍선이 세계가 됨 → 주말 책상 → 부엌 카드 → 계단 슬로건 → Navy 엔드카드 -->
      <div id="world" class="clip" data-composition-id="world" data-composition-src="compositions/world.html"
        data-start="12.3" data-duration="17.7" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 배지 · 연출 대화 안내 · 보장 금지 고지 -->
      <div id="legal" class="clip" data-composition-id="legal" data-composition-src="compositions/legal.html"
        data-start="0" data-duration="30" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- 오디오: tools/make_audio.py — Alex_Besss News Background (Pixabay 602905) 한 구간 그대로 + 부드러운 탭 2개 (합 −15 LUFS, TP ≤ −1 dBTP) -->
      <audio id="bgm" class="clip" src="assets/audio/bgm.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
