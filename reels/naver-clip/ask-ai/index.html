<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-chat-ground","type":"color","label":"챗 배경","default":"#F2F3F5"},
    {"id":"color-teal","type":"color","label":"챗 포인트(틸)","default":"#2A9D8F"},
    {"id":"color-ink","type":"color","label":"본문","default":"#161616"},
    {"id":"color-navy","type":"color","label":"브랜드 네이비","default":"#0B1A33"},
    {"id":"color-paper","type":"color","label":"웜화이트","default":"#FBF9F4"},
    {"id":"color-gold","type":"color","label":"골드","default":"#B8955A"},
    {"id":"color-gold-light","type":"color","label":"골드(어두운 배경용)","default":"#E0C27E"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2f3f5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- C1–C6 가상 챗봇 화면 (0–18.0). 18.0–18.5는 원형 마스크 아래에 깔림 -->
      <div id="chat" class="clip" data-composition-id="chat" data-composition-src="compositions/chat.html"
        data-start="0" data-duration="18.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- C7–C10 브랜드 · 상담 화면 · 엔드카드 (18.0–30.0) -->
      <div id="brand" class="clip" data-composition-id="brand" data-composition-src="compositions/brand.html"
        data-start="18" data-duration="12" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 연출 배지 · 국내 유일 각주 · 보장 금지 고지 (전 구간 오버레이) -->
      <div id="legal" class="clip" data-composition-id="legal" data-composition-src="compositions/legal.html"
        data-start="0" data-duration="30" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- 사운드 베드: tools/make_audio.py 로 합성 (VO는 추후 녹음해 별도 트랙으로 추가) -->
      <audio id="bgm" class="clip" src="assets/audio/bgm.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
