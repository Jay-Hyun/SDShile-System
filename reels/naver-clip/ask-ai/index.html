<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Ink (본문·사용자 말풍선)","default":"#0E1116"},
    {"id":"color-paper","type":"color","label":"Paper (챗 바탕)","default":"#F7F6F2"},
    {"id":"color-tone","type":"color","label":"AI 말풍선 (Paper 한 단계)","default":"#EAE7DF"},
    {"id":"color-muted","type":"color","label":"보조 글자 (Paper 위)","default":"#5F6368"},
    {"id":"color-field","type":"color","label":"챗 입력창 면","default":"#EEEBE4"},
    {"id":"color-navy","type":"color","label":"브랜드 Navy","default":"#0B1A33"},
    {"id":"color-sec","type":"color","label":"보조 글자 (Navy 위)","default":"#9AA0A6"},
    {"id":"color-foot","type":"color","label":"브랜드 풋터 필드 (Navy 한 톤)","default":"#102545"},
    {"id":"color-gold","type":"color","label":"골드 (강조 하나)","default":"#B8955A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/anime.min.js"></script>
    <script src="lib/cue.js"></script>
    <script src="lib/beat.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f6f2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- 엔진: anime.js v4 (lib/anime.min.js) + lib/beat.js. 컷·챕터는 BGM 다운비트(1마디 = 4·60/125.03 s), 장면 안 모션은 비트와 무관하게 흐른다.
           모든 시각의 단일 출처 = lib/cue.js. 아래 data-start/data-duration 은 tools/stamp_timing.py 가 거기서 찍는다 (손으로 고치지 말 것) -->
      <!-- C1–C6 가상 챗봇 화면 (한 컷). [상담사 연결]이 열리는 1.2초 동안 아래에 깔린다 -->
      <div id="chat" class="clip" data-composition-id="chat" data-composition-src="compositions/chat.html"
        data-start="0" data-duration="15.03" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- C7–C9 상담 화면 · 엔드 시퀀스 (버튼이 열리기 시작 → 원곡 B섹션 크래시 = 열림 중간점) -->
      <div id="brand" class="clip" data-composition-id="brand" data-composition-src="compositions/brand.html"
        data-start="13.8" data-duration="16.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 연출 배지 · 연출 대화 고지 · 국내 유일 각주 · 보장 금지 고지 (전 구간 오버레이) -->
      <div id="legal" class="clip" data-composition-id="legal" data-composition-src="compositions/legal.html"
        data-start="0" data-duration="30" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- 오디오: tools/make_audio.py — 제공 BGM(Pixabay 505611) 편집 스템 + 장면 동작에 맞춘 SFX 스템 (합 −15 LUFS, TP ≤ −1 dBTP) -->
      <audio id="bgm" class="clip" src="assets/audio/bgm.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
