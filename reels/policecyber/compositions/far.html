<template>
  <style>

        radial-gradient(55% 35% at 85% 85%, rgba(224, 194, 126, 0.95), rgba(224, 194, 126, 0) 100%),

    #fa-grid { position: absolute; inset: 0; }

    .gh { fill: #ffffff; }
    #fa-a1 { top: 570px; font-size: 110px; font-weight: 900; color: #ffffff; }
    #fa-a2 { top: 730px; font-size: 200px; font-weight: 900; line-height: 1; color: #f0d595; }

  </style>
  <div id="root" data-composition-id="far" data-width="1080" data-height="1920">
    <div id="far-bg" class="bgl" data-layout-ignore></div>
    <div id="far-cam" class="cam" data-layout-allow-overlap>
      <div id="fa-kick" class="stage">AI가 써 준 계약서,</div>
      <div id="fa-w1" class="stage hero"><b>읽고</b></div>
      <div id="fa-w2" class="stage hero" data-layout-allow-overlap><b>따지고</b></div>
      <div id="fa-w3" class="stage hero" data-layout-allow-overlap style="font-size: 170px">서명은 사람이.</div>
      <div id="fa-mesh" class="mesh" data-layout-ignore></div>
      <svg id="fa-grid" viewBox="0 0 1080 1920" data-layout-ignore>
        <line class="gl" x1="0" y1="550" x2="1080" y2="550" />
        <line class="gl" x1="0" y1="950" x2="1080" y2="950" />

        <rect class="gh" x="112" y="542" width="16" height="16" />

        <rect class="gh" x="952" y="942" width="16" height="16" />
      </svg>
      <div id="fa-a1" class="stage" data-layout-allow-overlap>법을 아는 사람이</div>
      <div id="fa-a2" class="stage" data-layout-allow-overlap>한 수 위.</div>

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const CAM = "#far-cam", BG = "#far-bg";

    const D = 2.47;
    const B = {"3": 0.0, "4": 0.38, "5": 0.82, "6": 1.2, "7": 1.58, "8": 2.02};
    // 등장: 블러 → 선명, 짧고 정확하게. 오버슈트 없음
    function IN(sel, t, from, dur) {
      const f = Object.assign({ opacity: 0, filter: "blur(12px)" }, from || {});
      const to = { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power3.out" };
      for (const k in f) if (!(k in to)) to[k] = k.startsWith("scale") ? 1 : 0;
      tl.fromTo(sel, f, to, t);
    }
    // 퇴장: 다음 비트 직전에 짧게 빠짐
    function OUT(sel, t, to) {
      tl.to(sel, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.07, ease: "power2.in" }, to || {}), t - 0.07);
    }
    // 카메라: 씬 내내 한 방향으로 천천히 다가감 (펌프·흔들림 없음)
    tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: 2.47, ease: "none" }, 0);
    tl.fromTo(BG, { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);


    // B3 AI가 써 준 계약서, · B4 읽고 · B5 따지고 · B6 서명은 사람이. · B7 법을 아는 사람이 · B8 한 수 위.
    IN("#fa-kick", B[3], { y: -20 }, 0.2);
    IN("#fa-w1", B[4], { scale: 1.3, filter: "blur(20px)" }, 0.2);
    OUT("#fa-w1", B[5], { y: -140 });
    IN("#fa-w2", B[5], { y: 140 }, 0.14);
    OUT(["#fa-w2", "#fa-kick"], B[6], { y: -140 });
    IN("#fa-w3", B[6], { y: 140 }, 0.14);
    // B7: 그라데이션이 덮이며 답
    tl.fromTo("#fa-mesh", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.16, ease: "power3.inOut" }, B[7] - 0.1);
    tl.fromTo("#fa-grid", { opacity: 0 }, { opacity: 1, duration: 0.12 }, B[7]);
    IN("#fa-a1", B[7], { y: 30 });
    IN("#fa-a2", B[8], { scale: 1.15, filter: "blur(16px)" }, 0.2);
    OUT(CAM, D, {});

    window.__timelines["far"] = tl;
  </script>
