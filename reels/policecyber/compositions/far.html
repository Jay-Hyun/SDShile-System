<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOVVariable.woff2") format("woff2");
      font-weight: 100 900;
    }
    #root {
      /* 배경 토닝: 밝은 씬 = 옅은 괘선 + 블루/골드 토닝, 어두운 씬 = 도트 그리드 + 글로우. 전부 노이즈를 아주 약하게 */
      --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      --paper:
        var(--noise),
        radial-gradient(60% 38% at 0% 0%, rgba(46, 92, 190, 0.09), rgba(46, 92, 190, 0) 100%),
        radial-gradient(60% 40% at 100% 100%, rgba(224, 194, 126, 0.22), rgba(224, 194, 126, 0) 100%),
        repeating-linear-gradient(0deg, rgba(11, 26, 51, 0.045) 0 2px, rgba(11, 26, 51, 0) 2px 72px),
        linear-gradient(90deg, rgba(0, 0, 0, 0) 0 118px, rgba(184, 149, 90, 0.18) 118px 120px, rgba(0, 0, 0, 0) 120px),
        #fbf9f4;
      --ink:
        var(--noise),
        radial-gradient(70% 40% at 50% 35%, rgba(46, 92, 190, 0.3), rgba(46, 92, 190, 0) 100%),
        radial-gradient(55% 35% at 95% 100%, rgba(224, 194, 126, 0.14), rgba(224, 194, 126, 0) 100%),
        radial-gradient(circle, rgba(255, 255, 255, 0.07) 1.6px, rgba(255, 255, 255, 0) 1.8px) 0 0 / 40px 40px,
        #0a1020;
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "PretendardGOV", sans-serif;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }
    .stage {
      position: absolute;
      left: 80px;
      width: 920px;
      text-align: center;
    }
    .w {
      display: inline-block;
    }
    .cam {
      position: absolute;
      inset: 0;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(55% 35% at 85% 85%, rgba(224, 194, 126, 0.95), rgba(224, 194, 126, 0) 100%),
        radial-gradient(60% 40% at 10% 20%, rgba(11, 26, 51, 1), rgba(11, 26, 51, 0) 100%),
        radial-gradient(70% 45% at 40% 60%, #2e5cbe, rgba(46, 92, 190, 0) 100%),
        linear-gradient(160deg, #12264a 0%, #2e5cbe 55%, #c9a666 100%);
    }
    .mesh::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        var(--noise),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px);
    }
    .bgl {
      position: absolute;
      inset: 0;
    }

    #root { color: #0b1a33; background: var(--paper); }
    .ta { top: 630px; font-size: 80px; font-weight: 800; color: #6b6660; white-space: nowrap; }
    .tb { top: 750px; font-size: 112px; font-weight: 900; white-space: nowrap; }
    #fa-mesh { position: absolute; inset: 0; }
    #fa-a3 { color: rgba(255, 255, 255, 0.9); }
    #fa-b3 { top: 740px; font-size: 200px; line-height: 1; color: #f0d595; }

  </style>
  <div id="root" data-composition-id="far" data-width="1080" data-height="1920">
    <div id="far-bg" class="bgl" data-layout-ignore></div>
    <div id="far-cam" class="cam" data-layout-allow-overlap>
      <div id="fa-a1" class="stage ta">계약서 한 장,</div>
      <div id="fa-b1" class="stage tb">AI는 금방 씁니다.</div>
      <div id="fa-a2" class="stage ta" data-layout-allow-overlap>그런데 서명하는 손은</div>
      <div id="fa-b2" class="stage tb" data-layout-allow-overlap>여전히 망설이죠.</div>
      <div id="fa-mesh" class="mesh" data-layout-ignore></div>
      <div id="fa-a3" class="stage ta" data-layout-allow-overlap>그 망설임을 확신으로,</div>
      <div id="fa-b3" class="stage tb" data-layout-allow-overlap>법학 전공.</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const CAM = "#far-cam", BG = "#far-bg";

    const D = 2.47;
    const B = {"3": 0.0, "4": 0.38, "5": 0.82, "6": 1.2, "7": 1.58, "8": 2.02};
    // 등장: 블러 → 선명, 짧고 정확하게. 오버슈트 없음
    function IN(sel, t, from, dur) {
      const f = Object.assign({ opacity: 0, filter: "blur(12px)" }, from || {});
      const to = { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power3.out" };
      for (const k in f) if (!(k in to)) to[k] = k.startsWith("scale") ? 1 : 0;
      tl.fromTo(sel, f, to, t);
    }
    // 퇴장: 다음 비트 직전에 짧게 빠짐
    function OUT(sel, t, to) {
      tl.to(sel, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.07, ease: "power2.in" }, to || {}), t - 0.07);
    }
    // 카메라: 씬 내내 한 방향으로 천천히 다가감 (펌프·흔들림 없음)
    tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: 2.47, ease: "none" }, 0);
    tl.fromTo(BG, { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);


    // B3 계약서 한 장, · B4 AI는 금방 씁니다. · B5 그런데 서명하는 손은 · B6 여전히 망설이죠. · B7 그 망설임을 확신으로, · B8 법학 전공.
    IN("#fa-a1", B[3], { y: 24 }, 0.2);
    IN("#fa-b1", B[4], { y: 30 });
    OUT(["#fa-a1", "#fa-b1"], B[5], { y: -60 });
    IN("#fa-a2", B[5], { y: 24 }, 0.2);
    IN("#fa-b2", B[6], { y: 30 });
    // B7: 화면이 그라데이션으로 바뀌며 답
    tl.fromTo("#fa-mesh", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.16, ease: "power3.inOut" }, B[7] - 0.1);
    OUT(["#fa-a2", "#fa-b2"], B[7], { y: -60 });
    IN("#fa-a3", B[7], { y: 24 }, 0.2);
    IN("#fa-b3", B[8], { scale: 1.15, filter: "blur(16px)" }, 0.22);
    OUT(CAM, D, {});

    window.__timelines["far"] = tl;
  </script>
</template>
