<template>
  <style>

      font-weight: 100 900;
    }
    #root {
      /* 배경 토닝: 밝은 씬 = 옅은 괘선 + 블루/골드 토닝, 어두운 씬 = 도트 그리드 + 글로우. 전부 노이즈를 아주 약하게 */
      --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      --paper:
        var(--noise),
        radial-gradient(60% 38% at 0% 0%, rgba(46, 92, 190, 0.09), rgba(46, 92, 190, 0) 100%),
        radial-gradient(60% 40% at 100% 100%, rgba(224, 194, 126, 0.22), rgba(224, 194, 126, 0) 100%),
        repeating-linear-gradient(0deg, rgba(11, 26, 51, 0.045) 0 2px, rgba(11, 26, 51, 0) 2px 72px),
        linear-gradient(90deg, rgba(0, 0, 0, 0) 0 118px, rgba(184, 149, 90, 0.18) 118px 120px, rgba(0, 0, 0, 0) 120px),
        #fbf9f4;
      --ink:
        var(--noise),
        radial-gradient(70% 40% at 50% 35%, rgba(46, 92, 190, 0.3), rgba(46, 92, 190, 0) 100%),
        radial-gradient(55% 35% at 95% 100%, rgba(224, 194, 126, 0.14), rgba(224, 194, 126, 0) 100%),
        radial-gradient(circle, rgba(255, 255, 255, 0.07) 1.6px, rgba(255, 255, 255, 0) 1.8px) 0 0 / 40px 40px,
        #0a1020;
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "PretendardGOV", sans-serif;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }
    .stage {
      position: absolute;
      left: 80px;
      width: 920px;
      text-align: center;
    }
    .w {
      display: inline-block;
    }
    .cam {
      position: absolute;
      inset: 0;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(55% 35% at 85% 85%, rgba(224, 194, 126, 0.95), rgba(224, 194, 126, 0) 100%),
        radial-gradient(60% 40% at 10% 20%, rgba(11, 26, 51, 1), rgba(11, 26, 51, 0) 100%),
        radial-gradient(70% 45% at 40% 60%, #2e5cbe, rgba(46, 92, 190, 0) 100%),
        linear-gradient(160deg, #12264a 0%, #2e5cbe 55%, #c9a666 100%);
    }
    .mesh::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        var(--noise),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px);
    }
    .bgl {
      position: absolute;
      inset: 0;
    }

    #root { color: #ffffff; background: var(--ink); }
    #pa-t1 { top: 640px; font-size: 140px; font-weight: 900; }
    #pa-t2 { top: 800px; font-size: 140px; font-weight: 900; color: #f0d595; }
    .slash { position: absolute; width: 8px; height: 260px; background: #ffffff; border-radius: 4px; }
    .mc { position: absolute; width: 400px; padding: 28px 32px; border-radius: 26px; background: #fbf9f4; color: #0b1a33; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); letter-spacing: -0.03em; }
    .mc b { display: block; font-size: 50px; font-weight: 900; }
    .mc span { display: block; margin-top: 6px; font-size: 30px; font-weight: 700; color: #2e5cbe; }
    .mc i { position: absolute; right: 26px; top: 26px; font-style: normal; font-size: 30px; font-weight: 900; color: #1f9d55; background: #d9f5e3; border-radius: 10px; padding: 4px 12px; }
    #pa-fine { top: 1270px; font-size: 30px; font-weight: 500; color: rgba(255, 255, 255, 0.62); letter-spacing: -0.02em; }

  </style>
  <div id="root" data-composition-id="paths" data-width="1080" data-height="1920">
    <div id="paths-bg" class="bgl" data-layout-ignore></div>
    <div id="paths-cam" class="cam" data-layout-allow-overlap>
      <div class="slash" id="pa-sl1" style="left: 300px; top: 560px" data-layout-ignore></div>
      <div class="slash" id="pa-sl2" style="left: 770px; top: 860px" data-layout-ignore></div>
      <div id="pa-t1" class="stage">어디로 가든</div>
      <div id="pa-t2" class="stage">기본기는 법학.</div>
      <div class="mc" id="pa-m0" style="left: 90px; top: 330px"><i>↗</i><b>로스쿨</b><span>지원 자격 학사학위</span></div>
      <div class="mc" id="pa-m1" style="left: 600px; top: 300px"><i>↗</i><b>로펌·법무팀</b><span>법학 전공으로 증명</span></div>
      <div class="mc" id="pa-m2" style="left: 300px; top: 1010px"><i>↗</i><b>경찰·공무원</b><span>수험 과목과 학위를 함께</span></div>
      <div id="pa-fine" class="stage">※ 로스쿨 입학·인턴·채용 여부는 각 기관의 선발 기준에 따릅니다.</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const CAM = "#paths-cam", BG = "#paths-bg";

    const D = 3.44;
    const B = {"41": 0.0, "42": 0.45, "43": 0.89, "44": 1.34, "45": 1.79, "46": 2.24, "47": 2.62, "48": 3.0};
    // 등장: 블러 → 선명, 짧고 정확하게. 오버슈트 없음
    function IN(sel, t, from, dur) {
      const f = Object.assign({ opacity: 0, filter: "blur(12px)" }, from || {});
      const to = { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power3.out" };
      for (const k in f) if (!(k in to)) to[k] = k.startsWith("scale") ? 1 : 0;
      tl.fromTo(sel, f, to, t);
    }
    // 퇴장: 다음 비트 직전에 짧게 빠짐
    function OUT(sel, t, to) {
      tl.to(sel, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.07, ease: "power2.in" }, to || {}), t - 0.07);
    }
    // 카메라: 씬 내내 한 방향으로 천천히 다가감 (펌프·흔들림 없음)
    tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: 3.44, ease: "none" }, 0);
    tl.fromTo(BG, { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);


    // B41 이 길이 · B42 칼선 · B43~B45 진로 카드 · B46 가까워져요 · B47 면책
    const rot = [-8, 7, -4];
    IN("#pa-t1", B[41], { scale: 1.3, filter: "blur(18px)" }, 0.22);
    tl.fromTo(["#pa-sl1", "#pa-sl2"], { scaleY: 0, rotation: 18, opacity: 1 }, { scaleY: 1, rotation: 18, duration: 0.12, ease: "power3.out", stagger: 0.04 }, B[42]);
    tl.to(["#pa-sl1", "#pa-sl2"], { opacity: 0, duration: 0.12 }, B[42] + 0.24);
    [43, 44, 45].forEach((b, i) => {
      tl.fromTo(`#pa-m${i}`, { opacity: 0, y: i === 2 ? 220 : -220, rotation: rot[i] }, { opacity: 1, y: 0, rotation: rot[i], duration: 0.22, ease: "power3.out" }, B[b]);
    });
    IN("#pa-t2", B[46], { y: 40 });
    IN("#pa-fine", B[46], {}, 0.2);
    OUT(CAM, D, {});

    window.__timelines["paths"] = tl;
  </script>
