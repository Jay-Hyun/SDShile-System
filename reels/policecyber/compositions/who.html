<template>
  <style>
    @font-face {
      font-family: "PretendardGOV";
      src: url("assets/fonts/PretendardGOVVariable.woff2") format("woff2");
      font-weight: 100 900;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "PretendardGOV", sans-serif;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }
    .stage {
      position: absolute;
      left: 80px;
      width: 920px;
      text-align: center;
    }
    .w {
      display: inline-block;
    }
    .cam {
      position: absolute;
      inset: 0;
    }
    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(55% 35% at 85% 85%, rgba(224, 194, 126, 0.95), rgba(224, 194, 126, 0) 100%),
        radial-gradient(60% 40% at 10% 20%, rgba(11, 26, 51, 1), rgba(11, 26, 51, 0) 100%),
        radial-gradient(70% 45% at 40% 60%, #2e5cbe, rgba(46, 92, 190, 0) 100%),
        linear-gradient(160deg, #12264a 0%, #2e5cbe 55%, #c9a666 100%);
    }
    .bgl {
      position: absolute;
      inset: 0;
    }

    #root { color: #0b1a33; background: #fbf9f4; }
    #wh-label { top: 490px; font-size: 60px; font-weight: 800; color: #6b6660; }
    #wh-row { position: absolute; left: 0; width: 1080px; top: 570px; height: 390px; }
    #wh-box { position: absolute; left: 170px; top: 143px; width: 104px; height: 104px; border-radius: 22px; background: #2e5cbe; display: flex; align-items: center; justify-content: center; }
    #wh-box svg { width: 70px; height: 70px; }
    #wh-list { position: absolute; left: 310px; top: 0; }
    .wi { height: 130px; font-size: 100px; font-weight: 900; line-height: 130px; white-space: nowrap; }
    #wh-ok { top: 680px; font-size: 220px; font-weight: 900; line-height: 1; }
    #wh-ok b { color: #2e5cbe; }
    #wh-sub { top: 950px; font-size: 56px; font-weight: 800; }

  </style>
  <div id="root" data-composition-id="who" data-width="1080" data-height="1920">
    <div id="who-bg" class="bgl" data-layout-ignore></div>
    <div id="who-cam" class="cam" data-layout-allow-overlap>
      <div id="wh-label" class="stage">이런 분도 시작해요</div>
      <div id="wh-row" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="wh-box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div id="wh-list"><div class="wi" id="wh-i0">직장인</div><div class="wi" id="wh-i1">비전공자</div><div class="wi" id="wh-i2">수험생</div><div class="wi" id="wh-i3">로스쿨 준비생</div></div>
      </div>
      <div id="wh-ok" class="stage" data-layout-allow-overlap>누구나 <b>OK</b></div>
      <div id="wh-sub" class="stage">법을 처음 배워도 괜찮아요</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const CAM = "#who-cam", BG = "#who-bg";

    const D = 2.7;
    const B = {"9": 0.0, "10": 0.46, "11": 0.91, "12": 1.36, "13": 1.81, "14": 2.25};
    // 등장: 블러 → 선명, 짧고 정확하게. 오버슈트 없음
    function IN(sel, t, from, dur) {
      const f = Object.assign({ opacity: 0, filter: "blur(12px)" }, from || {});
      const to = { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power3.out" };
      for (const k in f) if (!(k in to)) to[k] = k.startsWith("scale") ? 1 : 0;
      tl.fromTo(sel, f, to, t);
    }
    // 퇴장: 다음 비트 직전에 짧게 빠짐
    function OUT(sel, t, to) {
      tl.to(sel, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.07, ease: "power2.in" }, to || {}), t - 0.07);
    }
    // 카메라: 씬 내내 한 방향으로 천천히 다가감 (펌프·흔들림 없음)
    tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: 2.7, ease: "none" }, 0);
    tl.fromTo(BG, { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);


    // B9 체크 + 직장인 · B10 비전공자 · B11 수험생 · B12 로스쿨 준비생 · B13 누구나 OK · B14 서브
    const LH = 130;
    IN("#wh-label", B[9], { y: -20 });
    IN("#wh-box", B[9], { scale: 0.6 }, 0.14);
    tl.fromTo("#wh-box svg path", { strokeDasharray: "24 24", strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, B[9] + 0.08);
    tl.set("#wh-list", { y: LH }, 0);
    tl.fromTo(".wi", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#wh-i1", { opacity: 0 }, { opacity: 0.16, duration: 0.01 }, 0);
    [9, 10, 11, 12].forEach((b, i) => {
      if (i > 0) tl.to("#wh-list", { y: LH - i * LH, duration: 0.16, ease: "power3.out" }, B[b]);
      tl.to(`#wh-i${i}`, { opacity: 1, duration: 0.1 }, B[b]);
      if (i > 0) tl.to(`#wh-i${i - 1}`, { opacity: 0.16, duration: 0.1 }, B[b]);
      if (i > 1) tl.to(`#wh-i${i - 2}`, { opacity: 0, duration: 0.1 }, B[b]);
      if (i > 0 && i < 3) tl.to(`#wh-i${i + 1}`, { opacity: 0.16, duration: 0.1 }, B[b]);
    });
    // B13: 리스트가 한 줄로 모이며 같은 자리에 '누구나 OK'
    OUT(["#wh-row", "#wh-label"], B[13], { scaleY: 0.3 });
    IN("#wh-ok", B[13], { scale: 1.1 });
    IN("#wh-sub", B[13] + 0.12, { y: 30 });
    OUT(CAM, D, {});

    window.__timelines["who"] = tl;
  </script>
</template>
