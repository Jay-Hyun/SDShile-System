  <style>

    #root {

        #fbf9f4;
      --ink-tone:
        radial-gradient(70% 40% at 50% 35%, rgba(46, 92, 190, 0.3), rgba(46, 92, 190, 0) 100%),
        radial-gradient(55% 35% at 95% 100%, rgba(224, 194, 126, 0.14), rgba(224, 194, 126, 0) 100%),
        #0a1020;
      /* 패턴(씬 내용별) */
      --pat-ruled:
        repeating-linear-gradient(0deg, rgba(11, 26, 51, 0.045) 0 2px, rgba(11, 26, 51, 0) 2px 72px),
        linear-gradient(90deg, rgba(0, 0, 0, 0) 0 118px, rgba(184, 149, 90, 0.2) 118px 120px, rgba(0, 0, 0, 0) 120px);
      --pat-dots: radial-gradient(circle, rgba(11, 26, 51, 0.09) 1.8px, rgba(11, 26, 51, 0) 2px) 0 0 / 36px 36px;
      --pat-guilloche:
        repeating-radial-gradient(circle at 50% 42%, rgba(184, 149, 90, 0.12) 0 2px, rgba(184, 149, 90, 0) 2px 24px),
        repeating-radial-gradient(circle at 50% 42%, rgba(46, 92, 190, 0.05) 0 1px, rgba(46, 92, 190, 0) 1px 9px);
      --pat-hatch: repeating-linear-gradient(45deg, rgba(11, 26, 51, 0.04) 0 2px, rgba(11, 26, 51, 0) 2px 30px);
      --pat-rings: repeating-radial-gradient(circle at 50% 55%, rgba(46, 92, 190, 0.07) 0 2px, rgba(46, 92, 190, 0) 2px 64px);
      --pat-stars: radial-gradient(circle, rgba(255, 255, 255, 0.07) 1.6px, rgba(255, 255, 255, 0) 1.8px) 0 0 / 40px 40px;
      --pat-topo:
        repeating-radial-gradient(ellipse 120% 80% at 15% 85%, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 46px),
        repeating-radial-gradient(ellipse 90% 70% at 90% 10%, rgba(224, 194, 126, 0.05) 0 2px, rgba(224, 194, 126, 0) 2px 58px);
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "PretendardGOV", sans-serif;

      word-break: keep-all;
    }
    .stage {
      position: absolute;
      left: 80px;

    .w {

    .cam {
      position: absolute;
      inset: 0;

    .mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(55% 35% at 85% 85%, rgba(224, 194, 126, 0.95), rgba(224, 194, 126, 0) 100%),
        radial-gradient(60% 40% at 10% 20%, rgba(11, 26, 51, 1), rgba(11, 26, 51, 0) 100%),
        radial-gradient(70% 45% at 40% 60%, #2e5cbe, rgba(46, 92, 190, 0) 100%),
        linear-gradient(160deg, #12264a 0%, #2e5cbe 55%, #c9a666 100%);
    }
    .mesh::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        var(--noise),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 120px);
    }
    /* 그라데이션 씬 변형: 가는 주사선 */
    .mesh.scan::after {
      background:
        var(--noise),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(255, 255, 255, 0) 2px 14px);
    }
    .bgl {
      position: absolute;
      inset: 0;
    }

    #root { color: #ffffff; background: var(--noise), var(--pat-stars), var(--ink-tone); }
    #tg-q { top: 700px; font-size: 150px; font-weight: 900; line-height: 1; white-space: nowrap; color: rgba(255, 255, 255, 0.62); }
    #tg-line { top: 880px; font-size: 150px; font-weight: 900; line-height: 1; white-space: nowrap; }
    #tg-yes { color: #f0d595; }
    #tg-badge { top: 1100px; display: flex; justify-content: center; }
    #tg-badge div { height: 92px; padding: 0 40px; border-radius: 999px; background: radial-gradient(circle at 30% 30%, #fff2c9, #e0c27e 50%, #b8955a 100%); color: #0b1a33; font-size: 46px; font-weight: 900; display: flex; align-items: center; letter-spacing: -0.03em; }
    #tg-sub { top: 1220px; font-size: 48px; font-weight: 800; color: rgba(255, 255, 255, 0.88); }
    .chip { position: absolute; height: 84px; padding: 0 30px; border-radius: 22px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.22); font-size: 38px; font-weight: 800; display: flex; align-items: center; white-space: nowrap; letter-spacing: -0.03em; }

  </style>
  <div id="root" data-composition-id="together" data-width="1080" data-height="1920">
    <div id="together-bg" class="bgl" data-layout-ignore></div>
    <div id="together-cam" class="cam" data-layout-allow-overlap>
      <div id="tg-q" class="stage">공부는 혼자,</div>
      <div id="tg-line" class="stage">계획은 <span id="tg-yes">같이.</span></div>
      <div id="tg-badge" class="stage"><div>1:1 학습플래너</div></div>
      <div id="tg-sub" class="stage">내 일정에 맞춰 짜 드려요</div>
      <div class="chip" id="tg-c0" style="left: 110px; top: 250px">퇴근 후 1시간</div>
      <div class="chip" id="tg-c1" style="left: 610px; top: 220px">주말 집중 플랜</div>
      <div class="chip" id="tg-c2" style="left: 90px; top: 400px">진도 체크</div>
      <div class="chip" id="tg-c3" style="left: 730px; top: 380px">시험 대비</div>
      <div class="chip" id="tg-c4" style="left: 200px; top: 540px">과목 추천</div>
      <div class="chip" id="tg-c5" style="left: 640px; top: 530px">맞춤 일정</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const CAM = "#together-cam", BG = "#together-bg";

    const D = 2.71;
    const B = {"27": 0.0, "28": 0.46, "29": 0.9, "30": 1.36, "31": 1.81, "32": 2.25};
    // 등장: 블러 → 선명, 짧고 정확하게. 오버슈트 없음
    function IN(sel, t, from, dur) {
      const f = Object.assign({ opacity: 0, filter: "blur(12px)" }, from || {});
      const to = { opacity: 1, filter: "blur(0px)", duration: dur || 0.16, ease: "power3.out" };
      for (const k in f) if (!(k in to)) to[k] = k.startsWith("scale") ? 1 : 0;
      tl.fromTo(sel, f, to, t);
    }
    // 퇴장: 다음 비트 직전에 짧게 빠짐
    function OUT(sel, t, to) {
      tl.to(sel, Object.assign({ opacity: 0, filter: "blur(10px)", duration: 0.07, ease: "power2.in" }, to || {}), t - 0.07);
    }
    // 카메라: 씬 내내 한 방향으로 천천히 다가감 (펌프·흔들림 없음)
    tl.fromTo(CAM, { scale: 1 }, { scale: 1.06, duration: 2.71, ease: "none" }, 0);
    tl.fromTo(BG, { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);


    // B27 공부는 혼자, · B28 계획은 같이. · B29 1:1 학습플래너 배지 · B30 서브 · B31 플랜 칩
    const rot = [-6, 5, 4, -5, -3, 4];
    IN("#tg-q", B[27], { scale: 1.1 });
    IN("#tg-line", B[28], { y: 60 });
    IN("#tg-badge div", B[29], { y: 30 });
    IN("#tg-sub", B[30], { y: 30 });
    rot.forEach((r, i) => {
      tl.fromTo(`#tg-c${i}`, { opacity: 0, rotation: r, filter: "blur(8px)" }, { opacity: 1, rotation: r, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, B[31] + i * 0.03);
    });
    OUT(CAM, D, {});

    window.__timelines["together"] = tl;
  </script>
</template>
