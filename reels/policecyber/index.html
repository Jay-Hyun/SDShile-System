<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1a33;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- 배경 세계: 법원 실루엣 + 길. 씬마다 가까워짐 -->
      <div id="world" class="clip" data-composition-id="world" data-composition-src="compositions/world.html"
        data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="start" class="clip" data-composition-id="start" data-composition-src="compositions/start.html"
        data-start="6" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="online" class="clip" data-composition-id="online" data-composition-src="compositions/online.html"
        data-start="10" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="planner" class="clip" data-composition-id="planner" data-composition-src="compositions/planner.html"
        data-start="14" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="degree" class="clip" data-composition-id="degree" data-composition-src="compositions/degree.html"
        data-start="18" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="paths" class="clip" data-composition-id="paths" data-composition-src="compositions/paths.html"
        data-start="22" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="26" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- BGM (Pixabay): assets/music/bgm.mp3 를 넣으면 활성화 -->
      <!--BGM-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
