<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1a33;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="poster" class="clip" data-composition-id="poster" data-composition-src="compositions/poster.html"
        data-start="0" data-duration="3.27" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="hook2" class="clip" data-composition-id="hook2" data-composition-src="compositions/hook2.html"
        data-start="3.27" data-duration="5.17" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="online" class="clip" data-composition-id="online" data-composition-src="compositions/online.html"
        data-start="8.44" data-duration="2.69" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="start" class="clip" data-composition-id="start" data-composition-src="compositions/start.html"
        data-start="11.13" data-duration="2.56" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="degree" class="clip" data-composition-id="degree" data-composition-src="compositions/degree.html"
        data-start="13.69" data-duration="3.15" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="planner" class="clip" data-composition-id="planner" data-composition-src="compositions/planner.html"
        data-start="16.84" data-duration="2.55" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="paths" class="clip" data-composition-id="paths" data-composition-src="compositions/paths.html"
        data-start="19.39" data-duration="4.34" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="23.73" data-duration="6.27" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- BGM: "Event - Event Music" (lNPLUSMUSIC, Pixabay #611920). 30초 컷 -->
      <audio id="bgm" class="clip" src="assets/music/bgm.mp3" data-start="0" data-duration="30" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
